  { icon:"🇪🇸", title:{es:"Repaso en Español",en:"Spanish Recap"},
    html:{ es:`<div class="gdesc">En español un verbo cambia de sentido con otra palabra: «dar» ≠ «dar<b>se</b> cuenta»; «poner» ≠ «poner<b>se</b>».</div>
        <div class="art-hero three"><div class="art-box"><div class="word">cancelar</div><div class="role">call off</div><div class="desc">Cancelaron la clase.</div></div><div class="art-box"><div class="word">dejar para después</div><div class="role">put off</div><div class="desc">No dejes la reparación para después.</div></div><div class="art-box"><div class="word">cuidar de</div><div class="role">look after</div><div class="desc">Ella cuida a su mamá.</div></div></div>

        <div class="gnote life">🌎 <b>De tu vida:</b> «llenar el formulario» = <i>fill in the form</i>; «anotar la hora» = <i>write the hour down</i>.</div>`, en:`<div class="gdesc">In Spanish a verb changes meaning with another word: «dar» ≠ «darse cuenta»; «poner» ≠ «ponerse».</div>
        <div class="art-hero three"><div class="art-box"><div class="word">cancelar</div><div class="role">call off</div><div class="desc">Cancelaron la clase.</div></div><div class="art-box"><div class="word">dejar para después</div><div class="role">put off</div><div class="desc">No dejes la reparación para después.</div></div><div class="art-box"><div class="word">cuidar de</div><div class="role">look after</div><div class="desc">Ella cuida a su mamá.</div></div></div>

        <div class="gnote life">🌎 <b>From your life:</b> «llenar el formulario» = <i>fill in the form</i>; «anotar la hora» = <i>write the hour down</i>.</div>` },

      { q:{es:"«Put off» significa…",en:"«Put off» means…"}, opts:{es:["Dejar para después","Apagar la luz"],en:["Postpone","Turn off the light"]}, correct:0, fb:{ why:{es:"Es posponer.",en:"It is to postpone."}, tip:{es:"put off = posponer",en:"put off = postpone"}} },
      { q:{es:"«Look after» significa…",en:"«Look after» means…"}, opts:{es:["Cuidar de alguien","Mirar hacia atrás"],en:["Take care of someone","Look backwards"]}, correct:0, fb:{ why:{es:"Es cuidar.",en:"It means to take care."}, tip:{es:"look after = cuidar",en:"look after = take care of"}} },
      { q:{es:"¿Por qué hay que aprenderlos completos?",en:"Why should you learn them whole?"}, opts:{es:["Porque la partícula cambia el sentido","Porque son más cortos"],en:["Because the particle changes the meaning","Because they are shorter"]}, correct:0, fb:{ why:{es:"El verbo solo significa otra cosa.",en:"The bare verb means something else."}, tip:{es:"aprende el par completo",en:"learn the whole pair"}} }
    ] },
  { icon:"🤝", title:{es:"Similitudes",en:"Similarities"},
    html:{ es:`<div class="gdesc">Los dos idiomas tienen verbos cuyo significado cambia con una palabrita.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">❌</span><span class="lbl">call off</span><span class="es">cancelar</span></div><div class="viz-item"><span class="ico">⏭️</span><span class="lbl">put off</span><span class="es">posponer</span></div><div class="viz-item"><span class="ico">✍️</span><span class="lbl">fill in</span><span class="es">llenar</span></div><div class="viz-item"><span class="ico">📝</span><span class="lbl">write down</span><span class="es">anotar</span></div><div class="viz-item"><span class="ico">🚕</span><span class="lbl">pick up</span><span class="es">recoger</span></div><div class="viz-item"><span class="ico">👵</span><span class="lbl">look after</span><span class="es">cuidar</span></div></div>
        ${eg("\"They <span class=\"tag s\">called off</span> the class because the teacher was ill.\"","Cancelaron la clase porque el profesor estaba enfermo.","ok")}
        ${eg("\"Bring your ID and this record number. <span class=\"tag s\">Write it down</span>, please.\"","Traiga su documento y este número de registro. Anótelo, por favor.","ok")}
        ${eg("\"Could you <span class=\"tag s\">pick me up</span> at the airport at six?\"","¿Podrías recogerme en el aeropuerto a las seis?","ok")}
        <div class="sec-label">Lo igual en los dos idiomas</div>
        <ul class="simlist"><li>Los dos cambian el sentido con una partícula.</li><li>Los dos son muy comunes al hablar de trámites y citas.</li><li>En los dos conviene aprender el verbo con su objeto: <i>call off the class</i>.</li></ul>
        <div class="gnote">👍 call off · put off · fill in · write down · pick up · look after · get on with · run into.</div>`, en:`<div class="gdesc">Both languages have verbs whose meaning changes with a small word.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">❌</span><span class="lbl">call off</span><span class="es">cancelar</span></div><div class="viz-item"><span class="ico">⏭️</span><span class="lbl">put off</span><span class="es">posponer</span></div><div class="viz-item"><span class="ico">✍️</span><span class="lbl">fill in</span><span class="es">llenar</span></div><div class="viz-item"><span class="ico">📝</span><span class="lbl">write down</span><span class="es">anotar</span></div><div class="viz-item"><span class="ico">🚕</span><span class="lbl">pick up</span><span class="es">recoger</span></div><div class="viz-item"><span class="ico">👵</span><span class="lbl">look after</span><span class="es">cuidar</span></div></div>
        ${eg("\"They <span class=\"tag s\">called off</span> the class because the teacher was ill.\"","Cancelaron la clase porque el profesor estaba enfermo.","ok")}
        ${eg("\"Bring your ID and this record number. <span class=\"tag s\">Write it down</span>, please.\"","Traiga su documento y este número de registro. Anótelo, por favor.","ok")}
        ${eg("\"Could you <span class=\"tag s\">pick me up</span> at the airport at six?\"","¿Podrías recogerme en el aeropuerto a las seis?","ok")}
        <div class="sec-label">What is the same in both languages</div>
        <ul class="simlist"><li>Both change the meaning with a particle.</li><li>Both are very common when talking about appointments and paperwork.</li><li>In both it is best to learn the verb with its object: <i>call off the class</i>.</li></ul>
        <div class="gnote">👍 call off · put off · fill in · write down · pick up · look after · get on with · run into.</div>` },
    checks:[
      { q:{es:"«cancelaron la clase» = ",en:"«they called off the class» = "}, opts:{es:["they called off the class","they called the class"],en:["they called off the class","they called the class"]}, correct:0, fb:{ why:{es:"Sin «off» significa otra cosa.",en:"Without «off» it means something else."}, ex:{es:"\"They called off the class because the teacher was ill.\"",en:"\"They called off the class because the teacher was ill.\""}} },
      { q:{es:"«anótalo» = ",en:"«write it down» = "}, opts:{es:["write it down","write down it"],en:["write it down","write down it"]}, correct:0, fb:{ why:{es:"El pronombre va en el medio.",en:"The pronoun goes in the middle."}, ex:{es:"\"Bring your ID and this record number. Write it down, please.\"",en:"\"Bring your ID and this record number. Write it down, please.\""}} },
      { q:{es:"«recógeme» = ",en:"«pick me up» = "}, opts:{es:["pick me up","pick up me"],en:["pick me up","pick up me"]}, correct:0, fb:{ why:{es:"Con pronombre se abre.",en:"With a pronoun it splits."}, ex:{es:"\"Could you pick me up at the airport at six?\"",en:"\"Could you pick me up at the airport at six?\""}} },
      { q:{es:"«llenar el formulario» = ",en:"«fill in the form» = "}, opts:{es:["fill in the form","fill the in form"],en:["fill in the form","fill the in form"]}, correct:0, fb:{ why:{es:"El objeto va después o en el medio, no dentro del phrasal.",en:"The object goes after or in the middle, never inside the phrasal."}, ex:{es:"\"Here it is. I filled it in yesterday, with a blue pen.\"",en:"\"Here it is. I filled it in yesterday, with a blue pen.\""}} },
      { q:{es:"«cuidar a su mamá» = ",en:"«look after her mother» = "}, opts:{es:["look after her mother","look her mother after"],en:["look after her mother","look her mother after"]}, correct:0, fb:{ why:{es:"«Look after» no se abre.",en:"«Look after» never splits."}, tip:{es:"inseparable",en:"inseparable"}} }
    ] },
  { icon:"⚡", title:{es:"Diferencias",en:"Differences"},
    html:{ es:`<div class="gdesc">La diferencia grande: unos phrasal verbs <b>se abren</b> y otros <b>no</b>.</div>
        <table class="dtab"><tr><th>Tipo</th><th>Regla</th><th>Ejemplo</th></tr><tr><td>Separable</td><td class="en">verbo + objeto + partícula o verbo + partícula + objeto</td><td>fill in the form / fill the form in</td></tr><tr><td>Separable + pronombre</td><td class="en">el pronombre va SIEMPRE en el medio</td><td>fill it in · write it down · put it off</td></tr><tr><td>Inseparable</td><td class="en">nunca se abre</td><td>look after the children · get on with Ana</td></tr><tr><td>Del módulo</td><td class="en">call off · put off · pick up · write down</td><td>They called the class off.</td></tr><tr><td>Inseparables comunes</td><td class="en">look after · get on with · run into</td><td>I ran into Mrs. Vidal at the office.</td></tr></table>
        <div class="sec-label">⚠️ Dos avisos que valen nota</div>
        ${ii("🚫","Con pronombre nunca al final: <i>put <s>off it</s></i> → <b>put it off</b>.")}
        ${ii("🧩","Los inseparables no se abren aunque el objeto sea corto: <i>look <s>him</s> after</i> ✗.")}
        ${eg("We had to <span class=\"tag s\">put off</span> the appointment until Thursday.","Tuvimos que posponer la cita hasta el jueves.","ok")}
        ${eg("We had to put off it until Thursday.","Con pronombre: <b>put it off</b>.","bad")}
        ${eg("She <span class=\"tag s\">looks after</span> her mother, so mornings are difficult.","Ella cuida a su mamá, así que las mañanas son difíciles.","ok")}
        <div class="gnote">📍 Separable: objeto libre, pronombre en el medio · Inseparable: nunca se abre.</div>`, en:`<div class="gdesc">The big difference: some phrasal verbs <b>split</b> and others <b>do not</b>.</div>
        <table class="dtab"><tr><th>Type</th><th>Rule</th><th>Example</th></tr><tr><td>Separable</td><td class="en">verb + object + particle or verb + particle + object</td><td>fill in the form / fill the form in</td></tr><tr><td>Separable + pronoun</td><td class="en">the pronoun ALWAYS goes in the middle</td><td>fill it in · write it down · put it off</td></tr><tr><td>Inseparable</td><td class="en">never splits</td><td>look after the children · get on with Ana</td></tr><tr><td>From this module</td><td class="en">call off · put off · pick up · write down</td><td>They called the class off.</td></tr><tr><td>Common inseparable</td><td class="en">look after · get on with · run into</td><td>I ran into Mrs. Vidal at the office.</td></tr></table>
        <div class="sec-label">⚠️ Two warnings worth marks</div>
        ${ii("🚫","Never a pronoun at the end: <i>put <s>off it</s></i> → <b>put it off</b>.")}
        ${ii("🧩","Inseparable verbs do not split even with a short object: <i>look <s>him</s> after</i> ✗.")}
        ${eg("We had to <span class=\"tag s\">put off</span> the appointment until Thursday.","Tuvimos que posponer la cita hasta el jueves.","ok")}
        ${eg("We had to put off it until Thursday.","Con pronombre: <b>put it off</b>.","bad")}
        ${eg("She <span class=\"tag s\">looks after</span> her mother, so mornings are difficult.","Ella cuida a su mamá, así que las mañanas son difíciles.","ok")}
        <div class="gnote">📍 Separable: free object, pronoun in the middle · Inseparable: never splits.</div>` },
    checks:[
      { q:{es:"¿Cuál está bien?",en:"Which one is right?"}, opts:{es:["They put it off","They put off it"],en:["They put it off","They put off it"]}, correct:0, fb:{ why:{es:"El pronombre va en el medio.",en:"The pronoun goes in the middle."}, tip:{es:"put it off",en:"put it off"}} },
      { q:{es:"¿Cuál está bien?",en:"Which one is right?"}, opts:{es:["I look after my brother","I look my brother after"],en:["I look after my brother","I look my brother after"]}, correct:0, fb:{ why:{es:"«Look after» es inseparable.",en:"«Look after» is inseparable."}, tip:{es:"inseparable",en:"inseparable"}} },

      { q:{es:"«me encontré con la señora Vidal» = ",en:"«I ran into Mrs. Vidal» = "}, opts:{es:["I ran into Mrs. Vidal","I ran Mrs. Vidal into"],en:["I ran into Mrs. Vidal","I ran Mrs. Vidal into"]}, correct:0, fb:{ why:{es:"«Run into» es inseparable.",en:"«Run into» is inseparable."}, tip:{es:"inseparable",en:"inseparable"}} }
    ] },
  { icon:"💡", title:{es:"Tips Prácticos",en:"Practical Tips"},
    html:{ es:`<div class="gdesc">Una prueba de tres segundos y ya sabes si se abre o no.</div>
        <div class="fbox"><div class="frm"><span class="pill s">sujeto</span><span class="plus">+</span><span class="pill v">verbo</span><span class="plus">+</span><span class="pill o">pronombre</span><span class="plus">+</span><span class="pill c">partícula</span></div><div class="fex"><span class="en">Write it down, please.</span><span class="es">Anótalo, por favor.</span></div></div>
        <div class="fbox"><div class="frm"><span class="pill s">sujeto</span><span class="plus">+</span><span class="pill v">verbo + partícula</span><span class="plus">+</span><span class="pill o">objeto</span></div><div class="fex"><span class="en">She looks after her mother.</span><span class="es">Ella cuida a su mamá.</span></div></div>
        ${ii("🧠","<b>Tip 1 — la prueba del «it»:</b> si <i>put it off</i> suena bien, es <b>separable</b>. Si solo funciona <i>look after it</i>, es <b>inseparable</b>.")}

        ${ii("⚡","En el módulo: <i>I don’t want to <b>put it off</b> until the afternoon</i>, <i>a change that nobody <b>writes down</b></i>.")}`, en:`<div class="gdesc">A three-second test tells you if it splits or not.</div>

        <div class="fbox"><div class="frm"><span class="pill s">subject</span><span class="plus">+</span><span class="pill v">verb + particle</span><span class="plus">+</span><span class="pill o">object</span></div><div class="fex"><span class="en">She looks after her mother.</span><span class="es">Ella cuida a su mamá.</span></div></div>

        ${ii("💥","<b>Tip 2 — learn it with an object:</b> <i>call off the class</i>, not a bare «call off».")}
        ${ii("📢","<b>Tip 3 — for paperwork:</b> fill in, write down, pick up and put off are the ones you will use most.")}
