        · El botón ES/EN cambia TODO el material (explicación + indicaciones + auto-chequeos).
        · REGLA «el español se queda en español»: cuando el texto MENCIONA una palabra española o da un
          EJEMPLO en español (p. ej. el paso 1 «Repaso en Español»: «Él», «Ella», «Nosotros», «Juan… Él…»),

        · 'tr' (botón 🌐 traducción por pregunta): ponlo SOLO en auto-chequeos donde una oración en inglés
          tenga vocabulario que pueda frenar al alumno Y la traducción NO delate la respuesta. En drills de

<script>
/* ═══ METADATOS ═══ */
const MAT = { title:{es:'Resumen de Gramática',en:'Grammar Summary'}, subtitle:{es:"Adverbios de Grado",en:"Adverbs of Degree"}, reportId:"sum-adverbs-degree" };
const PASS = 75;
const STEPS = [
  { icon:"🇪🇸", title:{es:"Repaso en Español",en:"Spanish Recap"},
    html:{ es:`<div class="gdesc">El español gradúa con «muy», «bastante», «un poco» o «realmente»: dicen <b>cuánto</b>, no cómo.</div>
        <div class="art-hero three"><div class="art-box"><div class="word">muy ocupado</div><div class="role">fuerte</div><div class="desc">La oficina está muy ocupada hoy.</div></div><div class="art-box"><div class="word">bastante fácil</div><div class="role">medio</div><div class="desc">El formulario fue bastante fácil.</div></div><div class="art-box"><div class="word">un poco tarde</div><div class="role">suave</div><div class="desc">La respuesta llegó un poco tarde.</div></div></div>
        ${ii("🎚️","El adverbio de grado <b>sube o baja el volumen</b> del adjetivo: ocupado → muy ocupado.")}
        <div class="gnote life">🌎 <b>De tu vida:</b> «La cola estaba bastante larga» suaviza; «estaba realmente larga» refuerza.</div>`, en:`<div class="gdesc">Spanish grades with «muy», «bastante», «un poco» or «realmente»: they say <b>how much</b>, not how.</div>
        <div class="art-hero three"><div class="art-box"><div class="word">muy ocupado</div><div class="role">strong</div><div class="desc">La oficina está muy ocupada hoy.</div></div><div class="art-box"><div class="word">bastante fácil</div><div class="role">medium</div><div class="desc">El formulario fue bastante fácil.</div></div><div class="art-box"><div class="word">un poco tarde</div><div class="role">soft</div><div class="desc">La respuesta llegó un poco tarde.</div></div></div>
        ${ii("🎚️","An adverb of degree <b>turns the volume up or down</b> on the adjective: busy → very busy.")}
        <div class="gnote life">🌎 <b>From your life:</b> «The queue was quite long» softens; «it was really long» strengthens.</div>` },
    checks:[
      { q:{es:"«Muy ocupado» dice…",en:"«Very busy» tells you…"}, opts:{es:["Cuánto","Cuándo"],en:["How much","When"]}, correct:0, fb:{ why:{es:"Gradúa el adjetivo.",en:"It grades the adjective."}, tip:{es:"grado = cuánto",en:"degree = how much"}} },
      { q:{es:"«Bastante fácil» es…",en:"«Quite easy» is…"}, opts:{es:["Menos que «muy fácil»","Más que «muy fácil»"],en:["Less than «very easy»","More than «very easy»"]}, correct:0, fb:{ why:{es:"«Bastante» suaviza.",en:"«Quite» softens."}, tip:{es:"bastante < muy",en:"quite < very"}} },
      { q:{es:"¿Dónde va el adverbio de grado?",en:"Where does the adverb of degree go?"}, opts:{es:["Antes del adjetivo","Al final de la oración"],en:["Before the adjective","At the end of the sentence"]}, correct:0, fb:{ why:{es:"Va pegado a la palabra que gradúa.",en:"It sits next to the word it grades."}, tip:{es:"muy + adjetivo",en:"very + adjective"}} },
      { q:{es:"«Un poco tarde» suena…",en:"«A bit late» sounds…"}, opts:{es:["Suave","Muy fuerte"],en:["Soft","Very strong"]}, correct:0, fb:{ why:{es:"Baja la intensidad.",en:"It lowers the intensity."}, tip:{es:"un poco = a bit",en:"a bit = un poco"}} },
      { q:{es:"«Realmente cansada» expresa…",en:"«Really tired» expresses…"}, opts:{es:["Mucha intensidad","Poca intensidad"],en:["High intensity","Low intensity"]}, correct:0, fb:{ why:{es:"«Realmente» refuerza.",en:"«Really» strengthens."}, tip:{es:"really = mucho",en:"really = a lot"}} }
    ] },
  { icon:"🤝", title:{es:"Similitudes",en:"Similarities"},
    html:{ es:`<div class="gdesc">Los dos idiomas ponen la palabra de grado <b>delante</b> del adjetivo.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">🔥</span><span class="lbl">really</span><span class="es">realmente / muy</span></div><div class="viz-item"><span class="ico">👍</span><span class="lbl">quite</span><span class="es">bastante</span></div><div class="viz-item"><span class="ico">😐</span><span class="lbl">rather</span><span class="es">algo / más bien</span></div><div class="viz-item"><span class="ico">🙂</span><span class="lbl">fairly</span><span class="es">bastante (suave)</span></div><div class="viz-item"><span class="ico">🤏</span><span class="lbl">a bit</span><span class="es">un poco</span></div><div class="viz-item"><span class="ico">💪</span><span class="lbl">very</span><span class="es">muy</span></div></div>
        ${eg("Mr. Ortega is <span class=\"tag s\">quite busy</span>, because he is preparing an exam.","El señor Ortega está bastante ocupado, porque está preparando un examen.","ok")}
        ${eg("Yes, and she is <span class=\"tag s\">quite tired</span>. It was a long night.","Sí, y está bastante cansada. Fue una noche larga.","ok")}
        ${eg("We are <span class=\"tag s\">really hungry</span> after that road.","Tenemos mucha hambre después de esa carretera.","ok")}
        <div class="sec-label">Lo igual en los dos idiomas</div>
        <ul class="simlist"><li>Los dos gradúan adjetivos y adverbios: <i>bastante rápido</i> / <i>quite quickly</i>.</li><li>Los dos usan una sola palabra de grado por adjetivo.</li><li>Los dos tienen una escala de más fuerte a más suave.</li></ul>
        <div class="gnote">👍 really · very · quite · rather · fairly · a bit + adjetivo.</div>`, en:`<div class="gdesc">Both languages put the degree word <b>before</b> the adjective.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">🔥</span><span class="lbl">really</span><span class="es">realmente / muy</span></div><div class="viz-item"><span class="ico">👍</span><span class="lbl">quite</span><span class="es">bastante</span></div><div class="viz-item"><span class="ico">😐</span><span class="lbl">rather</span><span class="es">algo / más bien</span></div><div class="viz-item"><span class="ico">🙂</span><span class="lbl">fairly</span><span class="es">bastante (suave)</span></div><div class="viz-item"><span class="ico">🤏</span><span class="lbl">a bit</span><span class="es">un poco</span></div><div class="viz-item"><span class="ico">💪</span><span class="lbl">very</span><span class="es">muy</span></div></div>
        ${eg("Mr. Ortega is <span class=\"tag s\">quite busy</span>, because he is preparing an exam.","El señor Ortega está bastante ocupado, porque está preparando un examen.","ok")}
        ${eg("Yes, and she is <span class=\"tag s\">quite tired</span>. It was a long night.","Sí, y está bastante cansada. Fue una noche larga.","ok")}
        ${eg("We are <span class=\"tag s\">really hungry</span> after that road.","Tenemos mucha hambre después de esa carretera.","ok")}
        <div class="sec-label">What is the same in both languages</div>
        <ul class="simlist"><li>Both grade adjectives and adverbs: <i>quite quickly</i>.</li><li>Both use only one degree word per adjective.</li><li>Both have a scale from strong to soft.</li></ul>
        <div class="gnote">👍 really · very · quite · rather · fairly · a bit + adjective.</div>` },
    checks:[
      { q:{es:"«bastante ocupado» = ",en:"«quite busy» = "}, opts:{es:["quite busy","busy quite"],en:["quite busy","busy quite"]}, correct:0, fb:{ why:{es:"El grado va delante.",en:"The degree word goes first."}, ex:{es:"Mr. Ortega is quite busy.",en:"Mr. Ortega is quite busy."}} },
      { q:{es:"«realmente cansada» = ",en:"«really tired» = "}, opts:{es:["really tired","tired really"],en:["really tired","tired really"]}, correct:0, fb:{ why:{es:"Mismo orden que en español.",en:"Same order as in Spanish."}, ex:{es:"Yes, and she is quite tired.",en:"Yes, and she is quite tired."}} },
      { q:{es:"¿Cuántas palabras de grado por adjetivo?",en:"How many degree words per adjective?"}, opts:{es:["Una","Dos o tres"],en:["One","Two or three"]}, correct:0, fb:{ why:{es:"«really quite full» suena raro.",en:"«really quite full» sounds odd."}, tip:{es:"una sola",en:"only one"}} },
      { q:{es:"«muy hambrientos» = ",en:"«really hungry» = "}, opts:{es:["really hungry","hungry really"],en:["really hungry","hungry really"]}, correct:0, fb:{ why:{es:"Delante del adjetivo.",en:"Before the adjective."}, ex:{es:"We are really hungry after that road.",en:"We are really hungry after that road."}} },
      { q:{es:"El grado también acompaña a…",en:"A degree word also goes with…"}, opts:{es:["adverbios: quite quickly","sustantivos: quite office"],en:["adverbs: quite quickly","nouns: quite office"]}, correct:0, fb:{ why:{es:"Gradúa adjetivos y adverbios.",en:"It grades adjectives and adverbs."}, tip:{es:"quite carefully",en:"quite carefully"}} }
    ] },
  { icon:"⚡", title:{es:"Diferencias",en:"Differences"},
    html:{ es:`<div class="gdesc">La diferencia grande: la <b>escala</b> del inglés y la posición de <b>quite a</b>.</div>
        <table class="dtab"><tr><th>Adverbio</th><th>Fuerza / uso</th><th>Ejemplo</th></tr><tr><td>really / very</td><td class="en">muy fuerte</td><td>The office is really busy today.</td></tr><tr><td>quite</td><td class="en">medio: menos que «very»</td><td>The form was quite easy.</td></tr><tr><td>rather</td><td class="en">medio, a veces con queja</td><td>The answer came rather late.</td></tr><tr><td>fairly</td><td class="en">suave, neutral</td><td>The route is fairly straight.</td></tr><tr><td>a bit / a little</td><td class="en">muy suave</td><td>The room is a bit small.</td></tr></table>
        <div class="sec-label">⚠️ Dos avisos que valen nota</div>
        ${ii("🚫","No se apilan: <i><s>really quite</s> full</i>. Elige <b>una</b> palabra de grado.")}
        ${ii("🧩","Con <b>a/an</b> el orden cambia: <b>quite a</b> long wait (no «a quite long wait»).")}
        ${eg("It was <span class=\"tag s\">quite a</span> long hour.","Fue una hora bastante larga.","ok")}
        ${eg("It was a quite long hour.","Con artículo se dice <b>quite a</b> long hour.","bad")}
        ${eg("The answer came <span class=\"tag s\">rather late</span>.","La respuesta llegó algo tarde.","ok")}
        <div class="gnote">📍 really › quite › rather › fairly › a bit · una sola por adjetivo · quite a + adjetivo + sustantivo.</div>`, en:`<div class="gdesc">The big difference: the English <b>scale</b> and the position of <b>quite a</b>.</div>
        <table class="dtab"><tr><th>Adverb</th><th>Strength / use</th><th>Example</th></tr><tr><td>really / very</td><td class="en">very strong</td><td>The office is really busy today.</td></tr><tr><td>quite</td><td class="en">medium: less than «very»</td><td>The form was quite easy.</td></tr><tr><td>rather</td><td class="en">medium, often a complaint</td><td>The answer came rather late.</td></tr><tr><td>fairly</td><td class="en">soft, neutral</td><td>The route is fairly straight.</td></tr><tr><td>a bit / a little</td><td class="en">very soft</td><td>The room is a bit small.</td></tr></table>
        <div class="sec-label">⚠️ Two warnings worth marks</div>
        ${ii("🚫","Do not stack them: <i><s>really quite</s> full</i>. Choose <b>one</b> degree word.")}
        ${ii("🧩","With <b>a/an</b> the order changes: <b>quite a</b> long wait (not «a quite long wait»).")}
        ${eg("It was <span class=\"tag s\">quite a</span> long hour.","Fue una hora bastante larga.","ok")}
        ${eg("It was a quite long hour.","Con artículo se dice <b>quite a</b> long hour.","bad")}
        ${eg("The answer came <span class=\"tag s\">rather late</span>.","La respuesta llegó algo tarde.","ok")}
        <div class="gnote">📍 really › quite › rather › fairly › a bit · one per adjective · quite a + adjective + noun.</div>` },
    checks:[
      { q:{es:"¿Cuál es más fuerte?",en:"Which one is stronger?"}, opts:{es:["really busy","fairly busy"],en:["really busy","fairly busy"]}, correct:0, fb:{ why:{es:"«Really» está arriba en la escala.",en:"«Really» is at the top of the scale."}, tip:{es:"really › fairly",en:"really › fairly"}} },
      { q:{es:"«Fue una hora bastante larga» = ",en:"«It was quite a long hour» = "}, opts:{es:["quite a long hour","a quite long hour"],en:["quite a long hour","a quite long hour"]}, correct:0, fb:{ why:{es:"«Quite» va antes de «a».",en:"«Quite» goes before «a»."}, tip:{es:"quite a + adjetivo",en:"quite a + adjective"}} },
      { q:{es:"¿Cuál está bien?",en:"Which one is right?"}, opts:{es:["The room is quite small","The room is really quite small"],en:["The room is quite small","The room is really quite small"]}, correct:0, fb:{ why:{es:"No se apilan dos grados.",en:"Do not stack two degree words."}, tip:{es:"una sola",en:"only one"}} },
      { q:{es:"«algo tarde» (con queja) = ",en:"«rather late» (a complaint) = "}, opts:{es:["rather late","fairly late"],en:["rather late","fairly late"]}, correct:0, fb:{ why:{es:"«Rather» añade el matiz de queja.",en:"«Rather» adds the complaint."}, tip:{es:"rather = algo / más bien",en:"rather = complaint"}} },
      { q:{es:"«bastante recto» (neutral) = ",en:"«fairly straight» (neutral) = "}, opts:{es:["fairly straight","really straight"],en:["fairly straight","really straight"]}, correct:0, fb:{ why:{es:"«Fairly» es el más suave.",en:"«Fairly» is the softest."}, tip:{es:"fairly = suave",en:"fairly = soft"}} }
    ] },
  { icon:"💡", title:{es:"Tips Prácticos",en:"Practical Tips"},
    html:{ es:`<div class="gdesc">Una fórmula, una escala y un caso especial.</div>
        <div class="fbox"><div class="frm"><span class="pill s">sujeto</span><span class="plus">+</span><span class="pill v">be</span><span class="plus">+</span><span class="pill o">adverbio de grado + adjetivo</span></div><div class="fex"><span class="en">The office is really busy today.</span><span class="es">La oficina está muy ocupada hoy.</span></div></div>
        <div class="fbox"><div class="frm"><span class="pill s">quite a</span><span class="plus">+</span><span class="pill v">adjetivo</span><span class="plus">+</span><span class="pill o">sustantivo</span></div><div class="fex"><span class="en">It was quite a long hour.</span><span class="es">Fue una hora bastante larga.</span></div></div>
        ${ii("🧠","<b>Tip 1 — el dial:</b> really (alto) › quite › rather › fairly (bajo).")}
        ${ii("💥","<b>Tip 2 — «rather» suele quejarse:</b> <i>rather late</i>, <i>rather cold</i>.")}
        ${ii("📢","<b>Tip 3 — con verbos usa «really»:</b> <i>I really agree</i> (no «I am really agree»).")}
        <div class="alert-card"><div class="atitle">⚠️ Error típico</div><p>❌ «The meeting was late quite» → ✅ «The meeting was <b>quite late</b>».</p></div>
        ${ii("⚡","En el módulo: <i><b>quite</b> busy</i>, <i><b>quite</b> tired</i>, <i><b>quite</b> cold</i>, <i><b>really</b> hungry</i>, <i><b>really</b> happy</i>.")}`, en:`<div class="gdesc">One formula, one scale and one special case.</div>
        <div class="fbox"><div class="frm"><span class="pill s">subject</span><span class="plus">+</span><span class="pill v">be</span><span class="plus">+</span><span class="pill o">degree adverb + adjective</span></div><div class="fex"><span class="en">The office is really busy today.</span><span class="es">La oficina está muy ocupada hoy.</span></div></div>
        <div class="fbox"><div class="frm"><span class="pill s">quite a</span><span class="plus">+</span><span class="pill v">adjective</span><span class="plus">+</span><span class="pill o">noun</span></div><div class="fex"><span class="en">It was quite a long hour.</span><span class="es">Fue una hora bastante larga.</span></div></div>
        ${ii("🧠","<b>Tip 1 — the dial:</b> really (high) › quite › rather › fairly (low).")}
        ${ii("💥","<b>Tip 2 — «rather» often complains:</b> <i>rather late</i>, <i>rather cold</i>.")}
        ${ii("📢","<b>Tip 3 — with verbs use «really»:</b> <i>I really agree</i> (not «I am really agree»).")}
        <div class="alert-card"><div class="atitle">⚠️ Common mistake</div><p>❌ «The meeting was late quite» → ✅ «The meeting was <b>quite late</b>».</p></div>
        ${ii("⚡","In this module: <i><b>quite</b> busy</i>, <i><b>quite</b> tired</i>, <i><b>quite</b> cold</i>, <i><b>really</b> hungry</i>, <i><b>really</b> happy</i>.")}` },
    checks:[
      { q:{es:"«La oficina estaba bastante fría» = ",en:"«The office was quite cold» = "}, opts:{es:["The office was quite cold","The office was cold quite"],en:["The office was quite cold","The office was cold quite"]}, correct:0, fb:{ why:{es:"El grado va antes del adjetivo.",en:"The degree word goes first."}, ex:{es:"The legal appointment went well, though the office was quite cold that morning.",en:"The legal appointment went well, though the office was quite cold that morning."}} },
      { q:{es:"«De verdad estoy de acuerdo» = ",en:"«I really agree» = "}, opts:{es:["I really agree","I am really agree"],en:["I really agree","I am really agree"]}, correct:0, fb:{ why:{es:"«Agree» es verbo: sin «be».",en:"«Agree» is a verb: no «be»."}, tip:{es:"really + verbo",en:"really + verb"}} },
