<script>
/* ═══ METADATOS ═══ */
const MAT = { title:{es:'Resumen de Gramática',en:'Grammar Summary'}, subtitle:{es:"Superlativos con in / of",en:"Superlatives with in / of"}, reportId:"sum-superlatives-in-of" };
const PASS = 75;
const STEPS = [
  { icon:"🇪🇸", title:{es:"Repaso en Español",en:"Spanish Recap"},
    html:{ es:`<div class="gdesc">El español elige al número uno con <b>el más …</b>, <b>el mejor</b> o <b>el peor</b>, y añade el grupo con <b>de</b>.</div>
        <div class="art-hero three"><div class="art-box"><div class="word">la hora más tranquila</div><div class="role">de un grupo</div><div class="desc">Es la hora más tranquila de mi mañana.</div></div><div class="art-box"><div class="word">el mejor cuarto</div><div class="role">irregular</div><div class="desc">Es el mejor cuarto del hotel.</div></div><div class="art-box"><div class="word">los peores papeles</div><div class="role">irregular</div><div class="desc">Son los peores papeles del mundo.</div></div></div>
        ${ii("🏆","Comparativo = <b>dos</b> cosas. Superlativo = el número uno de <b>tres o más</b>.")}
        <div class="gnote life">🌎 <b>De tu vida:</b> «la hora más tranquila <b>de</b> la mañana» — siempre hay un grupo donde comparas.</div>`, en:`<div class="gdesc">Spanish picks number one with <b>el más …</b>, <b>el mejor</b> or <b>el peor</b>, and adds the group with <b>de</b>.</div>
        <div class="art-hero three"><div class="art-box"><div class="word">la hora más tranquila</div><div class="role">of a group</div><div class="desc">Es la hora más tranquila de mi mañana.</div></div><div class="art-box"><div class="word">el mejor cuarto</div><div class="role">irregular</div><div class="desc">Es el mejor cuarto del hotel.</div></div><div class="art-box"><div class="word">los peores papeles</div><div class="role">irregular</div><div class="desc">Son los peores papeles del mundo.</div></div></div>
        ${ii("🏆","Comparative = <b>two</b> things. Superlative = number one of <b>three or more</b>.")}
        <div class="gnote life">🌎 <b>From your life:</b> «the quietest hour <b>of</b> the morning» — there is always a group you compare inside.</div>` },
    checks:[
      { q:{es:"«La hora más tranquila de la mañana» compara…",en:"«The quietest hour of the morning» compares…"}, opts:{es:["Todas las horas de la mañana","Solo dos horas"],en:["All the hours of the morning","Only two hours"]}, correct:0, fb:{ why:{es:"El superlativo mira todo el grupo.",en:"A superlative looks at the whole group."}, tip:{es:"tres o más → superlativo",en:"three or more → superlative"}} },
      { q:{es:"«Más tranquila que las otras» es…",en:"«Quieter than the others» is…"}, opts:{es:["Comparativo","Superlativo"],en:["Comparative","Superlative"]}, correct:0, fb:{ why:{es:"«Que» marca comparación.",en:"«Than» marks a comparison."}, tip:{es:"que / than",en:"than"}} },
      { q:{es:"«El mejor» viene de…",en:"«The best» comes from…"}, opts:{es:["bueno","grande"],en:["good","big"]}, correct:0, fb:{ why:{es:"bueno → mejor → el mejor.",en:"good → better → the best."}, tip:{es:"good → the best",en:"good → the best"}} },
      { q:{es:"«De la mañana» indica…",en:"«Of the morning» indicates…"}, opts:{es:["El grupo donde comparas","La hora exacta"],en:["The group you compare inside","The exact hour"]}, correct:0, fb:{ why:{es:"El superlativo necesita su grupo.",en:"A superlative needs its group."}, tip:{es:"de = in / of",en:"de = in / of"}} },
      { q:{es:"«Los peores papeles del mundo» habla de…",en:"«The worst papers in the world» talks about…"}, opts:{es:["Los que están al final de todos","Unos papeles cualquiera"],en:["The ones at the very bottom","Just some papers"]}, correct:0, fb:{ why:{es:"Es el número uno por lo negativo.",en:"It is number one on the bad side."}, tip:{es:"bad → the worst",en:"bad → the worst"}} }
    ] },
  { icon:"🤝", title:{es:"Similitudes",en:"Similarities"},
    html:{ es:`<div class="gdesc">El inglés también marca al ganador y siempre empieza con <b>the</b>.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">🤫</span><span class="lbl">the quietest</span><span class="es">el más tranquilo</span></div><div class="viz-item"><span class="ico">🏅</span><span class="lbl">the best</span><span class="es">el mejor</span></div><div class="viz-item"><span class="ico">👎</span><span class="lbl">the worst</span><span class="es">el peor</span></div><div class="viz-item"><span class="ico">🐘</span><span class="lbl">the biggest</span><span class="es">el más grande</span></div><div class="viz-item"><span class="ico">⚡</span><span class="lbl">the most exciting</span><span class="es">el más emocionante</span></div><div class="viz-item"><span class="ico">📍</span><span class="lbl">in / of</span><span class="es">de (el grupo)</span></div></div>
        ${eg("\"Come at eleven. That is <span class=\"tag s\">the quietest hour of</span> my morning.\"","\"Ven a las once. Es la hora más tranquila de mi mañana\".","ok")}
        ${eg("\"This is <span class=\"tag s\">the most important line of</span> the paper,\" he says.","\"Esta es la línea más importante del papel\", dice.","ok")}
        ${eg("\"Papers that nobody reads are <span class=\"tag s\">the worst papers in</span> the world.\"","\"Los papeles que nadie lee son los peores papeles del mundo\".","ok")}
        <div class="sec-label">Lo igual en los dos idiomas</div>
        <ul class="simlist"><li>Los dos usan artículo: «<b>el</b> mejor» = «<b>the</b> best».</li><li>Los dos cierran con el grupo: «de la mañana» = «<b>of</b> the morning».</li><li>Los dos tienen irregulares: mejor/peor = <b>best/worst</b>.</li></ul>
        <div class="gnote">👍 the quietest · the biggest · the best · the worst · the most exciting.</div>`, en:`<div class="gdesc">English also marks the winner and always starts with <b>the</b>.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">🤫</span><span class="lbl">the quietest</span><span class="es">el más tranquilo</span></div><div class="viz-item"><span class="ico">🏅</span><span class="lbl">the best</span><span class="es">el mejor</span></div><div class="viz-item"><span class="ico">👎</span><span class="lbl">the worst</span><span class="es">el peor</span></div><div class="viz-item"><span class="ico">🐘</span><span class="lbl">the biggest</span><span class="es">el más grande</span></div><div class="viz-item"><span class="ico">⚡</span><span class="lbl">the most exciting</span><span class="es">el más emocionante</span></div><div class="viz-item"><span class="ico">📍</span><span class="lbl">in / of</span><span class="es">de (el grupo)</span></div></div>
        ${eg("\"Come at eleven. That is <span class=\"tag s\">the quietest hour of</span> my morning.\"","\"Ven a las once. Es la hora más tranquila de mi mañana\".","ok")}
        ${eg("\"This is <span class=\"tag s\">the most important line of</span> the paper,\" he says.","\"Esta es la línea más importante del papel\", dice.","ok")}
        ${eg("\"Papers that nobody reads are <span class=\"tag s\">the worst papers in</span> the world.\"","\"Los papeles que nadie lee son los peores papeles del mundo\".","ok")}
        <div class="sec-label">What is the same in both languages</div>
        <ul class="simlist"><li>Both use an article: «<b>el</b> mejor» = «<b>the</b> best».</li><li>Both close with the group: «de la mañana» = «<b>of</b> the morning».</li><li>Both have irregulars: mejor/peor = <b>best/worst</b>.</li></ul>
        <div class="gnote">👍 the quietest · the biggest · the best · the worst · the most exciting.</div>` },
    checks:[
      { q:{es:"«el más tranquilo» = ",en:"«the quietest» = "}, opts:{es:["the quietest","the most quiet"],en:["the quietest","the most quiet"]}, correct:0, fb:{ why:{es:"«Quiet» toma -est.",en:"«Quiet» takes -est."}, ex:{es:"\"Come at eleven. That is the quietest hour of my morning.\"",en:"\"Come at eleven. That is the quietest hour of my morning.\""}} },
      { q:{es:"«el mejor» = ",en:"«the best» = "}, opts:{es:["the best","the goodest"],en:["the best","the goodest"]}, correct:0, fb:{ why:{es:"Irregular.",en:"Irregular."}, tip:{es:"good → the best",en:"good → the best"}} },
      { q:{es:"¿Qué palabra abre siempre un superlativo?",en:"Which word always opens a superlative?"}, opts:{es:["the","a"],en:["the","a"]}, correct:0, fb:{ why:{es:"Sin «the» queda incompleto.",en:"Without «the» it is incomplete."}, tip:{es:"the + -est",en:"the + -est"}} },
      { q:{es:"«el peor» = ",en:"«the worst» = "}, opts:{es:["the worst","the baddest"],en:["the worst","the baddest"]}, correct:0, fb:{ why:{es:"Irregular.",en:"Irregular."}, ex:{es:"\"Papers that nobody reads are the worst papers in the world,\" she adds.",en:"\"Papers that nobody reads are the worst papers in the world,\" she adds."}} },
      { q:{es:"«de la mañana» (grupo) = ",en:"«of the morning» (group) = "}, opts:{es:["of the morning","than the morning"],en:["of the morning","than the morning"]}, correct:0, fb:{ why:{es:"«Than» es del comparativo.",en:"«Than» belongs to the comparative."}, tip:{es:"in / of",en:"in / of"}} }
    ] },
  { icon:"⚡", title:{es:"Diferencias",en:"Differences"},
    html:{ es:`<div class="gdesc">La diferencia grande: la <b>ortografía</b>, los <b>irregulares</b> y elegir entre <b>in</b> y <b>of</b>.</div>
        <table class="dtab"><tr><th>Adjetivo</th><th>Regla</th><th>Superlativo</th></tr><tr><td>quiet · short · long</td><td class="en">the + adjetivo + est</td><td>the quietest · the shortest</td></tr><tr><td>big · hot</td><td class="en">dobla la consonante + est</td><td>the biggest · the hottest</td></tr><tr><td>busy · easy</td><td class="en">y → iest</td><td>the busiest · the easiest</td></tr><tr><td>important · exciting</td><td class="en">the most + adjetivo</td><td>the most important · the most exciting</td></tr><tr><td>good · bad · far</td><td class="en">irregulares</td><td>the best · the worst · the furthest</td></tr></table>
        <div class="sec-label">⚠️ Dos avisos que valen nota</div>
        ${ii("🚫","Nunca dos marcas: <i><s>the most biggest</s></i> → <b>the biggest</b>.")}
        ${ii("🧩","<b>in</b> + lugar o grupo de personas (in the world, in my class) · <b>of</b> + conjunto o periodo (of the three, of the week).")}
        ${eg("It is <span class=\"tag s\">the busiest day of</span> the week.","Es el día más ocupado de la semana.","ok")}
        ${eg("She is the best admin than the office.","El superlativo cierra con <b>in</b>, nunca con «than».","bad")}
        ${eg("That was <span class=\"tag s\">the most difficult week of</span> the year.","Esa fue la semana más difícil del año.","ok")}
        <div class="gnote">📍 the + -est · the most + largo · irregulares · in (lugar) / of (conjunto o tiempo).</div>`, en:`<div class="gdesc">The big difference: the <b>spelling</b>, the <b>irregulars</b> and choosing between <b>in</b> and <b>of</b>.</div>
        <table class="dtab"><tr><th>Adjective</th><th>Rule</th><th>Superlative</th></tr><tr><td>quiet · short · long</td><td class="en">the + adjective + est</td><td>the quietest · the shortest</td></tr><tr><td>big · hot</td><td class="en">double the consonant + est</td><td>the biggest · the hottest</td></tr><tr><td>busy · easy</td><td class="en">y → iest</td><td>the busiest · the easiest</td></tr><tr><td>important · exciting</td><td class="en">the most + adjective</td><td>the most important · the most exciting</td></tr><tr><td>good · bad · far</td><td class="en">irregular</td><td>the best · the worst · the furthest</td></tr></table>
        <div class="sec-label">⚠️ Two warnings worth marks</div>
        ${ii("🚫","Never two markers: <i><s>the most biggest</s></i> → <b>the biggest</b>.")}
        ${ii("🧩","<b>in</b> + place or group of people (in the world, in my class) · <b>of</b> + set or period (of the three, of the week).")}
        ${eg("It is <span class=\"tag s\">the busiest day of</span> the week.","Es el día más ocupado de la semana.","ok")}
        ${eg("She is the best admin than the office.","El superlativo cierra con <b>in</b>, nunca con «than».","bad")}
        ${eg("That was <span class=\"tag s\">the most difficult week of</span> the year.","Esa fue la semana más difícil del año.","ok")}
        <div class="gnote">📍 the + -est · the most + long · irregulars · in (place) / of (set or time).</div>` },
    checks:[
      { q:{es:"big → ",en:"big → "}, opts:{es:["the biggest","the bigest"],en:["the biggest","the bigest"]}, correct:0, fb:{ why:{es:"Dobla la g.",en:"Double the g."}, tip:{es:"big → the biggest",en:"big → the biggest"}} },
      { q:{es:"busy → ",en:"busy → "}, opts:{es:["the busiest","the busyest"],en:["the busiest","the busyest"]}, correct:0, fb:{ why:{es:"y → iest.",en:"y → iest."}, tip:{es:"busy → the busiest",en:"busy → the busiest"}} },
      { q:{es:"«la línea más importante» = ",en:"«the most important line» = "}, opts:{es:["the most important line","the importantest line"],en:["the most important line","the importantest line"]}, correct:0, fb:{ why:{es:"Adjetivo largo → the most.",en:"Long adjective → the most."}, ex:{es:"\"This is the most important line of the paper,\" he says.",en:"\"This is the most important line of the paper,\" he says."}} },
      { q:{es:"«del mundo» = ",en:"«in the world» = "}, opts:{es:["in the world","of the world"],en:["in the world","of the world"]}, correct:0, fb:{ why:{es:"Con lugares se usa «in».",en:"With places use «in»."}, ex:{es:"\"Papers that nobody reads are the worst papers in the world,\" she adds.",en:"\"Papers that nobody reads are the worst papers in the world,\" she adds."}} },
      { q:{es:"«de la semana» = ",en:"«of the week» = "}, opts:{es:["of the week","in the week"],en:["of the week","in the week"]}, correct:0, fb:{ why:{es:"Con periodos se usa «of».",en:"With periods use «of»."}, tip:{es:"of the week / of the three",en:"of the week / of the three"}} }
    ] },
  { icon:"💡", title:{es:"Tips Prácticos",en:"Practical Tips"},
    html:{ es:`<div class="gdesc">Una fórmula y una decisión: <b>in</b> o <b>of</b>.</div>
        <div class="fbox"><div class="frm"><span class="pill s">A</span><span class="plus">+</span><span class="pill v">be</span><span class="plus">+</span><span class="pill o">the + adjetivo-est + in/of + grupo</span></div><div class="fex"><span class="en">That is the quietest hour of my morning.</span><span class="es">Esa es la hora más tranquila de mi mañana.</span></div></div>
        <div class="fbox"><div class="frm"><span class="pill s">A</span><span class="plus">+</span><span class="pill v">be</span><span class="plus">+</span><span class="pill o">the most + adjetivo largo</span></div><div class="fex"><span class="en">This is the most important line of the paper.</span><span class="es">Esta es la línea más importante del papel.</span></div></div>
        ${ii("🧠","<b>Tip 1 — cuenta cuántos comparas:</b> dos → <b>-er than</b> · tres o más → <b>the -est</b>.")}
        ${ii("💥","<b>Tip 2 — in o of:</b> lugar o grupo de personas → <b>in</b>; conjunto o periodo → <b>of</b>.")}
        ${ii("📢","<b>Tip 3 — «the» no se negocia:</b> aunque en español digas «lo más …», el inglés pide <b>the</b>.")}
        <div class="alert-card"><div class="atitle">⚠️ Error típico</div><p>❌ «It is busiest day of the week» → ✅ «It is <b>the</b> busiest day of the week».</p></div>
        ${ii("⚡","En el módulo: <i>the quietest hour <b>of</b> my morning</i>, <i>the worst papers <b>in</b> the world</i>, <i>the busiest hours <b>of</b> the day</i>.")}`, en:`<div class="gdesc">One formula and one decision: <b>in</b> or <b>of</b>.</div>
        <div class="fbox"><div class="frm"><span class="pill s">A</span><span class="plus">+</span><span class="pill v">be</span><span class="plus">+</span><span class="pill o">the + adjective-est + in/of + group</span></div><div class="fex"><span class="en">That is the quietest hour of my morning.</span><span class="es">Esa es la hora más tranquila de mi mañana.</span></div></div>
        <div class="fbox"><div class="frm"><span class="pill s">A</span><span class="plus">+</span><span class="pill v">be</span><span class="plus">+</span><span class="pill o">the most + long adjective</span></div><div class="fex"><span class="en">This is the most important line of the paper.</span><span class="es">Esta es la línea más importante del papel.</span></div></div>
        ${ii("🧠","<b>Tip 1 — count how many:</b> two → <b>-er than</b> · three or more → <b>the -est</b>.")}
        ${ii("💥","<b>Tip 2 — in or of:</b> place or group of people → <b>in</b>; set or period → <b>of</b>.")}
        ${ii("📢","<b>Tip 3 — «the» is not optional:</b> English always asks for <b>the</b>.")}
        <div class="alert-card"><div class="atitle">⚠️ Common mistake</div><p>❌ «It is busiest day of the week» → ✅ «It is <b>the</b> busiest day of the week».</p></div>
        ${ii("⚡","In this module: <i>the quietest hour <b>of</b> my morning</i>, <i>the worst papers <b>in</b> the world</i>, <i>the busiest hours <b>of</b> the day</i>.")}` },
