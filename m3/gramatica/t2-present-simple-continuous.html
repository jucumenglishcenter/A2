<script>
/* ═══ METADATOS ═══ */
const MAT = { title:{es:'Resumen de Gramática',en:'Grammar Summary'}, subtitle:{es:"Presente Simple vs Presente Continuo",en:"Present Simple vs Present Continuous"}, reportId:"sum-present-simple-continuous" };
const PASS = 75;
const STEPS = [
  { icon:"🇪🇸", title:{es:"Repaso en Español",en:"Spanish Recap"},
    html:{ es:`<div class="gdesc">El español separa lo que haces <b>siempre</b> de lo que haces <b>ahora</b>: «trabajo los lunes» vs «estoy trabajando».</div>
        <div class="art-hero three"><div class="art-box"><div class="word">trabajo</div><div class="role">rutina</div><div class="desc">Trabajo seis horas por día.</div></div><div class="art-box"><div class="word">estoy trabajando</div><div class="role">ahora</div><div class="desc">Ahora estoy trabajando en el frente.</div></div><div class="art-box"><div class="word">me veo con él</div><div class="role">plan fijo</div><div class="desc">El jueves me veo con el administrador.</div></div></div>
        ${ii("⏱️","Tres usos: <b>rutina</b>, <b>ahora mismo</b> y <b>cita ya acordada</b>.")}
        <div class="gnote life">🌎 <b>De tu vida:</b> «La oficina abre a las nueve» (siempre) vs «Estoy esperando en la clínica» (ahora).</div>`, en:`<div class="gdesc">Spanish separates what you do <b>always</b> from what you are doing <b>now</b>: «trabajo los lunes» vs «estoy trabajando».</div>
        <div class="art-hero three"><div class="art-box"><div class="word">trabajo</div><div class="role">routine</div><div class="desc">Trabajo seis horas por día.</div></div><div class="art-box"><div class="word">estoy trabajando</div><div class="role">now</div><div class="desc">Ahora estoy trabajando en el frente.</div></div><div class="art-box"><div class="word">me veo con él</div><div class="role">fixed plan</div><div class="desc">El jueves me veo con el administrador.</div></div></div>
        ${ii("⏱️","Three uses: <b>routine</b>, <b>right now</b> and <b>arranged appointment</b>.")}
        <div class="gnote life">🌎 <b>From your life:</b> «The office opens at nine» (always) vs «I am waiting at the clinic» (now).</div>` },
    checks:[
      { q:{es:"«Trabajo seis horas por día» es…",en:"«I work six hours per day» is…"}, opts:{es:["Una rutina","Algo de ahora"],en:["A routine","Something happening now"]}, correct:0, fb:{ why:{es:"«Cada día» marca rutina.",en:"«Every day» marks a routine."}, tip:{es:"rutina → presente simple",en:"routine → present simple"}} },
      { q:{es:"«Estoy esperando» habla de…",en:"«I am waiting» talks about…"}, opts:{es:["Este momento","Todos los días"],en:["This moment","Every day"]}, correct:0, fb:{ why:{es:"Es una acción en curso.",en:"It is an action in progress."}, tip:{es:"ahora → continuo",en:"now → continuous"}} },
      { q:{es:"«El jueves me veo con el doctor» es…",en:"«On Thursday I am seeing the doctor» is…"}, opts:{es:["Un plan ya acordado","Una costumbre"],en:["An arranged plan","A habit"]}, correct:0, fb:{ why:{es:"La cita ya está fijada.",en:"The appointment is already fixed."}, tip:{es:"cita fija → continuo",en:"fixed plan → continuous"}} },
      { q:{es:"«Quiero otra hora» describe…",en:"«I want another hour» describes…"}, opts:{es:["Un estado, no una acción","Una acción en curso"],en:["A state, not an action","An action in progress"]}, correct:0, fb:{ why:{es:"Querer es un estado.",en:"Wanting is a state."}, tip:{es:"estados → simple",en:"states → simple"}} },
      { q:{es:"¿Qué palabra anuncia rutina?",en:"Which word announces a routine?"}, opts:{es:["every morning","right now"],en:["every morning","right now"]}, correct:0, fb:{ why:{es:"«Every» marca frecuencia.",en:"«Every» marks frequency."}, tip:{es:"every / often / sometimes",en:"every / often / sometimes"}} }
    ] },
  { icon:"🤝", title:{es:"Similitudes",en:"Similarities"},
    html:{ es:`<div class="gdesc">Los dos idiomas usan una forma para lo habitual y otra con <b>estar + -ndo</b> para lo que ocurre ahora.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">🔁</span><span class="lbl">opens</span><span class="es">abre (siempre)</span></div><div class="viz-item"><span class="ico">⏳</span><span class="lbl">is opening</span><span class="es">está abriendo</span></div><div class="viz-item"><span class="ico">📅</span><span class="lbl">I am seeing</span><span class="es">me veo (plan)</span></div><div class="viz-item"><span class="ico">🗣️</span><span class="lbl">speaks</span><span class="es">habla</span></div><div class="viz-item"><span class="ico">💬</span><span class="lbl">is speaking</span><span class="es">está hablando</span></div><div class="viz-item"><span class="ico">❤️</span><span class="lbl">wants</span><span class="es">quiere (estado)</span></div></div>
        ${eg("The office <span class=\"tag s\">opens</span> at nine.","La oficina abre a las nueve.","ok")}
        ${eg("We <span class=\"tag s\">are working</span> with a different system this week.","Esta semana estamos trabajando con un sistema diferente.","ok")}
        ${eg("I <span class=\"tag s\">am sending</span> you a message now to confirm.","Le estoy enviando un mensaje ahora para confirmar.","ok")}
        <div class="sec-label">Lo igual en los dos idiomas</div>
        <ul class="simlist"><li>Los dos tienen dos presentes: uno simple y uno continuo.</li><li>Los dos usan el continuo para lo que pasa <b>ahora</b>.</li><li>Los dos dejan los verbos de estado (querer, saber, recordar) en simple.</li></ul>
        <div class="gnote">👍 opens / is opening · works / is working · sends / is sending.</div>`, en:`<div class="gdesc">Both languages use one form for habits and another with <b>be + -ing</b> for what is happening now.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">🔁</span><span class="lbl">opens</span><span class="es">abre (siempre)</span></div><div class="viz-item"><span class="ico">⏳</span><span class="lbl">is opening</span><span class="es">está abriendo</span></div><div class="viz-item"><span class="ico">📅</span><span class="lbl">I am seeing</span><span class="es">me veo (plan)</span></div><div class="viz-item"><span class="ico">🗣️</span><span class="lbl">speaks</span><span class="es">habla</span></div><div class="viz-item"><span class="ico">💬</span><span class="lbl">is speaking</span><span class="es">está hablando</span></div><div class="viz-item"><span class="ico">❤️</span><span class="lbl">wants</span><span class="es">quiere (estado)</span></div></div>
        ${eg("The office <span class=\"tag s\">opens</span> at nine.","La oficina abre a las nueve.","ok")}
        ${eg("We <span class=\"tag s\">are working</span> with a different system this week.","Esta semana estamos trabajando con un sistema diferente.","ok")}
        ${eg("I <span class=\"tag s\">am sending</span> you a message now to confirm.","Le estoy enviando un mensaje ahora para confirmar.","ok")}
        <div class="sec-label">What is the same in both languages</div>
        <ul class="simlist"><li>Both have two presents: a simple one and a continuous one.</li><li>Both use the continuous for what is happening <b>now</b>.</li><li>Both keep state verbs (want, know, remember) in the simple form.</li></ul>
        <div class="gnote">👍 opens / is opening · works / is working · sends / is sending.</div>` },
    checks:[
      { q:{es:"«La oficina abre a las nueve» = ",en:"«The office opens at nine» = "}, opts:{es:["The office opens at nine","The office is opening at nine"],en:["The office opens at nine","The office is opening at nine"]}, correct:0, fb:{ why:{es:"Es un horario fijo.",en:"It is a fixed schedule."}, ex:{es:"First, Lucía calls at eight, but nobody answers; the office opens at nine.",en:"First, Lucía calls at eight, but nobody answers; the office opens at nine."}} },
      { q:{es:"«Estamos trabajando con otro sistema» = ",en:"«We are working with a different system» = "}, opts:{es:["We are working","We work"],en:["We are working","We work"]}, correct:0, fb:{ why:{es:"Es temporal, esta semana.",en:"It is temporary, this week."}, ex:{es:"We are working with a different system this week.",en:"We are working with a different system this week."}} },
      { q:{es:"¿Cuál es un estado?",en:"Which one is a state?"}, opts:{es:["want","send"],en:["want","send"]}, correct:0, fb:{ why:{es:"«Want» no describe una acción visible.",en:"«Want» is not a visible action."}, tip:{es:"estados: want, know, need",en:"states: want, know, need"}} },
      { q:{es:"«Le estoy enviando un mensaje» = ",en:"«I am sending you a message» = "}, opts:{es:["I am sending","I send"],en:["I am sending","I send"]}, correct:0, fb:{ why:{es:"Ocurre en este momento.",en:"It is happening right now."}, ex:{es:"I am sending you a message now to confirm.",en:"I am sending you a message now to confirm."}} },
      { q:{es:"¿Qué tiempo usa una regla general?",en:"Which tense states a general rule?"}, opts:{es:["Presente simple","Presente continuo"],en:["Present simple","Present continuous"]}, correct:0, fb:{ why:{es:"Las reglas no cambian.",en:"Rules do not change."}, tip:{es:"regla → simple",en:"rule → simple"}} }
    ] },
  { icon:"⚡", title:{es:"Diferencias",en:"Differences"},
    html:{ es:`<div class="gdesc">La diferencia grande: el inglés <b>marca la tercera persona con -s</b> y arma el continuo con <b>be + -ing</b>.</div>
        <table class="dtab"><tr><th>Uso</th><th>Estructura</th><th>Ejemplo</th></tr><tr><td>Rutina</td><td class="en">sujeto + verbo (+ -s)</td><td>The clinic opens at nine.</td></tr><tr><td>Negativo (rutina)</td><td class="en">don't / doesn't + verbo base</td><td>He doesn't work on Fridays.</td></tr><tr><td>Pregunta (rutina)</td><td class="en">Do / Does + sujeto + verbo base</td><td>Does the class start at six?</td></tr><tr><td>Ahora</td><td class="en">am / is / are + verbo-ing</td><td>I am waiting at the front desk.</td></tr><tr><td>Cita acordada</td><td class="en">am / is / are + verbo-ing + hora</td><td>I am seeing the doctor at four.</td></tr></table>
        <div class="sec-label">⚠️ Dos avisos que valen nota</div>
        ${ii("🚫","Los verbos de estado no llevan -ing: <i>I <s>am wanting</s> a later hour</i> → <b>I want</b>.")}
        ${ii("🧩","Con <b>does</b> el verbo pierde la -s: <i>Does the bus <b>stop</b> here?</i>")}
        ${eg("Every Monday she <span class=\"tag s\">goes</span> to the clinic.","Cada lunes va a la clínica.","ok")}
        ${eg("Every Monday she is going to the clinic.","Con «every Monday» va el presente simple.","bad")}
        ${eg("I <span class=\"tag s\">am waiting</span> right now.","Estoy esperando ahora mismo.","ok")}
        <div class="gnote">📍 Rutina → simple (+ -s en he/she/it) · Ahora o plan fijo → be + -ing · Estados → siempre simple.</div>`, en:`<div class="gdesc">The big difference: English <b>marks the third person with -s</b> and builds the continuous with <b>be + -ing</b>.</div>
        <table class="dtab"><tr><th>Use</th><th>Structure</th><th>Example</th></tr><tr><td>Routine</td><td class="en">subject + verb (+ -s)</td><td>The clinic opens at nine.</td></tr><tr><td>Negative (routine)</td><td class="en">don't / doesn't + base verb</td><td>He doesn't work on Fridays.</td></tr><tr><td>Question (routine)</td><td class="en">Do / Does + subject + base verb</td><td>Does the class start at six?</td></tr><tr><td>Now</td><td class="en">am / is / are + verb-ing</td><td>I am waiting at the front desk.</td></tr><tr><td>Arrangement</td><td class="en">am / is / are + verb-ing + time</td><td>I am seeing the doctor at four.</td></tr></table>
        <div class="sec-label">⚠️ Two warnings worth marks</div>
        ${ii("🚫","State verbs take no -ing: <i>I <s>am wanting</s> a later hour</i> → <b>I want</b>.")}
        ${ii("🧩","With <b>does</b> the verb drops the -s: <i>Does the bus <b>stop</b> here?</i>")}
        ${eg("Every Monday she <span class=\"tag s\">goes</span> to the clinic.","Cada lunes va a la clínica.","ok")}
        ${eg("Every Monday she is going to the clinic.","Con «every Monday» va el presente simple.","bad")}
        ${eg("I <span class=\"tag s\">am waiting</span> right now.","Estoy esperando ahora mismo.","ok")}
        <div class="gnote">📍 Routine → simple (+ -s for he/she/it) · Now or fixed plan → be + -ing · States → always simple.</div>` },
    checks:[
      { q:{es:"«¿La clase empieza a las seis?» = ",en:"«Does the class start at six?» = "}, opts:{es:["Does the class start at six?","Does the class starts at six?"],en:["Does the class start at six?","Does the class starts at six?"]}, correct:0, fb:{ why:{es:"«Does» ya lleva la -s.",en:"«Does» already carries the -s."}, tip:{es:"does + verbo base",en:"does + base verb"}} },
      { q:{es:"«Quiero otra hora» = ",en:"«I want another hour» = "}, opts:{es:["I want another hour","I am wanting another hour"],en:["I want another hour","I am wanting another hour"]}, correct:0, fb:{ why:{es:"«Want» es estado.",en:"«Want» is a state."}, tip:{es:"estados sin -ing",en:"no -ing for states"}} },
      { q:{es:"«Cada lunes va a la clínica» = ",en:"«Every Monday she goes to the clinic» = "}, opts:{es:["she goes","she is going"],en:["she goes","she is going"]}, correct:0, fb:{ why:{es:"«Every Monday» pide simple.",en:"«Every Monday» needs the simple."}, tip:{es:"every → simple",en:"every → simple"}} },
      { q:{es:"«Él no trabaja los viernes» = ",en:"«He doesn’t work on Fridays» = "}, opts:{es:["He doesn't work","He doesn't works"],en:["He doesn't work","He doesn't works"]}, correct:0, fb:{ why:{es:"Tras «doesn’t» el verbo va base.",en:"After «doesn’t» the verb is in base form."}, ex:{es:"He doesn't work on Fridays, so he is working from home this week.",en:"He doesn't work on Fridays, so he is working from home this week."}} },
      { q:{es:"«Estoy esperando en el frente» = ",en:"«I am waiting at the front desk» = "}, opts:{es:["I am waiting","I waiting"],en:["I am waiting","I waiting"]}, correct:0, fb:{ why:{es:"El continuo necesita «am/is/are».",en:"The continuous needs «am/is/are»."}, tip:{es:"be + -ing",en:"be + -ing"}} }
    ] },
  { icon:"💡", title:{es:"Tips Prácticos",en:"Practical Tips"},
    html:{ es:`<div class="gdesc">Dos fórmulas y una pregunta: ¿es costumbre o está pasando ahora?</div>
        <div class="fbox"><div class="frm"><span class="pill s">sujeto</span><span class="plus">+</span><span class="pill v">verbo (+s)</span><span class="plus">+</span><span class="pill o">complemento</span></div><div class="fex"><span class="en">The office opens at nine.</span><span class="es">La oficina abre a las nueve.</span></div></div>
        <div class="fbox"><div class="frm"><span class="pill s">sujeto</span><span class="plus">+</span><span class="pill v">am / is / are</span><span class="plus">+</span><span class="pill o">verbo-ing</span></div><div class="fex"><span class="en">I am seeing the doctor at four.</span><span class="es">Me veo con el doctor a las cuatro.</span></div></div>
        ${ii("🧠","<b>Tip 1 — busca la palabra de tiempo:</b> every, often, sometimes → simple · now, today, this week → continuo.")}
        ${ii("💥","<b>Tip 2 — para una cita ya acordada</b> el inglés prefiere el continuo: <i>I am seeing her at four.</i>")}
        ${ii("📢","<b>Tip 3 — una sola -s:</b> o la lleva el verbo (she works) o la lleva does (does she work?).")}
        <div class="alert-card"><div class="atitle">⚠️ Error típico</div><p>❌ «I am wanting a later appointment» → ✅ «I <b>want</b> a later appointment».</p></div>
        ${ii("⚡","En el módulo: <i>the office <b>opens</b> at nine</i> (siempre) y <i>we <b>are working</b> with a different system</i> (esta semana).")}`, en:`<div class="gdesc">Two formulas and one question: is it a habit or is it happening now?</div>
        <div class="fbox"><div class="frm"><span class="pill s">subject</span><span class="plus">+</span><span class="pill v">verb (+s)</span><span class="plus">+</span><span class="pill o">complement</span></div><div class="fex"><span class="en">The office opens at nine.</span><span class="es">La oficina abre a las nueve.</span></div></div>
        <div class="fbox"><div class="frm"><span class="pill s">subject</span><span class="plus">+</span><span class="pill v">am / is / are</span><span class="plus">+</span><span class="pill o">verb-ing</span></div><div class="fex"><span class="en">I am seeing the doctor at four.</span><span class="es">Me veo con el doctor a las cuatro.</span></div></div>
        ${ii("🧠","<b>Tip 1 — look for the time word:</b> every, often, sometimes → simple · now, today, this week → continuous.")}
        ${ii("💥","<b>Tip 2 — for a fixed appointment</b> English prefers the continuous: <i>I am seeing her at four.</i>")}
        ${ii("📢","<b>Tip 3 — only one -s:</b> either the verb has it (she works) or does has it (does she work?).")}
        <div class="alert-card"><div class="atitle">⚠️ Common mistake</div><p>❌ «I am wanting a later appointment» → ✅ «I <b>want</b> a later appointment».</p></div>
        ${ii("⚡","In this module: <i>the office <b>opens</b> at nine</i> (always) and <i>we <b>are working</b> with a different system</i> (this week).")}` },
