const GLOSS = [{"w":"appointment","es":"cita","ex":"This month she has an important appointment at the clinic."},{"w":"admin","es":"administrador/a (de oficina)","ex":"A man called Mr. Prado, the admin, picks up the phone."},{"w":"record","es":"registro / ficha","ex":"He asks for her full name and her record number."},{"w":"note","es":"nota / apunte","ex":"Lucía writes the date on a note with a red pen."},{"w":"to remind","es":"recordar (a alguien)","ex":"Her mother reminds her about the appointment every morning."},{"w":"to hold the line","es":"esperar en la línea","ex":"\"Hold the line, please,\" he says."},{"w":"to move an appointment","es":"mover / reprogramar una cita","ex":"I would like to move an appointment, please."},{"w":"period","es":"periodo / espacio de tiempo","ex":"He checks whether there is another period in the system."},{"w":"regular","es":"regular / fijo","ex":"His hours were regular, and he liked working with people who arrived early."},{"w":"shift","es":"turno","ex":"Ana, I have a problem with my shift this morning."},{"w":"to swap","es":"intercambiar","ex":"That is important. Do you want to swap shifts?"},{"w":"to call off","es":"cancelar","ex":"He didn't want to call off his shift."},{"w":"to put off","es":"dejar para después / posponer","ex":"I don't want to put it off until the afternoon."},{"w":"to fill in","es":"llenar (un formulario)","ex":"Then she fills in the boxes slowly."},{"w":"to write down","es":"anotar","ex":"Finally, they agree to meet on Thursday at four, and Lucía writes it down."},{"w":"to pick up","es":"contestar (el teléfono) / recoger","ex":"Mr. Prado, the admin, picks up the phone."},{"w":"to refuse","es":"negarse","ex":"She refuses politely, though she is getting tired of the conversation."},{"w":"to reject","es":"rechazar","ex":"The man at the window checks every line, and he doesn't reject anything."},{"w":"to recommend","es":"recomendar","ex":"\"Perhaps you should call first,\" she recommends."},{"w":"opinion","es":"opinión","ex":"In his opinion, that idea was far better than losing the whole morning."},{"w":"at least","es":"al menos","ex":"\"You need at least one person at the front.\""},{"w":"unless","es":"a menos que","ex":"\"Unless you arrive before half past four, we move you to the next week.\""},{"w":"whenever","es":"cada vez que / siempre que","ex":"\"Whenever I write things down, I remember them.\""},{"w":"though","es":"aunque","ex":"The store opened at nine, though the team began at half past eight."},{"w":"besides","es":"además (de)","ex":"\"Besides, now you have it in writing.\""},{"w":"throughout","es":"durante todo / a lo largo de","ex":"Throughout the afternoon, three clients asked for the same thing."},{"w":"thus","es":"así / por eso","ex":"The road is straight, thus the trip is much shorter than she expected."},{"w":"perhaps","es":"quizás","ex":"\"Perhaps we can divide the shift,\" Ana suggested."},{"w":"nearly","es":"casi","ex":"The waiting room is nearly full."},{"w":"straight","es":"recto / directo","ex":"They left at ten to eleven and walked straight to the bus stop."},{"w":"legal","es":"legal","ex":"His little brother had a legal appointment at ten."},{"w":"signature","es":"firma","ex":"One of them needs a signature from her school."},{"w":"stamp","es":"sello","ex":"\"The teacher signs this line, and I stamp the other one.\""},{"w":"length","es":"duración / largo","ex":"The line asks for the length of the course in months."},{"w":"to repair","es":"reparar","ex":"It needed a small repair, not a new tyre."},{"w":"speed","es":"velocidad","ex":"The road was cold and empty, and the car moved at a regular speed."},{"w":"booking / reservation","es":"reserva","ex":"Tomás called the hotel and asked to move the reservation."},{"w":"tired","es":"cansado/a","ex":"Marta leaves the office at ten past nine, tired but really happy."}];
/* Cada oración alineada EN↔ES (para resaltado por oración en ambos idiomas) */
const STORYDATA = {"1":{"sTitle":"The Appointment That Moved Three Times","sTitleEs":"La cita que se movió tres veces","dTitle":"Moving the Appointment","dTitleEs":"Moviendo la cita","paras":[[["Lucía is a student who lives in the west of the city, near the old market.","Lucía es una estudiante que vive en el oeste de la ciudad, cerca del mercado viejo."],["This month she has an important appointment at the clinic, and she doesn't want to lose it.","Este mes tiene una cita importante en la clínica, y no quiere perderla."],["Her class finishes at three, so the trip takes her nearly an hour.","Su clase termina a las tres, así que el viaje le toma casi una hora."],["The clinic is not as near as the school, though the bus stops in front of it.","La clínica no está tan cerca como la escuela, aunque el bus para frente a ella."],["\"I am organised,\" she says, \"but this appointment is moving more than I am.\"","\"Soy organizada\", dice, \"pero esta cita se está moviendo más que yo\"."]],[["Her mother reminds her about the appointment every morning, carefully and without shouting.","Su mamá le recuerda la cita cada mañana, con cuidado y sin gritar."],["Lucía writes the date on a note with a red pen and puts it on the door.","Lucía escribe la fecha en una nota con un lapicero rojo y la pega en la puerta."],["\"Whenever I write things down, I remember them,\" she says.","\"Cada vez que anoto las cosas, las recuerdo\", dice."],["Her mother, who works six hours a day at a store, knows the value of a plan.","Su mamá, que trabaja seis horas al día en una tienda, conoce el valor de un plan."],["\"Perhaps you should call first,\" she recommends, \"because the office changes its hours often.\"","\"Quizás deberías llamar primero\", recomienda, \"porque la oficina cambia sus horarios seguido\"."]],[["First, Lucía calls at eight, but nobody answers; the office opens at nine.","Primero, Lucía llama a las ocho, pero nadie contesta; la oficina abre a las nueve."],["Then she calls again, and a man called Mr. Prado, the admin, picks up the phone.","Luego llama otra vez, y un señor llamado el Sr. Prado, el administrador, contesta el teléfono."],["He speaks quickly, and thus she asks him to repeat the third question.","Él habla rápido, y por eso ella le pide que repita la tercera pregunta."],["\"We are working with a different system this week,\" he explains.","\"Esta semana estamos trabajando con un sistema diferente\", explica."],["After that, he asks for her full name and her record number.","Después de eso, le pide su nombre completo y su número de registro."]],[["The doctor operates on Tuesdays, so Tuesday at four is impossible.","El doctor opera los martes, así que el martes a las cuatro es imposible."],["Mr. Prado suggests moving the appointment to Wednesday morning.","El Sr. Prado sugiere mover la cita al miércoles por la mañana."],["\"That hour is much earlier than my class,\" Lucía answers, \"and I really can't arrive on time.\"","\"Esa hora es mucho más temprano que mi clase\", responde Lucía, \"y de verdad no puedo llegar a tiempo\"."],["He doesn't reject the idea; he checks whether there is another period in the system.","Él no rechaza la idea; revisa si hay otro periodo en el sistema."],["\"Hold the line, please,\" he says. \"This takes some minutes.\"","\"Espere en la línea, por favor\", dice. \"Esto toma algunos minutos\"."]],[["The second offer is Thursday at three, but her class begins at that hour.","La segunda opción es el jueves a las tres, pero su clase empieza a esa hora."],["She refuses politely, though she is getting tired of the conversation.","Ella se niega con amabilidad, aunque se está cansando de la conversación."],["\"I don't want to lose the appointment,\" she says, \"unless there is no other option.\"","\"No quiero perder la cita\", dice, \"a menos que no haya otra opción\"."],["Mr. Prado laughs and says that patience is the best tool in this office.","El Sr. Prado se ríe y dice que la paciencia es la mejor herramienta de esta oficina."],["\"Nobody moves an appointment as often as we do,\" he adds.","\"Nadie mueve una cita tan seguido como nosotros\", agrega."]],[["Finally, they agree to meet on Thursday at four, and Lucía writes it down.","Finalmente, acuerdan verse el jueves a las cuatro, y Lucía lo anota."],["\"I am sending you a message now to confirm,\" he promises.","\"Le estoy enviando un mensaje ahora para confirmar\", promete él."],["The message arrives in six minutes, and she reads it twice, slowly.","El mensaje llega en seis minutos, y ella lo lee dos veces, despacio."],["Her mother, who is drinking her tea in the front room, smiles at her.","Su mamá, que está tomando su té en la sala del frente, le sonríe."],["\"Third time, and it is done,\" she says. \"Besides, now you have it in writing.\"","\"Tercera vez, y está hecho\", dice. \"Además, ahora lo tienes por escrito\"."]],[["On Thursday, Lucía plans her trip carefully: the bus is slower, but it is a lot cheaper.","El jueves, Lucía planea su viaje con cuidado: el bus es más lento, pero es mucho más barato."],["Walking is not as fast as the bus, and the road to the clinic is not straight.","Caminar no es tan rápido como el bus, y el camino a la clínica no es recto."],["\"The bus is the safest option of the three,\" her mother says.","\"El bus es la opción más segura de las tres\", dice su mamá."],["They agree that leaving early is better than running at the last minute.","Están de acuerdo en que salir temprano es mejor que correr a último minuto."],["Lucía puts her ID, her note and a pen in her bag, and then she leaves.","Lucía pone su documento, su nota y un lapicero en su bolso, y luego sale."]],[["She arrives ten minutes early, though the traffic is slow near the hotel.","Llega diez minutos antes, aunque el tráfico está lento cerca del hotel."],["The waiting room is nearly full, and a child cries quietly next to his mother.","La sala de espera está casi llena, y un niño llora bajito al lado de su mamá."],["At four o'clock exactly, a nurse calls her name and Lucía walks in.","A las cuatro en punto, una enfermera dice su nombre y Lucía entra."],["The appointment lasts twenty minutes; the doctor listens and writes a short note.","La cita dura veinte minutos; el doctor escucha y escribe una nota corta."],["\"An appointment that moves three times still counts,\" Lucía thinks, \"if you finally get there.\"","\"Una cita que se mueve tres veces igual cuenta\", piensa Lucía, \"si al final llegas\"."]]],"datos":["Relativa con <b>who</b>: <span class=\"frase\">a student who lives in the west</span> · <b>not as … as</b>: <span class=\"frase\">not as near as the school</span>.","<b>Whenever</b> = cada vez que. Adverbio de modo: <span class=\"frase\">carefully</span> (cómo lo hace).","Secuenciadores: <b>First… Then… After that…</b> · Phrasal verb: <span class=\"frase\">picks up the phone</span>.","Verbo + <b>-ing</b>: <span class=\"frase\">suggests moving</span> · Intensificador + comparativo: <span class=\"frase\">much earlier than</span>.","<b>Unless</b> = a menos que · <b>as often as</b> compara la frecuencia · Superlativo con <b>in</b>: <span class=\"frase\">the best tool in this office</span>.","<b>Agree to</b> + verbo · Phrasal verb separable: <span class=\"frase\">writes it down</span> · Presente continuo para lo que ocurre ahora: <span class=\"frase\">I am sending</span>.","<b>A lot</b> + comparativo: <span class=\"frase\">a lot cheaper</span> · Superlativo con <b>of</b>: <span class=\"frase\">the safest option of the three</span>.",null],"dlg":[["Lucía","Good morning. I would like to move an appointment, please.","Buenos días. Quisiera mover una cita, por favor."],["Mr. Prado","Good morning. Of course. Could you give me your full name?","Buenos días. Claro. ¿Me puede dar su nombre completo?"],["Lucía","Lucía Ramos. My appointment is on Tuesday at four.","Lucía Ramos. Mi cita es el martes a las cuatro."],["Mr. Prado","Thank you. I am looking at your record now.","Gracias. Estoy viendo su registro ahora."],["Lucía","Is there a problem with that hour?","¿Hay algún problema con esa hora?"],["Mr. Prado","The doctor operates on Tuesdays, so we need a different day.","El doctor opera los martes, así que necesitamos otro día."],["Lucía","I see. What do you recommend?","Ya veo. ¿Qué me recomienda?"],["Mr. Prado","I recommend Wednesday morning. We have two free hours.","Le recomiendo el miércoles por la mañana. Tenemos dos horas libres."],["Lucía","That is much earlier than my class. I finish at three.","Eso es mucho más temprano que mi clase. Termino a las tres."],["Mr. Prado","Then Wednesday is not the best option for you.","Entonces el miércoles no es la mejor opción para usted."],["Lucía","Could we try Thursday? Perhaps in the afternoon.","¿Podríamos intentar el jueves? Quizás en la tarde."],["Mr. Prado","Hold the line, please. This takes some minutes.","Espere en la línea, por favor. Esto toma algunos minutos."],["Lucía","No problem. I am waiting.","No hay problema. Estoy esperando."],["Mr. Prado","Thursday at three, or Thursday at four. Which one do you prefer?","Jueves a las tres, o jueves a las cuatro. ¿Cuál prefiere?"],["Lucía","Four, please. Three is not as good as four for me.","Las cuatro, por favor. Las tres no me quedan tan bien como las cuatro."],["Mr. Prado","Perfect. Thursday at four, then.","Perfecto. Jueves a las cuatro, entonces."],["Lucía","Do I need to bring anything different?","¿Necesito traer algo diferente?"],["Mr. Prado","Bring your ID and this record number. Write it down, please.","Traiga su documento y este número de registro. Anótelo, por favor."],["Lucía","One moment. I am looking for a pen.","Un momento. Estoy buscando un lapicero."],["Mr. Prado","Take your time. The number is 4-1-6-3.","Tómese su tiempo. El número es 4-1-6-3."],["Lucía","Four, one, six, three. And what happens if I arrive late?","Cuatro, uno, seis, tres. ¿Y qué pasa si llego tarde?"],["Mr. Prado","Unless you arrive before half past four, we move you to the next week.","A menos que llegue antes de las cuatro y media, la pasamos a la semana siguiente."],["Lucía","Understood. I plan to arrive ten minutes early.","Entendido. Planeo llegar diez minutos antes."],["Mr. Prado","That is the safest plan. I am sending you a message to confirm.","Ese es el plan más seguro. Le estoy enviando un mensaje para confirmar."],["Lucía","Thank you very much for your patience.","Muchas gracias por su paciencia."],["Mr. Prado","Thank you for calling. See you on Thursday.","Gracias por llamar. Nos vemos el jueves."]]},"2":{"sTitle":"Who Covers the Shift?","sTitleEs":"¿Quién cubre el turno?","dTitle":"Swapping a Shift","dTitleEs":"Cambiando un turno","paras":[[["Diego worked at a store in the centre, six hours per day, five days a week.","Diego trabajaba en una tienda del centro, seis horas por día, cinco días a la semana."],["His hours were regular, and he liked working with people who arrived early.","Sus horarios eran regulares, y le gustaba trabajar con gente que llegaba temprano."],["He had been there for eight months, and he knew every box in the back room.","Llevaba ocho meses ahí, y conocía cada caja del almacén."],["The store opened at nine, though the team began at half past eight.","La tienda abría a las nueve, aunque el equipo empezaba a las ocho y media."],["\"A shift is like an appointment,\" his manager often said. \"You don't move it for fun.\"","\"Un turno es como una cita\", decía a menudo su jefa. \"No lo mueves por diversión\"."]],[["One Friday morning, his phone rang while he was eating fruit for breakfast.","Un viernes por la mañana, su teléfono sonó mientras desayunaba fruta."],["It was his mother: his little brother had a legal appointment at ten, and she needed help.","Era su mamá: su hermanito tenía una cita legal a las diez, y ella necesitaba ayuda."],["Diego stood up quickly and looked at the clock: his shift began in two hours.","Diego se puso de pie rápido y miró el reloj: su turno empezaba en dos horas."],["He didn't want to call off his shift, because two people had already left that month.","No quería cancelar su turno, porque dos personas ya se habían ido ese mes."],["\"I need to find someone,\" he thought, \"and I need to do it carefully.\"","\"Necesito encontrar a alguien\", pensó, \"y necesito hacerlo con cuidado\"."]],[["First, he wrote a short message and read it twice before sending it.","Primero, escribió un mensaje corto y lo leyó dos veces antes de enviarlo."],["Then he called Ana, who lived nearly ten minutes from the store.","Luego llamó a Ana, que vivía a casi diez minutos de la tienda."],["Ana answered slowly; she was tired, because she had studied until one.","Ana contestó despacio; estaba cansada, porque había estudiado hasta la una."],["\"I don't mind covering the morning,\" she said, \"but my class finishes at eleven.\"","\"No me molesta cubrir la mañana\", dijo, \"pero mi clase termina a las once\"."],["That was a problem: the busiest hours of the day were between ten and twelve.","Eso era un problema: las horas más ocupadas del día eran entre las diez y las doce."]],[["Besides Ana, only two people knew how to operate the small machine at the front.","Además de Ana, solo dos personas sabían operar la máquina pequeña del frente."],["One of them was on holiday, and the other one had a different shift that day.","Una de ellas estaba de vacaciones, y la otra tenía un turno diferente ese día."],["Diego wrote all the names on a piece of paper, in red and in white boxes.","Diego escribió todos los nombres en un papel, en cuadros rojos y blancos."],["\"Perhaps we can divide the shift,\" Ana suggested. \"Two short pieces are easier than one long one.\"","\"Quizás podemos dividir el turno\", sugirió Ana. \"Dos partes cortas son más fáciles que una larga\"."],["In his opinion, that idea was far better than losing the whole morning.","En su opinión, esa idea era mucho mejor que perder toda la mañana."]],[["After that, they called Mrs. Reyes, the manager, and explained the situation.","Después de eso, llamaron a la señora Reyes, la jefa, y explicaron la situación."],["She listened without interrupting, and she thought about it for a period of two minutes.","Ella escuchó sin interrumpir, y lo pensó por un periodo de dos minutos."],["\"The rule is simple,\" she said. \"You need at least one person at the front.\"","\"La regla es simple\", dijo. \"Necesitan al menos una persona en el frente\"."],["\"Unless the store is closed, that place is never empty.\"","\"A menos que la tienda esté cerrada, ese lugar nunca está vacío\"."],["Diego agreed to come back at eleven, and Ana agreed to open the store.","Diego aceptó volver a las once, y Ana aceptó abrir la tienda."]],[["Mrs. Reyes wrote the change in the record, thus nobody could forget it.","La señora Reyes escribió el cambio en el registro, así nadie podía olvidarlo."],["\"Whenever you swap a shift, tell me the same day,\" she reminded them.","\"Cada vez que cambien un turno, avísenme el mismo día\", les recordó."],["She refused to accept messages after eight at night, and everybody understood why.","Se negaba a aceptar mensajes después de las ocho de la noche, y todos entendían por qué."],["\"A plan that arrives late is not really a plan,\" she said.","\"Un plan que llega tarde no es realmente un plan\", dijo."],["Diego thanked her twice, once on the phone and once in person.","Diego le agradeció dos veces, una por teléfono y otra en persona."]],[["The legal appointment went well, though the office was quite cold that morning.","La cita legal salió bien, aunque la oficina estaba bastante fría esa mañana."],["His brother cried a little in the waiting room, and Diego held his hand.","Su hermanito lloró un poco en la sala de espera, y Diego le tomó la mano."],["They left at ten to eleven and walked straight to the bus stop.","Salieron a las once menos diez y caminaron directo al paradero."],["The bus arrived at a good speed, and he reached the store at eleven exactly.","El bus llegó a buena velocidad, y él llegó a la tienda a las once en punto."],["Ana was smiling at the front, and the machine was working perfectly.","Ana estaba sonriendo en el frente, y la máquina estaba funcionando perfectamente."]],[["\"The problem was ours, and we solved it ourselves,\" Ana said, laughing.","\"El problema era nuestro, y lo resolvimos nosotros mismos\", dijo Ana, riendo."],["\"Next time the problem will be theirs, and they will solve it themselves,\" Diego answered.","\"La próxima vez el problema será de ellos, y lo resolverán ellos mismos\", respondió Diego."],["Mrs. Reyes, who leads the team, recommended writing a small note for the next shift.","La señora Reyes, que lidera el equipo, recomendó escribir una notita para el siguiente turno."],["Throughout the afternoon, three clients asked for the same thing, and nobody was lost.","Durante toda la tarde, tres clientes pidieron lo mismo, y nadie se perdió."],["That day, Diego learned that a good coordination is worth more than a fast answer.","Ese día, Diego aprendió que una buena coordinación vale más que una respuesta rápida."]]],"datos":["Presente vs pasado: la historia va en pasado, pero <span class=\"frase\">You don't move it for fun</span> es una regla general.","Phrasal verb: <span class=\"frase\">call off</span> = cancelar · <b>want to</b> + verbo · <b>need to</b> + verbo.","Secuenciadores <b>First… Then…</b> · Relativa con <b>who</b>: <span class=\"frase\">Ana, who lived nearly ten minutes from the store</span>.","Superlativo con <b>of</b>: <span class=\"frase\">the busiest hours of the day</span> · Comparativo: <span class=\"frase\">easier than</span>.","Intensificador: <span class=\"frase\">far better than</span> · <b>Besides</b> = además de.","<b>Agree to</b> + verbo · <b>Refuse to</b> + verbo · <b>Whenever</b> = cada vez que.","Adverbio de grado: <span class=\"frase\">quite cold</span> · Adverbio de modo: <span class=\"frase\">walked straight</span> · <span class=\"frase\">perfectly</span>.","Posesivos: <b>ours · theirs</b> · Reflexivo: <b>ourselves / themselves</b> · <b>Throughout</b> = durante todo."],"dlg":[["Diego","Ana, I have a problem with my shift this morning. Can we talk?","Ana, tengo un problema con mi turno de esta mañana. ¿Podemos hablar?"],["Ana","Of course. What happened?","Claro. ¿Qué pasó?"],["Diego","My brother has a legal appointment at ten, and my mother needs help.","Mi hermano tiene una cita legal a las diez, y mi mamá necesita ayuda."],["Ana","That is important. Do you want to swap shifts?","Eso es importante. ¿Quieres cambiar turnos?"],["Diego","I would like to, yes. Could you open the store?","Me gustaría, sí. ¿Podrías abrir la tienda?"],["Ana","I don't mind opening, but my class finishes at eleven.","No me molesta abrir, pero mi clase termina a las once."],["Diego","Eleven is fine. I plan to be back at eleven exactly.","Las once está bien. Planeo estar de vuelta a las once en punto."],["Ana","Are you sure? The traffic is slower on Fridays.","¿Estás seguro? El tráfico es más lento los viernes."],["Diego","The bus is not as slow as it looks. I take the direct one.","El bus no es tan lento como parece. Tomo el directo."],["Ana","All right. Who tells Mrs. Reyes?","Está bien. ¿Quién le avisa a la señora Reyes?"],["Diego","I do. I don't want to put it off until the afternoon.","Yo. No quiero dejarlo para la tarde."],["Ana","Good. She hates late messages.","Bien. Ella odia los mensajes tarde."],["Diego","She refuses to accept them after eight, and she is right.","Se niega a aceptarlos después de las ocho, y tiene razón."],["Ana","Besides, she writes everything in the record.","Además, ella escribe todo en el registro."],["Diego","Exactly. A change that nobody writes down is not a change.","Exacto. Un cambio que nadie anota no es un cambio."],["Ana","One more thing: can you operate the machine at the front?","Una cosa más: ¿puedes operar la máquina del frente?"],["Diego","Yes, but you do it much faster than me.","Sí, pero tú lo haces mucho más rápido que yo."],["Ana","Then I stay at the front, and you take the boxes in the back.","Entonces yo me quedo en el frente, y tú tomas las cajas del almacén."],["Diego","Perfect. That is the simplest plan of all.","Perfecto. Ese es el plan más simple de todos."],["Ana","Do you need anything else?","¿Necesitas algo más?"],["Diego","No, thank you. Really, you saved my morning.","No, gracias. De verdad, me salvaste la mañana."],["Ana","Whenever you need help, ask me early. Early is easier.","Cada vez que necesites ayuda, pídemela temprano. Temprano es más fácil."],["Diego","I promise to call you before eight next time.","Prometo llamarte antes de las ocho la próxima vez."],["Ana","And I promise not to say no, unless I have an exam.","Y yo prometo no decir que no, a menos que tenga un examen."],["Diego","Deal. See you at eleven.","Trato hecho. Nos vemos a las once."],["Ana","See you. Say hello to your mother.","Nos vemos. Saluda a tu mamá."]]},"3":{"sTitle":"The Papers for the Office","sTitleEs":"Los papeles para la oficina","dTitle":"Three People, One Signature","dTitleEs":"Tres personas, una firma","paras":[[["Marta has an official appointment on the third of June, at nine in the morning.","Marta tiene una cita oficial el tres de junio, a las nueve de la mañana."],["The office is in the west of the city, next to a building with a white front.","La oficina está en el oeste de la ciudad, al lado de un edificio de fachada blanca."],["She needs three papers, and one of them needs a signature from her school.","Necesita tres papeles, y uno de ellos necesita una firma de su colegio."],["\"Getting a signature is not as easy as it sounds,\" her friends tell her.","\"Conseguir una firma no es tan fácil como suena\", le dicen sus amigos."],["Marta doesn't want to lose the appointment, so she starts a week before.","Marta no quiere perder la cita, así que empieza una semana antes."]],[["First, she reads the list of documents carefully, line by line.","Primero, lee la lista de documentos con cuidado, línea por línea."],["The list says that every paper must be in black or blue, never in red.","La lista dice que todo papel debe estar en negro o azul, nunca en rojo."],["\"Color is a strange rule,\" she thinks, \"but rules are rules.\"","\"El color es una regla extraña\", piensa, \"pero las reglas son reglas\"."],["She buys a new pen and writes her full name at the top of the form.","Compra un lapicero nuevo y escribe su nombre completo en la parte de arriba del formulario."],["Then she fills in the boxes slowly, because a mistake means printing everything again.","Luego llena las casillas despacio, porque un error significa imprimir todo otra vez."]],[["The next morning she goes to the school office, where Mrs. Vidal, the admin, works.","A la mañana siguiente va a la oficina del colegio, donde trabaja la señora Vidal, la administradora."],["Mrs. Vidal is the person who knows every rule of the building.","La señora Vidal es la persona que conoce cada regla del edificio."],["\"Your form is nearly perfect,\" she says, \"but this part is not for me.\"","\"Tu formulario está casi perfecto\", dice, \"pero esta parte no es para mí\"."],["\"The teacher of your class signs this line, and I stamp the other one.\"","\"El profesor de tu clase firma esta línea, y yo sello la otra\"."],["Marta writes a note and puts it in her bag so that she doesn't forget.","Marta escribe una nota y la guarda en su bolso para no olvidarse."]],[["Mr. Ortega, her teacher, is quite busy, because he is preparing an exam.","El señor Ortega, su profesor, está bastante ocupado, porque está preparando un examen."],["He teaches grammar, and that morning his class is studying nouns and vowels.","Él enseña gramática, y esa mañana su clase está estudiando sustantivos y vocales."],["\"Come at eleven,\" he says. \"I don't like signing papers in the middle of a lesson.\"","\"Ven a las once\", dice. \"No me gusta firmar papeles en medio de una clase\"."],["Marta thanks him and waits outside, though she is a little worried about the time.","Marta le agradece y espera afuera, aunque está un poco preocupada por la hora."],["At eleven exactly, she knocks twice and opens the door.","A las once en punto, toca dos veces y abre la puerta."]],[["Mr. Ortega reads the whole form before he touches his pen.","El señor Ortega lee todo el formulario antes de tocar su lapicero."],["\"This is the most important line of the paper,\" he says, \"and it is empty.\"","\"Esta es la línea más importante del papel\", dice, \"y está vacía\"."],["Marta looks at it and feels her legs go cold for a second.","Marta la mira y siente que se le enfrían las piernas por un segundo."],["The line asks for the length of the course in months, and she left it blank.","La línea pide la duración del curso en meses, y ella la dejó en blanco."],["\"Six months,\" he says, \"and now the paper is ready for my signature.\"","\"Seis meses\", dice, \"y ahora el papel está listo para mi firma\"."]],[["After that, the three of them meet in the office for two minutes.","Después de eso, los tres se reúnen en la oficina por dos minutos."],["Mrs. Vidal holds the paper, Mr. Ortega signs it, and the last stamp is hers.","La señora Vidal sostiene el papel, el señor Ortega lo firma, y el último sello es de ella."],["\"Never leave the office without reading what you are carrying,\" the admin recommends.","\"Nunca salgas de la oficina sin leer lo que llevas\", recomienda la administradora."],["In her opinion, half of the problems in that office come from empty lines.","En su opinión, la mitad de los problemas de esa oficina vienen de líneas vacías."],["\"Papers that nobody reads are the worst papers in the world,\" she adds, smiling.","\"Los papeles que nadie lee son los peores papeles del mundo\", agrega, sonriendo."]],[["On the third of June, Marta gets up early and looks at the moon in a cold sky.","El tres de junio, Marta se levanta temprano y mira la luna en un cielo frío."],["She is hungry, but she prefers to eat a piece of fruit on the bus.","Tiene hambre, pero prefiere comer una fruta en el bus."],["The road is straight, thus the trip is much shorter than she expected.","El camino es recto, por eso el viaje es mucho más corto de lo que esperaba."],["She arrives at half past eight, with her three papers in a plastic folder.","Llega a las ocho y media, con sus tres papeles en un fólder de plástico."],["A woman in front of her is crying, because she forgot her third document.","Una mujer delante de ella está llorando, porque olvidó su tercer documento."]],[["The man at the window checks every line, and he doesn't reject anything.","El hombre de la ventanilla revisa cada línea, y no rechaza nada."],["\"Whenever people come prepared,\" he says, \"this takes six minutes.\"","\"Cada vez que la gente viene preparada\", dice, \"esto toma seis minutos\"."],["Marta leaves the office at ten past nine, tired but really happy.","Marta sale de la oficina a las nueve y diez, cansada pero de verdad feliz."],["She sends a message to Mrs. Vidal and another one to Mr. Ortega.","Le manda un mensaje a la señora Vidal y otro al señor Ortega."],["\"Thank you both,\" she writes. \"The signature that we did together opened the door.\"","\"Gracias a los dos\", escribe. \"La firma que hicimos juntos abrió la puerta\"."]]],"datos":["<b>Not as … as</b>: <span class=\"frase\">not as easy as it sounds</span> · <b>want to</b> + verbo.","Adverbio de modo: <span class=\"frase\">carefully</span> · <span class=\"frase\">slowly</span> · Phrasal verb: <span class=\"frase\">fills in the boxes</span>.","Relativa con <b>who</b>: <span class=\"frase\">the person who knows every rule</span> · Adverbio de grado: <span class=\"frase\">nearly perfect</span>.","Adverbio de grado: <span class=\"frase\">quite busy</span> · Presente continuo: <span class=\"frase\">is preparing an exam</span> · <b>like + -ing</b>: <span class=\"frase\">I don't like signing</span>.","Superlativo con <b>of</b>: <span class=\"frase\">the most important line of the paper</span>.","Superlativo con <b>in</b>: <span class=\"frase\">the worst papers in the world</span> · Relativa: <span class=\"frase\">papers that nobody reads</span>.","<b>Prefer to</b> + verbo · Intensificador + comparativo: <span class=\"frase\">much shorter than</span>.","<b>Whenever</b> = cada vez que · Adverbio de grado: <span class=\"frase\">really happy</span>."],"dlg":[["Marta","Good morning, Mrs. Vidal. I need a signature for an official appointment.","Buenos días, señora Vidal. Necesito una firma para una cita oficial."],["Mrs. Vidal","Good morning, Marta. Let me see the form, please.","Buenos días, Marta. Déjame ver el formulario, por favor."],["Marta","Here it is. I filled it in yesterday, with a blue pen.","Aquí está. Lo llené ayer, con un lapicero azul."],["Mrs. Vidal","Good. Blue or black; red is not accepted here.","Bien. Azul o negro; el rojo no se acepta aquí."],["Marta","I read that rule three times, so I bought a new pen.","Leí esa regla tres veces, así que compré un lapicero nuevo."],["Mrs. Vidal","Your form is nearly perfect, but this line is not for me.","Tu formulario está casi perfecto, pero esta línea no es para mí."],["Marta","Who signs that part?","¿Quién firma esa parte?"],["Mrs. Vidal","The teacher who has your class. That is Mr. Ortega.","El profesor que tiene tu clase. Ese es el señor Ortega."],["Mr. Ortega","Did somebody say my name? I am looking for the exam papers.","¿Alguien dijo mi nombre? Estoy buscando los exámenes."],["Marta","Good morning, sir. Could you sign this form for my appointment?","Buenos días, profesor. ¿Podría firmar este formulario para mi cita?"],["Mr. Ortega","I can, but not now. I don't like signing papers in the middle of a lesson.","Puedo, pero no ahora. No me gusta firmar papeles en medio de una clase."],["Marta","I understand. What hour do you recommend?","Entiendo. ¿Qué hora me recomienda?"],["Mr. Ortega","Come at eleven. That is the quietest hour of my morning.","Ven a las once. Es la hora más tranquila de mi mañana."],["Mrs. Vidal","And bring the form here after that, because I stamp the last line.","Y trae el formulario aquí después, porque yo sello la última línea."],["Marta","So: first the signature, then the stamp. Is that the order?","Entonces: primero la firma, luego el sello. ¿Ese es el orden?"],["Mrs. Vidal","Exactly. The stamp without the signature is worth nothing.","Exacto. El sello sin la firma no vale nada."],["Mr. Ortega","One moment. This line is empty. How long is your course?","Un momento. Esta línea está vacía. ¿Cuánto dura tu curso?"],["Marta","Six months. I am sorry, I didn't see it.","Seis meses. Lo siento, no la vi."],["Mr. Ortega","Write it carefully. An empty line is worse than a slow answer.","Escríbelo con cuidado. Una línea vacía es peor que una respuesta lenta."],["Marta","Done. Six months, in blue.","Listo. Seis meses, en azul."],["Mrs. Vidal","Perfect. Now everything is in order.","Perfecto. Ahora todo está en orden."],["Mr. Ortega","Here is my signature. Take a photo of the paper too.","Aquí está mi firma. Toma también una foto del papel."],["Marta","Thank you. Should I bring anything different to the office?","Gracias. ¿Debo llevar algo diferente a la oficina?"],["Mrs. Vidal","Bring your ID and this record number. Don't put it off until the morning of the appointment.","Lleva tu documento y este número de registro. No lo dejes para la mañana de la cita."],["Marta","I promise to prepare everything tonight.","Prometo preparar todo esta noche."],["Mr. Ortega","Good luck on the third. Tell us how it goes.","Suerte el día tres. Cuéntanos cómo te va."],["Marta","I will. Thank you both very much.","Lo haré. Muchas gracias a los dos."],["Mrs. Vidal","Whenever you need help, come early. Early is always easier.","Cada vez que necesites ayuda, ven temprano. Temprano siempre es más fácil."]]},"4":{"sTitle":"The Last-Minute Change","sTitleEs":"El cambio de último momento","dTitle":"Changing the Hotel Booking","dTitleEs":"Cambiando la reserva del hotel","paras":[[["Tomás was sleeping when his phone rang at four in the morning.","Tomás estaba durmiendo cuando su teléfono sonó a las cuatro de la mañana."],["His aunt Rosa was calling from the airport in another city, and she sounded tired.","Su tía Rosa llamaba desde el aeropuerto de otra ciudad, y sonaba cansada."],["\"They moved my flight,\" she said. \"I am arriving at six, not at eleven.\"","\"Movieron mi vuelo\", dijo. \"Llego a las seis, no a las once\"."],["Tomás stood up quickly and looked out of the window: the moon was still white and clear.","Tomás se puso de pie rápido y miró por la ventana: la luna todavía estaba blanca y clara."],["\"Don't worry,\" he answered. \"I plan to be there before six.\"","\"No te preocupes\", respondió. \"Planeo estar ahí antes de las seis\"."]],[["First, he made a list on the back of an old note, in red ink.","Primero, hizo una lista al reverso de una nota vieja, con tinta roja."],["The car needed oil, and the road to the airport passed near the mountain.","El carro necesitaba aceite, y la carretera al aeropuerto pasaba cerca del cerro."],["Then he remembered the hotel: the room was booked for eleven, not for six.","Luego se acordó del hotel: el cuarto estaba reservado para las once, no para las seis."],["\"A change that touches one plan usually touches three,\" he thought.","\"Un cambio que toca un plan normalmente toca tres\", pensó."],["He decided to call the hotel first, because offices open earlier than shops.","Decidió llamar primero al hotel, porque las oficinas abren más temprano que las tiendas."]],[["The road was cold and empty, and the car moved at a regular speed.","La carretera estaba fría y vacía, y el carro iba a una velocidad regular."],["After twenty minutes, he saw a horse standing quietly in the middle of the road.","Después de veinte minutos, vio un caballo parado tranquilamente en medio de la pista."],["Tomás didn't hit the animal; he pulled the wheel to the left and stopped.","Tomás no golpeó al animal; jaló el timón a la izquierda y paró."],["A man came out of a small house and pulled the horse away, without hurrying.","Un hombre salió de una casita y se llevó al caballo, sin apurarse."],["\"Sometimes the mountain road is stranger than the city,\" the man said, laughing.","\"A veces la carretera del cerro es más extraña que la ciudad\", dijo el hombre, riendo."]],[["Ten minutes later, the front wheel hit a hole, and the car began to make a noise.","Diez minutos después, la llanta delantera cayó en un hueco, y el carro empezó a hacer un ruido."],["Tomás stopped again and looked at the wheel: it needed a small repair, not a new tyre.","Tomás paró otra vez y miró la llanta: necesitaba una reparación pequeña, no una llanta nueva."],["His legs were shaking a little, though the damage was far smaller than he expected.","Le temblaban un poco las piernas, aunque el daño era mucho menor de lo que esperaba."],["He worked slowly and carefully, and after twelve minutes the car was ready.","Trabajó despacio y con cuidado, y después de doce minutos el carro estuvo listo."],["\"I don't throw away a morning for a hole in the road,\" he said to himself.","\"No boto una mañana por un hueco en la pista\", se dijo a sí mismo."]],[["At half past five, the sky over the sea turned red, and the waves looked white.","A las cinco y media, el cielo sobre el mar se puso rojo, y las olas se veían blancas."],["He was hungry, so he bought fruit and water at a small store near the coast.","Tenía hambre, así que compró fruta y agua en una tienda pequeña cerca de la costa."],["The woman at the store recommended the shortest way, which nobody uses at that hour.","La señora de la tienda le recomendó el camino más corto, que nadie usa a esa hora."],["\"Go straight for six kilometres, and don't turn at the white house,\" she said.","\"Sigue recto seis kilómetros, y no dobles en la casa blanca\", dijo."],["Thus Tomás arrived at the airport at ten to six, with the sun behind him.","Así, Tomás llegó al aeropuerto a las seis menos diez, con el sol detrás."]],[["Aunt Rosa was waiting in front of the door, wearing a white coat, with two bags and a red ring on her hand.","La tía Rosa esperaba frente a la puerta, con un abrigo blanco puesto, dos maletas y un anillo rojo en la mano."],["She cried a little when she saw him, because the night had been long.","Lloró un poquito cuando lo vio, porque la noche había sido larga."],["\"You are the best nephew in this family,\" she said, and they both laughed.","\"Eres el mejor sobrino de esta familia\", dijo, y los dos se rieron."],["\"The trip was not as bad as it sounds,\" she added, \"but I don't want to travel at night again.\"","\"El viaje no fue tan malo como suena\", agregó, \"pero no quiero volver a viajar de noche\"."],["They put the bags in the car and left the airport at six exactly.","Pusieron las maletas en el carro y salieron del aeropuerto a las seis en punto."]],[["On the way back, Tomás called the hotel and asked to move the reservation.","De regreso, Tomás llamó al hotel y pidió mover la reserva."],["The receptionist accepted the change, though the room was not ready before ten.","El recepcionista aceptó el cambio, aunque el cuarto no estaba listo antes de las diez."],["\"Unless you need to sleep now, you can leave the bags with us,\" he offered.","\"A menos que necesite dormir ahora, puede dejar las maletas con nosotros\", ofreció."],["Aunt Rosa preferred to have breakfast first, and Tomás agreed to wait with her.","La tía Rosa prefirió desayunar primero, y Tomás aceptó esperar con ella."],["\"A hot coffee is better than a cold room,\" she said, and nobody disagreed.","\"Un café caliente es mejor que un cuarto frío\", dijo, y nadie estuvo en desacuerdo."]],[["Later, in the hotel, they talked about the strange morning and its three changes.","Más tarde, en el hotel, hablaron de la mañana extraña y sus tres cambios."],["\"Whenever a plan changes, we lose the least important thing: the hour,\" Rosa said.","\"Cada vez que un plan cambia, perdemos lo menos importante: la hora\", dijo Rosa."],["Tomás wrote the whole story in a note, throughout two pages, to remember it.","Tomás escribió toda la historia en una nota, a lo largo de dos páginas, para recordarla."],["Perhaps the horse and the hole were the funniest parts of the trip.","Quizás el caballo y el hueco fueron las partes más divertidas del viaje."],["\"Next time,\" he wrote at the end, \"I call the hotel before I start the car.\"","\"La próxima vez\", escribió al final, \"llamo al hotel antes de arrancar el carro\"."]]],"datos":["Pasado continuo + pasado simple: <span class=\"frase\">was sleeping when his phone rang</span> · Presente continuo con futuro: <span class=\"frase\">I am arriving at six</span>.","<b>Decide to</b> + verbo · Relativa con <b>that</b>: <span class=\"frase\">a change that touches one plan</span>.","Adverbio de modo: <span class=\"frase\">standing quietly</span> · Comparativo: <span class=\"frase\">stranger than the city</span>.","Intensificador: <span class=\"frase\">far smaller than</span> · Phrasal verb: <span class=\"frase\">throw away</span>.","Superlativo: <span class=\"frase\">the shortest way</span> · Relativa con <b>which</b>: <span class=\"frase\">which nobody uses</span>.","Superlativo con <b>in</b>: <span class=\"frase\">the best nephew in this family</span> · <b>Not as … as</b>: <span class=\"frase\">not as bad as it sounds</span>.","<b>Unless</b> = a menos que · <b>Prefer to</b> · <b>Agree to</b> + verbo.","<b>Throughout</b> = a lo largo de · Superlativo largo: <span class=\"frase\">the funniest parts</span> · <b>Perhaps</b> = quizás."],"dlg":[["Tomás","Good morning. I would like to change a reservation, please.","Buenos días. Quisiera cambiar una reserva, por favor."],["Receptionist","Good morning. Could you give me the name and the date?","Buenos días. ¿Me puede dar el nombre y la fecha?"],["Tomás","Rosa Medina, for today. The booking is for eleven o'clock.","Rosa Medina, para hoy. La reserva es para las once."],["Receptionist","I have it here. Do you want to move it to another day?","La tengo aquí. ¿Quiere moverla a otro día?"],["Tomás","No, the same day. Her flight changed, and she is arriving at six.","No, el mismo día. Su vuelo cambió, y llega a las seis."],["Receptionist","I see. The room is not ready before ten, though.","Entiendo. Sin embargo, el cuarto no está listo antes de las diez."],["Tomás","Is there any way to enter earlier?","¿Hay alguna manera de entrar más temprano?"],["Receptionist","Unless somebody leaves early, ten is the first hour.","A menos que alguien salga temprano, las diez es la primera hora."],["Tomás","All right. Can we leave the bags with you?","Está bien. ¿Podemos dejar las maletas con ustedes?"],["Receptionist","Of course. We hold them at the front, with a number.","Por supuesto. Las guardamos en el frente, con un número."],["Tomás","Perfect. That is much better than waiting in the car.","Perfecto. Eso es mucho mejor que esperar en el carro."],["Receptionist","Is your aunt travelling alone?","¿Su tía viaja sola?"],["Tomás","Yes, and she is quite tired. It was a long night.","Sí, y está bastante cansada. Fue una noche larga."],["Receptionist","Then I recommend the room on the third floor. It is the quietest one of all.","Entonces le recomiendo el cuarto del tercer piso. Es el más tranquilo de todos."],["Tomás","Is it as big as the other rooms?","¿Es tan grande como los otros cuartos?"],["Receptionist","It is slightly smaller, but it is far quieter.","Es un poco más pequeño, pero es mucho más tranquilo."],["Tomás","We take it. She doesn't like sleeping near the street.","Lo tomamos. A ella no le gusta dormir cerca de la calle."],["Receptionist","Good choice. Do you need breakfast for two?","Buena elección. ¿Necesita desayuno para dos?"],["Tomás","Yes, please. We are really hungry after that road.","Sí, por favor. Tenemos mucha hambre después de esa carretera."],["Receptionist","Breakfast finishes at ten, so you have time.","El desayuno termina a las diez, así que tienen tiempo."],["Tomás","One more thing: is there a place to repair a wheel nearby?","Una cosa más: ¿hay algún lugar cerca para reparar una llanta?"],["Receptionist","There is one behind the hotel. They open at eight, whenever the owner arrives.","Hay uno detrás del hotel. Abren a las ocho, cada vez que llega el dueño."],["Tomás","Thank you. I don't want to put that repair off.","Gracias. No quiero dejar esa reparación para después."],["Receptionist","You are right. Small problems become big ones.","Tiene razón. Los problemas pequeños se vuelven grandes."],["Tomás","Thank you very much for changing everything so quickly.","Muchas gracias por cambiar todo tan rápido."],["Receptionist","With pleasure. See you at ten, and welcome.","Con gusto. Nos vemos a las diez, y bienvenidos."]]}};

<script>
(function(){
  var FX={i:0,playing:false,sents:[],cfg:null};
  try{ FX.cfg=JSON.parse(localStorage.getItem("jucum_focus_cfg")||"null"); }catch(e){}
  FX.cfg=FX.cfg||{accent:"US",rate:0.9,text:"both"};
  function $g(id){return document.getElementById(id);}
  window.openFocus=function(){
    try{ if(!PARAS||!PARAS.length) return; }catch(e){ return; }
    FX.sents=[]; PARAS.forEach(function(p){ (p.pairs||[]).forEach(function(q){ FX.sents.push({en:q.en,es:q.es}); }); });
    try{ pausePlay(); }catch(e){}
    try{ $g("fxov").setAttribute("data-level", document.getElementById("screen").getAttribute("data-level")||"a2"); }catch(e){} $g("fxov").style.display="block"; fxShowSet();
  };
  function fxShowSet(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){}
    $g("fxset").style.display="block"; $g("fxread").style.display="none"; fxPaint(); }
  window.fxGear=function(){ fxShowSet(); };
  window.fxCfg=function(k,v){ FX.cfg[k]=v; try{localStorage.setItem("jucum_focus_cfg",JSON.stringify(FX.cfg));}catch(e){} fxPaint(); };
  function fxPaint(){ ["US","GB"].forEach(function(a){ $g("fxa"+a).classList.toggle("on",FX.cfg.accent===a); });
    [[0.75,"fxr075"],[0.9,"fxr09"],[1,"fxr1"],[1.15,"fxr115"]].forEach(function(p){ $g(p[1]).classList.toggle("on",FX.cfg.rate===p[0]); });
    $g("fxten").classList.toggle("on",FX.cfg.text==="en"); $g("fxtboth").classList.toggle("on",FX.cfg.text==="both"); }
  window.fxStart=function(){ FX.i=0; $g("fxset").style.display="none"; $g("fxread").style.display="flex"; FX.playing=true; fxRender(); fxSay(); };
  window.closeFocus=function(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} $g("fxov").style.display="none"; };
  function fxVoice(){ try{ var vs=speechSynthesis.getVoices()||[]; var gb=(FX.cfg.accent==="GB"||FX.cfg.accent==="UK"); var want=gb?"en-gb":"en-us";
    var pref= gb?["Google UK English Female","Google UK English Male","Microsoft Sonia","Microsoft Libby","Microsoft Ryan","Microsoft Thomas","Daniel","Kate","Serena"]:["Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Michelle","Microsoft Ana","Samantha","Alex"];
    var en=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf("en")===0;});
    var exact=en.filter(function(v){return v.lang.replace("_","-").toLowerCase()===want;});
    for(var i=0;i<pref.length;i++){ for(var j=0;j<exact.length;j++){ if(exact[j].name&&exact[j].name.indexOf(pref[i])===0) return exact[j]; } }
    if(exact.length) return exact[0];
    for(var i2=0;i2<pref.length;i2++){ for(var j2=0;j2<en.length;j2++){ if(en[j2].name&&en[j2].name.indexOf(pref[i2])===0) return en[j2]; } }
    return en[0]||null; }catch(e){ return null; } }
  function fxRender(){ var s=FX.sents[FX.i]||{en:"",es:""};
    $g("fxcnt").textContent="ORACIÓN "+(FX.i+1)+" DE "+FX.sents.length;
    $g("fxen").textContent=s.en; $g("fxes").textContent=s.es;
    $g("fxes").style.display=FX.cfg.text==="both"?"block":"none";
    $g("fxplay").textContent=FX.playing?"⏸":"▶";
    $g("fxbar").style.width=(FX.sents.length?Math.round((FX.i+1)/FX.sents.length*100):0)+"%"; }
  function fxSay(){ try{ speechSynthesis.cancel(); var s=FX.sents[FX.i]; if(!s) return;
    var u=new SpeechSynthesisUtterance(s.en); u.rate=FX.cfg.rate; var v=fxVoice(); if(v){u.voice=v;u.lang=v.lang;} else u.lang="en-US";
    u.onend=function(){ if(!FX.playing) return; if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); setTimeout(function(){ if(FX.playing) fxSay(); },420); } else { FX.playing=false; fxRender(); } };
    speechSynthesis.speak(u); }catch(e){}
  }
  window.fxToggle=function(){ if(FX.playing){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} } else { FX.playing=true; fxSay(); } fxRender(); };
  window.fxPrev=function(){ if(FX.i>0){ FX.i--; fxRender(); if(FX.playing) fxSay(); } };
  window.fxNext=function(){ if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); if(FX.playing) fxSay(); } };
})();
</script>

  (function seed(k){ var api=window.JUCUM_CONNECT;

  })(0);

  ring();
