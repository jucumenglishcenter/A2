<script>
const GLOSS = [{"w":"bank account","es":"cuenta bancaria","ex":"Sofía opened her first bank account two months ago."},{"w":"savings","es":"ahorros","ex":"Money under the mattress is savings that sleep badly."},{"w":"statement","es":"estado de cuenta","ex":"She was checking her statement when she saw the charge."},{"w":"charge / fee","es":"cargo / comisión","ex":"A strange charge appeared on the bill: \"service fee\"."},{"w":"bill","es":"factura / recibo","ex":"Check every bill, line by line, once a month."},{"w":"budget","es":"presupuesto","ex":"A budget is a plan that tells your money where to go."},{"w":"dispute","es":"disputar (un cargo)","ex":"You can dispute a charge that you never made."},{"w":"block / freeze","es":"bloquear / congelar","ex":"The bank froze the card as soon as he reported it."},{"w":"verify / verification","es":"verificar / verificación","ex":"Verification protects your money, even when it feels slow."},{"w":"terms and conditions","es":"términos y condiciones","ex":"The terms explain the fees that nobody reads."},{"w":"maintenance fee","es":"comisión de mantenimiento","ex":"She chose the account that charges no maintenance fee."},{"w":"cash / transfer","es":"efectivo / transferencia","ex":"A transfer arrives faster than a bus with no traffic."},{"w":"receipt","es":"recibo / constancia","ex":"Keep the receipt until the money appears, just in case."},{"w":"a few / a little","es":"unos pocos / un poco","ex":"A few smart steps and a little patience build savings."},{"w":"enough / too","es":"suficiente / demasiado","ex":"The card was too new to have so many problems."},{"w":"comparatives","es":"comparativos (safer, cheaper)","ex":"A bank is safer than a mattress, and it pays interest."},{"w":"relative clauses (that / who)","es":"cláusulas relativas","ex":"The teller who helped her spoke slowly and clearly."},{"w":"when / while","es":"cuando / mientras","ex":"While he was paying, the machine rejected the card."},{"w":"really / quite / slightly","es":"realmente / bastante / ligeramente","ex":"The fee was quite small but really annoying."},{"w":"a piece of / a kilo of","es":"partitivos (un pedazo de…)","ex":"A piece of advice: write every sol in the chart."},{"w":"advise","es":"aconsejar","ex":"The teller advised her calmly, without hurry."},{"w":"arrange","es":"acordar / organizar","ex":"They arranged a visit to the main office."},{"w":"assess","es":"evaluar","ex":"The bank assessed the case in three working days."},{"w":"assume","es":"suponer","ex":"Never assume; always verify the date and the amount."},{"w":"authority","es":"autoridad (del consumidor)","ex":"The consumer authority exists for cases that banks ignore."},{"w":"average","es":"promedio","ex":"Her average spending fell after one month of charts."},{"w":"pattern","es":"patrón","ex":"The chart showed a clear pattern: tiny daily charges."},{"w":"ratio","es":"proporción","ex":"Her ratio was simple: half needs, thirty savings, twenty joy."},{"w":"purpose","es":"propósito","ex":"Money without a purpose disappears quickly and quietly."},{"w":"warn","es":"advertir","ex":"The bank warned him by message about strange activity."},{"w":"prove","es":"probar / demostrar","ex":"The receipt proved that the payment was hers."},{"w":"set in stone","es":"grabado en piedra (fijo)","ex":"No fee is set in stone if you ask politely."}];
/* Cada oración alineada EN↔ES (para resaltado por oración en ambos idiomas) */
const STORYDATA = {"1":{"sTitle":"Sofía's First Bank Account","sTitleEs":"La primera cuenta bancaria de Sofía","dTitle":"Opening a New Account","dTitleEs":"Abriendo una cuenta nueva","paras":[[["Sofía is a young nurse who works at the hospital in the north.","Sofía es una enfermera joven que trabaja en el hospital del norte."],["Until two months ago, she kept her money inside an old cookie tin.","Hasta hace dos meses, guardaba su dinero dentro de una vieja lata de galletas."],["The tin lived under her bed, behind a pair of winter shoes.","La lata vivía bajo su cama, detrás de un par de zapatos de invierno."],["It was a system her grandmother built and defended with iron conviction.","Era un sistema que su abuela construyó y defendía con convicción de hierro."],["\"Banks are for people with suits,\" the old lady used to declare.","«Los bancos son para gente de terno», solía declarar la señora."]],[["The problem arrived quietly, as most money problems do.","El problema llegó en silencio, como llegan casi todos los problemas de dinero."],["Sofía was saving for a nursing course that costs real money.","Sofía estaba ahorrando para un curso de enfermería que cuesta dinero de verdad."],["Counting coins in a tin is slower than watching plants grow.","Contar monedas en una lata es más lento que ver crecer las plantas."],["Money under the mattress is savings that sleep badly, her cousin warned.","El dinero bajo el colchón es un ahorro que duerme mal, le advirtió su primo."],["In addition, the tin paid neither interest nor respect.","Además, la lata no pagaba ni intereses ni respeto."]],[["So one Tuesday, Sofía walked into the bank near the park.","Así que un martes, Sofía entró al banco cerca del parque."],["She took a number, sat down, and breathed deeply, slightly nervous.","Sacó un número, se sentó y respiró hondo, ligeramente nerviosa."],["The teller who received her was a friendly woman named Paty.","La cajera que la recibió era una mujer amable llamada Paty."],["\"First account?\" asked Paty. \"Welcome. Let's make this pretty simple.\"","«¿Primera cuenta?», preguntó Paty. «Bienvenida. Hagamos esto bastante simple»."],["Good service, like good medicine, starts with a calm voice.","El buen servicio, como la buena medicina, empieza con una voz tranquila."]],[["The bank offered a range of accounts, from basic to complex.","El banco ofrecía una gama de cuentas, de básicas a complejas."],["Paty explained the differences slowly, with examples instead of strange terms.","Paty explicó las diferencias despacio, con ejemplos en vez de términos raros."],["\"This one charges a monthly fee; that one charges nothing.\"","«Esta cobra una comisión mensual; esa no cobra nada»."],["Sofía chose the account that charges no maintenance fee.","Sofía eligió la cuenta que no cobra comisión de mantenimiento."],["Simpler is usually safer when you are starting out.","Lo más simple suele ser lo más seguro cuando estás empezando."]],[["The paperwork asked for basic things: her ID, one bill, one signature.","Los papeles pedían cosas básicas: su DNI, un recibo, una firma."],["Paty photographed her face and checked the photo against her ID.","Paty fotografió su rostro y comparó la foto con su DNI."],["\"The tiny mole above your eyebrow — perfect, it matches. You are you.\"","«El lunarcito sobre tu ceja — perfecto, coincide. Eres tú»."],["Sofía laughed: \"My nose agrees, and my nose never lies.\"","Sofía rió: «Mi nariz está de acuerdo, y mi nariz nunca miente»."],["Verification felt strange, but it also felt like protection.","La verificación se sintió rara, pero también se sintió como protección."]],[["Before leaving, Paty gave her a piece of advice, free of charge.","Antes de irse, Paty le dio un consejo, sin costo alguno."],["\"Read the terms tonight. Ten minutes. Mark what you don't understand.\"","«Lee los términos esta noche. Diez minutos. Marca lo que no entiendas»."],["\"Then call me, and I will explain it in human language.\"","«Luego llámame, y te lo explico en idioma humano»."],["Sofía read them while she was drinking her evening tea.","Sofía los leyó mientras tomaba su té de la noche."],["She marked two points and understood the rest surprisingly well.","Marcó dos puntos y entendió el resto sorprendentemente bien."]],[["The first transfer felt like magic, honestly: salary, message, done.","La primera transferencia se sintió como magia, honestamente: sueldo, mensaje, listo."],["No lines, no tin, no coins rolling under the bed.","Sin colas, sin lata, sin monedas rodando bajo la cama."],["A transfer arrives faster than a bus with no traffic.","Una transferencia llega más rápido que un bus sin tráfico."],["Her savings, at last, began to grow in a safe place.","Sus ahorros, por fin, empezaron a crecer en un lugar seguro."],["The app drew a small chart, and the chart pointed up.","La aplicación dibujó un pequeño gráfico, y el gráfico apuntaba hacia arriba."]],[["Last Sunday, Sofía went to her grandmother's house and told her everything.","El domingo pasado, Sofía fue a la casa de su abuela y le contó todo."],["The old lady listened, suspicious, holding her teacup like a shield.","La señora escuchó, desconfiada, sosteniendo su taza como un escudo."],["\"And if the bank loses your money?\" — \"The law protects it, grandma.\"","«¿Y si el banco pierde tu plata?» — «La ley la protege, abuela»."],["\"Hmm. And the cookie tin?\" — \"Now it holds cookies. A modern concept.\"","«Mmm. ¿Y la lata de galletas?» — «Ahora guarda galletas. Un concepto moderno»."],["Grandma laughed so hard that she almost accepted the century.","La abuela se rió tan fuerte que casi aceptó el siglo."]]],"datos":["Cláusula relativa con <b>who</b>: <span class=\"frase\">a nurse who works at the hospital.</span>","Comparativo: <span class=\"frase\">slower than watching plants grow</span> · <b>neither… nor…</b> = ni… ni…",null,"Relativa con <b>that</b>: <span class=\"frase\">the account that charges no maintenance fee.</span> · Comparativo corto: <b>simpler · safer</b>.",null,"Partitivo: <b>a piece of advice</b> = un consejo. · <b>while</b> + pasado continuo: <span class=\"frase\">while she was drinking her tea.</span>","Artículo cero: <b>money, savings, salary</b> van sin \"the\" cuando hablamos en general.",null],"dlg":[["Marcos","Good morning. I would like to open a savings account.","Buenos días. Quisiera abrir una cuenta de ahorros."],["Paty","Good morning! Of course. Have you been a client with us before?","¡Buenos días! Claro. ¿Ha sido cliente con nosotros antes?"],["Marcos","Never. My money and I are new at this.","Nunca. Mi dinero y yo somos nuevos en esto."],["Paty","Then let me explain the options quickly and clearly.","Entonces déjeme explicarle las opciones rápida y claramente."],["Marcos","Please. And slowly — my cousin warned me about the strange terms.","Por favor. Y despacio — mi prima me advirtió sobre los términos raros."],["Paty","Ha! Fair. Basic account: no monthly fee, one free withdrawal per week.","¡Ja! Justo. Cuenta básica: sin comisión mensual, un retiro gratis por semana."],["Marcos","And if I need more withdrawals than that?","¿Y si necesito más retiros que eso?"],["Paty","Each extra one costs two soles. The app transfers are free.","Cada extra cuesta dos soles. Las transferencias por app son gratis."],["Marcos","Free is my favorite price. What about the other account?","Gratis es mi precio favorito. ¿Y la otra cuenta?"],["Paty","The \"plus\" pays better interest, but it requires a higher balance.","La «plus» paga mejor interés, pero exige un saldo más alto."],["Marcos","How much higher are we talking about?","¿Qué tan alto estamos hablando?"],["Paty","One thousand soles minimum, every day of the month.","Mil soles de mínimo, todos los días del mes."],["Marcos","Oh. My savings are brave, but they are not there yet.","Oh. Mis ahorros son valientes, pero todavía no llegan ahí."],["Paty","Then I advise the basic one; it suits you better for now.","Entonces le aconsejo la básica; le conviene más por ahora."],["Marcos","Agreed. What documents do you need from me?","De acuerdo. ¿Qué documentos necesita de mí?"],["Paty","Your ID and one utility bill with your address.","Su DNI y un recibo de servicios con su dirección."],["Marcos","I have the ID… and the bill is on my phone. Does that work?","Tengo el DNI… y el recibo está en mi teléfono. ¿Sirve?"],["Paty","Digital works perfectly. We are modern people here.","Digital funciona perfecto. Aquí somos gente moderna."],["Marcos","One more question, concerning the card. When does it arrive?","Una pregunta más, respecto a la tarjeta. ¿Cuándo llega?"],["Paty","Today. You leave with the card and the app connected.","Hoy. Se va con la tarjeta y la app conectada."],["Marcos","Today?! I assumed this took weeks of mysterious processes.","¡¿Hoy?! Supuse que esto tomaba semanas de procesos misteriosos."],["Paty","Ten years ago, maybe. Sign here, and here, and done.","Hace diez años, quizás. Firme aquí, y aquí, y listo."],["Marcos","That was easier than parking outside this bank.","Eso fue más fácil que estacionar afuera de este banco."],["Paty","Everything is easier than parking outside this bank.","Todo es más fácil que estacionar afuera de este banco."],["Marcos","Thank you, Paty. My tin retires today, after long service.","Gracias, Paty. Mi lata se jubila hoy, tras un largo servicio."],["Paty","Give it a warm goodbye. Welcome to the bank, Marcos.","Dele una despedida cálida. Bienvenido al banco, Marcos."]]},"2":{"sTitle":"The Strange Charge","sTitleEs":"El cargo extraño","dTitle":"A Strange Charge","dTitleEs":"Un cargo extraño","paras":[[["It was late on a quiet Sunday night, with fresh coffee in the air.","Era tarde, un domingo tranquilo por la noche, con café fresco en el aire."],["Sofía was checking her statement when she saw the strange line.","Sofía estaba revisando su estado de cuenta cuando vio la línea extraña."],["\"StreamBox Monthly — 29.90\" — a service she had never heard of.","«StreamBox Monthly — 29.90» — un servicio del que nunca había oído."],["She read it twice, then a third time, slowly and carefully.","Lo leyó dos veces, luego una tercera, lenta y cuidadosamente."],["The coffee suddenly tasted slightly less sweet than before.","El café de pronto supo ligeramente menos dulce que antes."]],[["Her first idea was simple: \"I must have pressed something by mistake.\"","Su primera idea fue simple: «Debo de haber apretado algo por error»."],["But the date told a different story: the charge appeared last Tuesday.","Pero la fecha contaba otra historia: el cargo apareció el martes pasado."],["On Tuesday she was working a twelve-hour shift at the hospital.","El martes ella estaba trabajando un turno de doce horas en el hospital."],["While she was taking temperatures, somebody was taking her money.","Mientras ella tomaba temperaturas, alguien tomaba su dinero."],["That thought was quite enough to wake her up completely.","Ese pensamiento fue más que suficiente para despertarla por completo."]],[["Never assume; always verify the date and the amount first.","Nunca supongas; siempre verifica primero la fecha y el monto."],["Sofía took a screenshot and wrote the details in her notebook.","Sofía tomó una captura y escribió los detalles en su cuaderno."],["Amount, date, service name, and the context: where she was that day.","Monto, fecha, nombre del servicio y el contexto: dónde estaba ella ese día."],["The hospital schedule, printed and signed, could prove where she was.","El horario del hospital, impreso y firmado, podía probar dónde estaba."],["Evidence first, emotions later: the order matters enormously.","Primero la evidencia, después las emociones: el orden importa muchísimo."]],[["On Monday, she called the bank before her shift started.","El lunes, llamó al banco antes de que empezara su turno."],["\"I want to dispute a charge that I never made,\" she said calmly.","«Quiero disputar un cargo que nunca hice», dijo con calma."],["The agent asked questions; Sofía answered with dates, not with drama.","La agente hizo preguntas; Sofía respondió con fechas, no con drama."],["\"Was your card with you the whole day?\" — \"Yes, in my locker.\"","«¿Su tarjeta estuvo con usted todo el día?» — «Sí, en mi casillero»."],["\"Perfect. We are opening a dispute and blocking that merchant.\"","«Perfecto. Estamos abriendo una disputa y bloqueando a ese comercio»."]],[["The bank assessed the case in three working days, faster than expected.","El banco evaluó el caso en tres días hábiles, más rápido de lo esperado."],["Meanwhile, Sofía herself changed every password, without one exception.","Mientras tanto, la propia Sofía cambió cada contraseña, sin una sola excepción."],["She also activated alerts: any card activity now rings her phone immediately.","También activó alertas: ahora cualquier actividad de la tarjeta suena en su teléfono de inmediato."],["\"An alert is a tiny guard who never sleeps,\" she told Marcos.","«Una alerta es un guardián pequeñito que nunca duerme», le dijo a Marcos."],["Marcos activated his alerts that same night, deeply impressed.","Marcos activó sus alertas esa misma noche, profundamente impresionado."]],[["The answer arrived on Thursday, in a short and beautiful message.","La respuesta llegó el jueves, en un mensaje corto y hermoso."],["\"Dispute approved. The amount returns to your account in 48 hours.\"","«Disputa aprobada. El monto vuelve a su cuenta en 48 horas»."],["The company that charged her was a subscription trap, already reported.","La empresa que le cobró era una trampa de suscripción, ya reportada."],["Somebody had tested stolen card numbers, hers among many others.","Alguien había probado números de tarjeta robados, el suyo entre muchos otros."],["Her quick report, said the bank, protected other clients too.","Su reporte rápido, dijo el banco, protegió también a otros clientes."]],[["That Friday, Sofía taught a tiny class in the hospital cafeteria.","Ese viernes, Sofía dio una clasecita en la cafetería del hospital."],["Three nurses, two coffees each, one phone showing the alerts menu.","Tres enfermeras, dos cafés cada una, un teléfono mostrando el menú de alertas."],["\"Check your statement weekly. Five minutes. It is cheaper than a scare.\"","«Revisen su estado de cuenta cada semana. Cinco minutos. Es más barato que un susto»."],["\"And if a charge looks strange, dispute it quickly and politely.\"","«Y si un cargo se ve extraño, dispútenlo rápida y cortésmente»."],["By Monday, the whole floor had alerts singing in their pockets.","Para el lunes, todo el piso tenía alertas cantando en los bolsillos."]],[["The strange charge, in the end, left something valuable behind.","El cargo extraño, al final, dejó algo valioso."],["Sofía now reads her statement like a doctor reads an X-ray.","Sofía ahora lee su estado de cuenta como un doctor lee una radiografía."],["Calmly, completely, and with a pen that underlines the suspicious parts.","Con calma, completo, y con un lapicero que subraya las partes sospechosas."],["Money, like health, prefers prevention over emergency rooms.","El dinero, como la salud, prefiere la prevención a la sala de emergencias."],["And her coffee, by the way, tastes perfectly sweet again.","Y su café, por cierto, vuelve a saber perfectamente dulce."]]],"datos":["Pasado continuo + simple: <span class=\"frase\">She was checking her statement when she saw the line.</span>","<b>While</b> + dos acciones paralelas: <span class=\"frase\">While she was taking temperatures, somebody was taking her money.</span>","Mitigadores e intensificadores: <b>slightly</b> (ligeramente) · <b>quite</b> (bastante) · <b>enormously</b> (muchísimo).","Relativa: <span class=\"frase\">a charge that I never made</span> · <span class=\"frase\">the company that charged her.</span>",null,null,"Comparativo: <span class=\"frase\">cheaper than a scare</span> · Adverbios de modo: <b>quickly and politely</b>.",null],"dlg":[["Marcos","Sofía, can I ask you something concerning my bill?","Sofía, ¿puedo preguntarte algo respecto a mi factura?"],["Sofía","Of course. You have your statement open? Good first step.","Claro. ¿Tienes tu estado de cuenta abierto? Buen primer paso."],["Marcos","There is a charge here that I don't recognize. Nine soles.","Hay un cargo aquí que no reconozco. Nueve soles."],["Sofía","Nine soles. Small. That is exactly how they test cards.","Nueve soles. Pequeño. Así es exactamente como prueban las tarjetas."],["Marcos","Test? What do you mean, test?","¿Prueban? ¿Cómo que prueban?"],["Sofía","Thieves try a tiny charge first. If nobody notices, they go bigger.","Los ladrones prueban un cargo pequeñito primero. Si nadie lo nota, van por más."],["Marcos","Oh no. And I almost ignored it because it was small.","Oh no. Y casi lo ignoro porque era pequeño."],["Sofía","It is common. Small charges hide better than big ones.","Es común. Los cargos chicos se esconden mejor que los grandes."],["Marcos","Okay. What is the plan, teacher?","Bueno. ¿Cuál es el plan, profesora?"],["Sofía","First: when exactly did the charge appear? Find the date.","Primero: ¿cuándo apareció exactamente el cargo? Busca la fecha."],["Marcos","It says… last Wednesday, at 3:14 in the morning.","Dice… el miércoles pasado, a las 3:14 de la madrugada."],["Sofía","And what were you doing at 3:14 in the morning?","¿Y qué estabas haciendo tú a las 3:14 de la madrugada?"],["Marcos","Sleeping deeply, like a stone. Like an honest stone.","Durmiendo profundo, como una piedra. Como una piedra honesta."],["Sofía","Perfect answer. Screenshot the charge and write that down.","Respuesta perfecta. Captura el cargo y anota eso."],["Marcos","Done. Now I call the bank, right?","Listo. ¿Ahora llamo al banco, no?"],["Sofía","Now you call the bank. Ask to dispute the charge.","Ahora llamas al banco. Pide disputar el cargo."],["Marcos","What if they say it is my responsibility?","¿Y si dicen que es mi responsabilidad?"],["Sofía","A charge at 3:14 while you slept? The pattern proves it wasn't you.","¿Un cargo a las 3:14 mientras dormías? El patrón prueba que no fuiste tú."],["Marcos","And if the agent doesn't listen to reason?","¿Y si el agente no escucha razones?"],["Sofía","Then ask for a supervisor, politely, and mention the consumer authority.","Entonces pides un supervisor, con cortesía, y mencionas la autoridad del consumidor."],["Marcos","The consumer authority. That sounds pleasantly powerful.","La autoridad del consumidor. Suena agradablemente poderoso."],["Sofía","It exists for the cases that banks ignore. Ours will not need it.","Existe para los casos que los bancos ignoran. El nuestro no la necesitará."],["Marcos","Calling now… they answered! Wish me luck.","Llamando ya… ¡contestaron! Deséame suerte."],["Sofía","You don't need luck. You need dates, and you have them.","No necesitas suerte. Necesitas fechas, y las tienes."],["Marcos","They opened the dispute! Refund in five days, they said.","¡Abrieron la disputa! Reembolso en cinco días, dijeron."],["Sofía","See? Five minutes of attention saved you months of charges.","¿Ves? Cinco minutos de atención te ahorraron meses de cargos."],["Marcos","New rule: I read my statement every Sunday, with coffee.","Nueva regla: leo mi estado de cuenta cada domingo, con café."],["Sofía","Welcome to the club. We meet every Sunday, everywhere.","Bienvenido al club. Nos reunimos cada domingo, en todas partes."]]},"3":{"sTitle":"A Month of Smart Saving","sTitleEs":"Un mes de ahorro inteligente","dTitle":"Planning the Monthly Budget","dTitleEs":"Planeando el presupuesto mensual","paras":[[["Marcos earns an average salary at the phone repair shop.","Marcos gana un sueldo promedio en el taller de reparación de teléfonos."],["He changes screens, saves photos, and revives batteries that look dead.","Cambia pantallas, salva fotos y revive baterías que parecen muertas."],["\"A lithium-ion battery is drama in a tiny box,\" he always says.","«Una batería de litio es drama en una cajita», dice siempre."],["He is good with volts and weak with soles — until this month.","Es bueno con los voltios y débil con los soles — hasta este mes."],["This month, Marcos declared a personal war on mystery spending.","Este mes, Marcos le declaró la guerra personal al gasto misterioso."]],[["The idea was born at the French café on the hill.","La idea nació en el café francés de la colina."],["He was paying for a coffee when the card said \"insufficient funds\".","Estaba pagando un café cuando la tarjeta dijo «fondos insuficientes»."],["Two days after payday. Two. The shame was fresh and educational.","Dos días después del día de pago. Dos. La vergüenza fue fresca y educativa."],["\"Where does my money go?\" he asked the receipt, uselessly.","«¿A dónde se va mi plata?», le preguntó al recibo, inútilmente."],["Receipts, like cats, hear the question and answer nothing.","Los recibos, como los gatos, oyen la pregunta y no responden nada."]],[["Sofía lent him her approach, a method which fits on one page.","Sofía le prestó su enfoque, un método que cabe en una página."],["Step one: for one week, write down absolutely every purchase.","Paso uno: por una semana, anota absolutamente cada compra."],["A bottle of water, a piece of cake, a pair of socks: everything.","Una botella de agua, un pedazo de torta, un par de medias: todo."],["Step two: organize the purchases in groups and study the pattern.","Paso dos: organiza las compras en grupos y estudia el patrón."],["Step three: decide, with cold blood, what stays and what goes.","Paso tres: decide, con sangre fría, qué se queda y qué se va."]],[["The week of writing was quietly devastating for Marcos's pride.","La semana de anotar fue silenciosamente devastadora para el orgullo de Marcos."],["The chart showed a clear pattern: tiny daily charges, an army of them.","El gráfico mostró un patrón claro: cargos pequeños diarios, un ejército de ellos."],["Delivery coffee almost every morning, though the shop makes free coffee.","Café por delivery casi cada mañana, aunque el taller prepara café gratis."],["Three streaming services, while he mostly watches only one.","Tres servicios de streaming, aunque casi siempre ve solo uno."],["\"The weight of small things,\" he wrote, \"is heavier than it looks.\"","«El peso de las cosas pequeñas», escribió, «es más pesado de lo que parece»."]],[["The new budget was simple, with a ratio he could remember.","El nuevo presupuesto fue simple, con una proporción que podía recordar."],["Half for needs, thirty for savings, twenty for joy — no guilt included.","La mitad para necesidades, treinta para ahorro, veinte para alegría — sin culpa incluida."],["Joy matters: a budget without joy dies faster than a diet.","La alegría importa: un presupuesto sin alegría muere más rápido que una dieta."],["He cancelled two streaming services and kept the one he really watches.","Canceló dos servicios de streaming y se quedó con el que de verdad ve."],["The delivery coffee became a Friday prize, not a daily habit.","El café por delivery se volvió un premio de viernes, no un hábito diario."]],[["Some changes required creativity rather than sacrifice, happily.","Algunos cambios pidieron creatividad más que sacrificio, felizmente."],["He walks to work now, downhill in the morning, uphill after.","Ahora camina al trabajo, bajada en la mañana, subida después."],["The walk is free, the view is good, and his doctor approves.","La caminata es gratis, la vista es buena y su doctor aprueba."],["He cooks on Sundays: a pot of rice, a pan of chicken, five lunches.","Cocina los domingos: una olla de arroz, una sartén de pollo, cinco almuerzos."],["Market produce costs a fraction of street food, and it tastes like home.","Los productos del mercado cuestan una fracción de la comida de la calle, y saben a hogar."]],[["At the end of the month, Marcos sat down and counted, nervously.","Al final del mes, Marcos se sentó y contó, nervioso."],["The savings account showed a number that made him laugh out loud.","La cuenta de ahorros mostró un número que lo hizo reír fuerte."],["Three hundred and forty soles saved, without feeling truly poor once.","Trescientos cuarenta soles ahorrados, sin sentirse realmente pobre ni una vez."],["\"The money was always there,\" he told Sofía, \"hiding in plain sight.\"","«La plata siempre estuvo ahí», le dijo a Sofía, «escondida a plena vista»."],["\"Budgets don't create money; they reveal it,\" she answered, professionally.","«Los presupuestos no crean dinero; lo revelan», respondió ella, profesionalmente."]],[["Nothing about the plan is set in stone, and that is the point.","Nada del plan está grabado en piedra, y ese es el punto."],["Some months will be harder; the plan itself will bend without breaking.","Algunos meses serán más duros; el plan mismo se doblará sin romperse."],["The purpose is not perfection, but direction — knowing where money goes.","El propósito no es la perfección, sino la dirección — saber a dónde va el dinero."],["Marcos still loves the French café on the hill, by the way.","A Marcos todavía le encanta el café francés de la colina, por cierto."],["He goes on Fridays now, pays in cash, and enjoys it twice as much.","Ahora va los viernes, paga en efectivo y lo disfruta el doble."]]],"datos":[null,"Continuo interrumpido: <span class=\"frase\">He was paying for a coffee when the card said…</span>","Partitivos: <b>a bottle of</b> water · <b>a piece of</b> cake · <b>a pair of</b> socks · <b>a pot of</b> rice.","<b>though / while</b> como contraste: <span class=\"frase\">though the shop makes free coffee · while he mostly watches only one.</span>","Comparativo: <span class=\"frase\">dies faster than a diet</span> · <b>rather than</b> = más que / en vez de.",null,null,"<b>set in stone</b> = grabado en piedra (inamovible). El propósito (<b>purpose</b>) es dirección, no perfección."],"dlg":[["Sofía","Sit down — ready for the monthly meeting of the Savings Club?","Siéntate — ¿listo para la reunión mensual del Club del Ahorro?"],["Marcos","Ready. I brought my chart, my coffee, and my dignity.","Listo. Traje mi gráfico, mi café y mi dignidad."],["Sofía","Only two of those are required. How did the month close?","Solo dos de esas se requieren. ¿Cómo cerró el mes?"],["Marcos","Three hundred and forty saved. I counted it twice, slowly.","Trescientos cuarenta ahorrados. Lo conté dos veces, despacio."],["Sofía","That is excellent for a first month. Truly.","Eso es excelente para un primer mes. De verdad."],["Marcos","The walking helped more than I expected, honestly.","Caminar ayudó más de lo que esperaba, honestamente."],["Sofía","And the streaming funeral? Any regrets?","¿Y el funeral del streaming? ¿Algún arrepentimiento?"],["Marcos","None. I don't miss what I never really watched.","Ninguno. No extraño lo que en realidad nunca veía."],["Sofía","Perfect. Now, next month has a trap: your niece's birthday.","Perfecto. Ahora, el próximo mes tiene una trampa: el cumpleaños de tu sobrina."],["Marcos","Oh no. The birthday. I forgot the birthday.","Oh no. El cumpleaños. Olvidé el cumpleaños."],["Sofía","Budgets never forget. That is their whole personality.","Los presupuestos nunca olvidan. Esa es toda su personalidad."],["Marcos","How much should I set apart for the gift?","¿Cuánto debería separar para el regalo?"],["Sofía","What did you spend last year? Do you remember?","¿Cuánto gastaste el año pasado? ¿Te acuerdas?"],["Marcos","Too much. I bought the doll AND the doll's house.","Demasiado. Compré la muñeca Y la casa de la muñeca."],["Sofía","Ha! Classic uncle behavior. This year, choose one.","¡Ja! Clásico comportamiento de tío. Este año, elige una."],["Marcos","The doll, then. The house was mostly for me anyway.","La muñeca, entonces. La casa era mayormente para mí, igual."],["Sofía","Put sixty in the \"joy\" envelope this week and forty the next.","Pon sesenta en el sobre de «alegría» esta semana y cuarenta la próxima."],["Marcos","So the birthday doesn't crash into the savings. I stick to the plan.","Para que el cumpleaños no choque contra el ahorro. Me pego al plan."],["Sofía","Exactly. Planned joy costs less than surprise joy.","Exacto. La alegría planeada cuesta menos que la alegría sorpresa."],["Marcos","You should print these phrases and sell them, seriously.","Deberías imprimir estas frases y venderlas, en serio."],["Sofía","I accept payment in rice. Speaking of which — Sunday cooking?","Acepto pagos en arroz. Hablando de eso — ¿cocina dominical?"],["Marcos","A pot of rice, a pan of chicken, five lunches. The system is mine now.","Una olla de arroz, una sartén de pollo, cinco almuerzos. El sistema ya es mío."],["Sofía","Then the club, whose office is this kitchen, declares the month a success.","Entonces el club, cuya oficina es esta cocina, declara el mes un éxito."],["Marcos","Same time next month? I will bring the new chart.","¿Misma hora el próximo mes? Yo traigo el gráfico nuevo."],["Sofía","And I will bring the trap list. February has three birthdays.","Y yo traigo la lista de trampas. Febrero tiene tres cumpleaños."],["Marcos","THREE?! Start the envelope today. Start it right now.","¡¿TRES?! Empieza el sobre hoy. Empiézalo ahora mismo."]]},"4":{"sTitle":"Marcos and the Frozen Card","sTitleEs":"Marcos y la tarjeta congelada","dTitle":"A Lost Card and a Blocked Account","dTitleEs":"Una tarjeta perdida y una cuenta bloqueada","paras":[[["It happened on a Friday, because these things always choose Fridays.","Pasó un viernes, porque estas cosas siempre eligen los viernes."],["Marcos was walking home through the park when he checked his pockets.","Marcos volvía a casa caminando por el parque cuando revisó sus bolsillos."],["Phone: present. Keys: present. Wallet: present. Card: absent.","Teléfono: presente. Llaves: presentes. Billetera: presente. Tarjeta: ausente."],["He searched himself twice, then the backpack, then his own disbelief.","Se revisó dos veces, luego la mochila, luego su propia incredulidad."],["The card was simply gone, lost somewhere between the shop and the trees.","La tarjeta simplemente no estaba, perdida entre el taller y los árboles."]],[["The old Marcos would have panicked colorfully, with full vocabulary.","El viejo Marcos habría entrado en pánico a todo color, con vocabulario completo."],["The new Marcos took a deep breath and opened the bank app.","El nuevo Marcos respiró hondo y abrió la app del banco."],["Two taps: \"Cards\" — \"Freeze card\". A snowflake icon appeared, satisfied.","Dos toques: «Tarjetas» — «Congelar tarjeta». Apareció un ícono de copo de nieve, satisfecho."],["Frozen meant nobody could use it, wherever it was lying.","Congelada significaba que nadie podía usarla, dondequiera que estuviera tirada."],["\"Freeze first, cry later,\" he repeated — Sofía's emergency rule.","«Congela primero, llora después», repitió — la regla de emergencia de Sofía."]],[["While he was freezing the card, the phone vibrated with a warning.","Mientras congelaba la tarjeta, el teléfono vibró con una advertencia."],["\"Attempted charge declined: 89.90 — electronics store, 6:12 p.m.\"","«Intento de cargo rechazado: 89.90 — tienda de electrónica, 6:12 p.m.»"],["Somebody had found the card and moved impressively quickly.","Alguien había encontrado la tarjeta y se había movido impresionantemente rápido."],["The freeze had beaten the thief by less than four minutes.","El congelado le había ganado al ladrón por menos de cuatro minutos."],["Four minutes: the distance between a bad Friday and a disaster.","Cuatro minutos: la distancia entre un mal viernes y un desastre."]],[["The app arranged a branch visit for Saturday morning.","La app organizó una visita a la agencia para el sábado por la mañana."],["He arrived early and explained the situation to the teller, step by step.","Llegó temprano y le explicó la situación al cajero, paso a paso."],["\"Card lost around six, frozen at 6:08, attempted charge at 6:12.\"","«Tarjeta perdida cerca de las seis, congelada a las 6:08, intento de cargo a las 6:12»."],["The teller raised his eyebrows, honestly impressed by the timeline.","El cajero levantó las cejas, honestamente impresionado por la línea de tiempo."],["\"Most people call us on Monday,\" he said. \"You froze it in minutes.\"","«La mayoría nos llama el lunes», dijo. «Usted la congeló en minutos»."]],[["Replacing the card required verification, naturally, and Marcos understood why.","Reponer la tarjeta requería verificación, naturalmente, y Marcos entendía por qué."],["ID, signature, two questions that only the real Marcos could answer.","DNI, firma, dos preguntas que solo el verdadero Marcos podía responder."],["\"Your last three purchases?\" — \"Rice, chicken, and screen protectors. Exciting life.\"","«¿Sus últimas tres compras?» — «Arroz, pollo y micas de pantalla. Vida emocionante»."],["The manager approved the replacement with a friendly, efficient nod.","La gerente aprobó la reposición con un gesto amable y eficiente."],["\"Verification protects your money, even when it feels slow,\" she explained.","«La verificación protege su dinero, incluso cuando se siente lenta», explicó."]],[["The new card arrived at the branch the following Wednesday.","La tarjeta nueva llegó a la agencia el miércoles siguiente."],["Different number, same account: the money never moved an inch.","Número distinto, misma cuenta: el dinero nunca se movió ni un centímetro."],["Marcos updated the number in exactly two services — the ones he pays.","Marcos actualizó el número en exactamente dos servicios — los que sí paga."],["\"A short list of subscriptions saves you work on bad Fridays,\" he noted.","«Una lista corta de suscripciones te ahorra trabajo en los viernes malos», anotó."],["The budget, unexpectedly, had also become a security system.","El presupuesto, inesperadamente, también se había vuelto un sistema de seguridad."]],[["The old card appeared eleven days later, in the least dramatic place.","La tarjeta vieja apareció once días después, en el lugar menos dramático."],["It lay under a stone bench until a park gardener found it, wet but whole.","Estuvo tirada bajo una banca de piedra hasta que un jardinero del parque la encontró, mojada pero entera."],["He delivered it to the bank, which called Marcos to inform him.","La entregó al banco, que llamó a Marcos para informarle."],["\"Destroy it, please,\" said Marcos. \"That card and I need closure.\"","«Destrúyanla, por favor», dijo Marcos. «Esa tarjeta y yo necesitamos un cierre»."],["The teller laughed and cut it in half, ceremoniously, over the bin.","El cajero se rió y la cortó por la mitad, ceremoniosamente, sobre el tacho."]],[["That Sunday, the Savings Club analyzed the case over coffee.","Ese domingo, el Club del Ahorro analizó el caso con café."],["\"What saved you?\" asked Sofía, though she knew the answer.","«¿Qué te salvó?», preguntó Sofía, aunque sabía la respuesta."],["\"Speed, the app, and your rule: freeze first, cry later.\"","«La velocidad, la app y tu regla: congela primero, llora después»."],["\"And what did it cost you?\" — \"Four days without a card. And zero soles.\"","«¿Y qué te costó?» — «Cuatro días sin tarjeta. Y cero soles»."],["Some emergencies, handled quickly, become nothing but good stories.","Algunas emergencias, atendidas rápido, se vuelven solo buenas historias."]]],"datos":["Continuo + simple: <span class=\"frase\">He was walking home when he checked his pockets.</span>",null,"<b>While</b> + continuo: <span class=\"frase\">While he was freezing the card, the phone vibrated.</span>",null,"Reflexivos: <b>himself</b> (se revisó a sí mismo) · La gerente = <b>herself</b> si actúa ella misma.",null,null,"Adverbios de modo al final: <span class=\"frase\">handled quickly · cut it ceremoniously.</span>"],"dlg":[["Marcos","Good morning. I lost my card yesterday, and I froze it in the app.","Buenos días. Ayer perdí mi tarjeta, y la congelé en la app."],["Cajero","Good morning! Perfect first move. Can I see your ID, please?","¡Buenos días! Primer paso perfecto. ¿Me permite su DNI, por favor?"],["Marcos","Here it is. There was also an attempted charge, by the way.","Aquí está. También hubo un intento de cargo, por cierto."],["Cajero","I can see it: 89.90, declined at 6:12. The freeze worked.","Lo veo: 89.90, rechazado a las 6:12. El congelado funcionó."],["Marcos","Four minutes before the thief. My best race this year.","Cuatro minutos antes que el ladrón. Mi mejor carrera del año."],["Cajero","Ha! Now, for the replacement I need to verify some things.","¡Ja! Ahora, para la reposición necesito verificar algunas cosas."],["Marcos","Go ahead. Ask me anything. My life is an open receipt.","Adelante. Pregúnteme lo que sea. Mi vida es un recibo abierto."],["Cajero","Date of your last withdrawal, more or less?","¿Fecha de su último retiro, más o menos?"],["Marcos","Last Friday, one hundred soles, for the market and the bus.","El viernes pasado, cien soles, para el mercado y el bus."],["Cajero","Correct. And the account was opened… where and when?","Correcto. ¿Y la cuenta fue abierta… dónde y cuándo?"],["Marcos","This same branch, three months ago, with Paty. She was very patient.","En esta misma agencia, hace tres meses, con Paty. Fue muy paciente."],["Cajero","Everything matches. One moment — I need the manager's approval for the reissue.","Todo coincide. Un momento — necesito la aprobación de la gerente para la reposición."],["Gerente","Good morning. I heard somebody beat a thief by four minutes.","Buenos días. Escuché que alguien le ganó a un ladrón por cuatro minutos."],["Marcos","Good morning! The app did the running, honestly.","¡Buenos días! La app hizo la carrera, honestamente."],["Gerente","Modesty noted. Your file looks clean, and the timeline is clear.","Modestia anotada. Su expediente se ve limpio, y la línea de tiempo es clara."],["Gerente","I am approving the replacement now. It arrives on Wednesday.","Apruebo la reposición ahora. Llega el miércoles."],["Marcos","Wednesday works. Should I do anything concerning my subscriptions?","El miércoles me sirve. ¿Debo hacer algo respecto a mis suscripciones?"],["Gerente","Good question. Update the new number only in services you trust.","Buena pregunta. Actualice el número nuevo solo en servicios de confianza."],["Marcos","I have exactly two, thanks to a very strict budget.","Tengo exactamente dos, gracias a un presupuesto muy estricto."],["Gerente","Two! Most people have nine and remember five.","¡Dos! La mayoría tiene nueve y recuerda cinco."],["Cajero","Here is your temporary number for the app, meanwhile.","Aquí tiene su número temporal para la app, mientras tanto."],["Marcos","So I can still pay my bills while I wait?","¿Así puedo seguir pagando mis recibos mientras espero?"],["Cajero","Exactly. The app allows transfers normally; only the plastic is frozen.","Exacto. La app permite transferencias normal; solo el plástico está congelado."],["Gerente","One last thing: if the old card appears, bring it to us.","Una última cosa: si la tarjeta vieja aparece, tráigala."],["Marcos","If it appears, we will have a short, cold conversation.","Si aparece, tendremos una conversación corta y fría."],["Gerente","Ha! Understandable. Anything else we can do for you?","¡Ja! Comprensible. ¿Algo más que podamos hacer por usted?"],["Marcos","Teach my cousin's building your four-minute story. They love claims.","Enséñenle al edificio de mi prima su historia de cuatro minutos. Aman los reclamos."],["Cajero","Deal. Signature here, and you are done, sir.","Trato. Firma aquí, y listo, señor."],["Marcos","Thank you both. Fast, clear, and human. Rare combination.","Gracias a ambos. Rápido, claro y humano. Combinación rara."],["Gerente","We try. Take care of that new card, Marcos.","Lo intentamos. Cuide esa tarjeta nueva, Marcos."]]}};

function pickVoice(){ try{ const vs=speechSynthesis.getVoices()||[]; const gb=(typeof voice!=='undefined'&&(voice==='UK'||voice==='GB')); const want=gb?'en-gb':'en-us'; const pref= gb?['Google UK English Female','Google UK English Male','Microsoft Sonia','Microsoft Libby','Microsoft Maisie','Microsoft Ryan','Microsoft Thomas','Daniel','Kate','Serena','Arthur','Martha']:['Google US English','Microsoft Aria','Microsoft Jenny','Microsoft Michelle','Microsoft Ana','Microsoft Emma','Microsoft Andrew','Samantha','Alex','Allison','Ava','Fred']; const en=vs.filter(v=>v.lang&&v.lang.toLowerCase().indexOf('en')===0); const exact=en.filter(v=>v.lang.replace('_','-').toLowerCase()===want); for(const p of pref){ const hit=exact.find(v=>v.name&&v.name.indexOf(p)===0); if(hit) return hit; } if(exact.length) return exact[0]; for(const p of pref){ const hit=en.find(v=>v.name&&v.name.indexOf(p)===0); if(hit) return hit; } return en[0]||null; }catch(e){ return null; } }

<script>
(function(){
  var FX={i:0,playing:false,sents:[],cfg:null};
  try{ FX.cfg=JSON.parse(localStorage.getItem("jucum_focus_cfg")||"null"); }catch(e){}
  FX.cfg=FX.cfg||{accent:"US",rate:0.9,text:"both"};
  function $g(id){return document.getElementById(id);}
  window.openFocus=function(){
    try{ if(!PARAS||!PARAS.length) return; }catch(e){ return; }
    FX.sents=[]; PARAS.forEach(function(p){ (p.pairs||[]).forEach(function(q){ FX.sents.push({en:q.en,es:q.es}); }); });
    try{ pausePlay(); }catch(e){}
    try{ $g("fxov").setAttribute("data-level", document.getElementById("screen").getAttribute("data-level")||"a2"); }catch(e){} $g("fxov").style.display="block"; fxShowSet();
  };
  function fxShowSet(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){}
    $g("fxset").style.display="block"; $g("fxread").style.display="none"; fxPaint(); }
  window.fxGear=function(){ fxShowSet(); };
  window.fxCfg=function(k,v){ FX.cfg[k]=v; try{localStorage.setItem("jucum_focus_cfg",JSON.stringify(FX.cfg));}catch(e){} fxPaint(); };
  function fxPaint(){ ["US","GB"].forEach(function(a){ $g("fxa"+a).classList.toggle("on",FX.cfg.accent===a); });
    [[0.75,"fxr075"],[0.9,"fxr09"],[1,"fxr1"],[1.15,"fxr115"]].forEach(function(p){ $g(p[1]).classList.toggle("on",FX.cfg.rate===p[0]); });
    $g("fxten").classList.toggle("on",FX.cfg.text==="en"); $g("fxtboth").classList.toggle("on",FX.cfg.text==="both"); }
  window.fxStart=function(){ FX.i=0; $g("fxset").style.display="none"; $g("fxread").style.display="flex"; FX.playing=true; fxRender(); fxSay(); };
  window.closeFocus=function(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} $g("fxov").style.display="none"; };
  function fxVoice(){ try{ var vs=speechSynthesis.getVoices()||[]; var gb=(FX.cfg.accent==="GB"||FX.cfg.accent==="UK"); var want=gb?"en-gb":"en-us";
    var pref= gb?["Google UK English Female","Google UK English Male","Microsoft Sonia","Microsoft Libby","Microsoft Ryan","Microsoft Thomas","Daniel","Kate","Serena"]:["Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Michelle","Microsoft Ana","Samantha","Alex"];
    var en=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf("en")===0;});
    var exact=en.filter(function(v){return v.lang.replace("_","-").toLowerCase()===want;});
    for(var i=0;i<pref.length;i++){ for(var j=0;j<exact.length;j++){ if(exact[j].name&&exact[j].name.indexOf(pref[i])===0) return exact[j]; } }
    if(exact.length) return exact[0];
    for(var i2=0;i2<pref.length;i2++){ for(var j2=0;j2<en.length;j2++){ if(en[j2].name&&en[j2].name.indexOf(pref[i2])===0) return en[j2]; } }
    return en[0]||null; }catch(e){ return null; } }
  function fxRender(){ var s=FX.sents[FX.i]||{en:"",es:""};
    $g("fxcnt").textContent="ORACIÓN "+(FX.i+1)+" DE "+FX.sents.length;
    $g("fxen").textContent=s.en; $g("fxes").textContent=s.es;
    $g("fxes").style.display=FX.cfg.text==="both"?"block":"none";
    $g("fxplay").textContent=FX.playing?"⏸":"▶";
    $g("fxbar").style.width=(FX.sents.length?Math.round((FX.i+1)/FX.sents.length*100):0)+"%"; }
  function fxSay(){ try{ speechSynthesis.cancel(); var s=FX.sents[FX.i]; if(!s) return;
    var u=new SpeechSynthesisUtterance(s.en); u.rate=FX.cfg.rate; var v=fxVoice(); if(v){u.voice=v;u.lang=v.lang;} else u.lang="en-US";
    u.onend=function(){ if(!FX.playing) return; if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); setTimeout(function(){ if(FX.playing) fxSay(); },420); } else { FX.playing=false; fxRender(); } };
    speechSynthesis.speak(u); }catch(e){}
  }
  window.fxToggle=function(){ if(FX.playing){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} } else { FX.playing=true; fxSay(); } fxRender(); };
  window.fxPrev=function(){ if(FX.i>0){ FX.i--; fxRender(); if(FX.playing) fxSay(); } };
  window.fxNext=function(){ if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); if(FX.playing) fxSay(); } };
})();
</script>
<script id="v5ajs">
(function(){
  function $g(id){return document.getElementById(id);}
  function KEY(){ return 'jec_heard_'+location.pathname+'_'+(typeof storyId!=='undefined'?storyId:0); }
  var cloudDone={};
  function heard(){ try{ return new Set(JSON.parse(localStorage.getItem(KEY())||'[]')); }catch(e){ return new Set(); } }
  function saveHeard(s){ try{ localStorage.setItem(KEY(), JSON.stringify(Array.from(s))); }catch(e){} }
  window.jecParaHeard=function(pi){ try{ var s=heard(); if(!s.has(pi)){ s.add(pi); saveHeard(s); } paintHeard(); ring(); }catch(e){} };
  function total(){ try{ return PARAS.length; }catch(e){ return 0; } }
  function ring(){ var el=$g('ring5'); if(!el) return; var t=total()||1; var n=heard().size; if(cloudDone[storyId]) n=t; var pct=Math.min(100,Math.round(n/t*100));
    $g('ring5T').textContent=pct+'%'; el.style.background='conic-gradient(#fff 0 '+pct+'%, rgba(255,255,255,.25) '+pct+'% 100%)'; }
  function paintHeard(){ try{ if(typeof curView!=='undefined'&&curView!=='story') return; var s=heard();
    document.querySelectorAll('#paras .para:not(.dlgrow)').forEach(function(p){ var pi=+p.id.slice(1); p.classList.toggle('heard5', s.has(pi)||!!cloudDone[storyId]);
    }); }catch(e){} }
  var _pick=window.pickStory; window.pickStory=function(n){ _pick(n);
    try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.setActivePart) JUCUM_CONNECT.setActivePart(Number(n)); }catch(e){}
    ring(); paintHeard(); };
  var _render=window.render; if(_render){ window.render=function(){ _render(); paintHeard(); ring(); }; }
  var _mark=window.markDone; window.markDone=function(){
    try{
      var t=total(); var n=cloudDone[storyId]?t:heard().size;
      if(n<t){ var falta=t-n; var es=(typeof info==='undefined')||info==='es';
        toast(es?('🎧 Escucha y lee TODA la historia antes de marcarla: te '+(falta>1?'faltan ':'falta ')+falta+' párrafo'+(falta>1?'s':'')+'. Usa ▶ en cada uno.')
               :('🎧 Listen to and read the WHOLE story first: '+falta+' paragraph'+(falta>1?'s':'')+' left. Use ▶ on each one.'));
        return; }
      cloudDone[storyId]=true;
      try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.savePart) JUCUM_CONNECT.savePart(Number(storyId),100,0); }catch(e){}
    }catch(e){}
    if(_mark) _mark();
  };
  (function seed(k){ var api=window.JUCUM_CONNECT;
    if(!api||!api.getCompletedParts){ if(k<20) setTimeout(function(){seed(k+1);},700); return; }
    api.getCompletedParts(function(parts){ try{ (parts||[]).forEach(function(x){ var n=Number(x.part); if(n) cloudDone[n]=true; }); ring(); paintHeard(); annotate(); }catch(e){} });
  })(0);
  function annotate(){ try{ var list=$g('spkList'); if(!list) return;
    Array.prototype.forEach.call(list.children,function(el,ix){ var n=ix+1; if(cloudDone[n]&&!el.querySelector('.cl5')){ var s=document.createElement('span'); s.className='cl5'; s.textContent=' ✓'; s.style.cssText='color:#1B5E20;font-weight:800;'; el.appendChild(s); } }); }catch(e){} }
  ring();
})();
</script>
