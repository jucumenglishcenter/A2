        .error-text { font-size:0.88rem; color:var(--error-dark); line-height:1.5; }

        .q-label { font-size:0.88rem; color:var(--text-medium); font-weight:600; }

        .sent-option.disabled { cursor:default; }
        .sent-option.correct { border-color:var(--success); background:var(--success-light); }
        .sent-option.incorrect { border-color:var(--error); background:var(--error-light); }
        .option-letter { width:26px; height:26px; border-radius:50%; background:var(--primary-light); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.8rem; flex-shrink:0; font-family:'Fredoka',sans-serif; }

        .option-status { font-size:1.1rem; flex-shrink:0; display:none; }
        .sent-option.disabled .option-status { display:block; }
        .error-highlight { color:var(--error); font-weight:800; text-decoration:underline wavy; }
        .correct-highlight { color:var(--success-dark); font-weight:800; }
    </style>

    <script>
    const quizData = [{"badge":"👩‍💼 La cajera","options":[{"text":"The teller who helped Sofía was very patient.","correct":true,"es":"La cajera que ayudó a Sofía fue muy paciente."},{"text":"The teller which helped Sofía was very patient.","correct":false,"es":"La cajera la cual ayudó a Sofía.","errorWord":"which","correctWord":"who","errorType":"Which con persona","explanation":"La cajera es persona: who (o that)."},{"text":"The teller who she helped Sofía was very patient.","correct":false,"es":"La cajera que ella ayudó a Sofía.","errorWord":"she","correctWord":"(nada)","errorType":"Pronombre repetido","explanation":"“Who” YA es el sujeto: no se repite con she."}],"clue":"persona → who","clueExplain":"WHO para personas · WHICH para cosas · THAT sirve para ambas · WHOSE = posesión. El relativo reemplaza al sujeto: no se repite (no “which it”).","correctReason":"“The teller who helped…”: persona con who, sin repetir sujeto.","hint":"¿La palabra descrita es persona o cosa? Y revisa que el relativo no venga con un pronombre repetido de contrabando."},{"badge":"📱 La app","options":[{"text":"The app which blocks the card is free.","correct":true,"es":"La aplicación que bloquea la tarjeta es gratis."},{"text":"The app who blocks the card is free.","correct":false,"es":"La aplicación quien bloquea la tarjeta.","errorWord":"who","correctWord":"which","errorType":"Who con cosa","explanation":"La app es cosa: which (o that)."},{"text":"The app which it blocks the card is free.","correct":false,"es":"La aplicación la cual ella bloquea.","errorWord":"it","correctWord":"(nada)","errorType":"Pronombre repetido","explanation":"“Which” ya es el sujeto: sin it."}],"clue":"cosa → which","clueExplain":"WHO para personas · WHICH para cosas · THAT sirve para ambas · WHOSE = posesión. El relativo reemplaza al sujeto: no se repite (no “which it”).","correctReason":"“The app which blocks…”: cosa con which.","hint":"¿La palabra descrita es persona o cosa? Y revisa que el relativo no venga con un pronombre repetido de contrabando."},{"badge":"🧾 El cargo","options":[{"text":"The charge that appeared twice was a mistake.","correct":true,"es":"El cargo que apareció dos veces era un error."},{"text":"The charge who appeared twice was a mistake.","correct":false,"es":"El cargo quien apareció dos veces.","errorWord":"who","correctWord":"that","errorType":"Who con cosa","explanation":"Un cargo es cosa: that o which."},{"text":"The charge that it appeared twice was a mistake.","correct":false,"es":"El cargo que él apareció dos veces.","errorWord":"it","correctWord":"(nada)","errorType":"Pronombre repetido","explanation":"“That” ya es el sujeto: sin it."}],"clue":"cosa → that/which","clueExplain":"WHO para personas · WHICH para cosas · THAT sirve para ambas · WHOSE = posesión. El relativo reemplaza al sujeto: no se repite (no “which it”).","correctReason":"“The charge that appeared…”: relativo correcto y sin repetición.","hint":"¿La palabra descrita es persona o cosa? Y revisa que el relativo no venga con un pronombre repetido de contrabando."},{"badge":"👨 El vecino","options":[{"text":"The neighbor whose card was cloned called the bank.","correct":true,"es":"El vecino cuya tarjeta fue clonada llamó al banco."},{"text":"The neighbor who's card was cloned called the bank.","correct":false,"es":"El vecino quien es tarjeta fue clonada.","errorWord":"who's","correctWord":"whose","errorType":"Who's ≠ whose","explanation":"“Who's” = who is; la posesión es WHOSE card."},{"text":"The neighbor which card was cloned called the bank.","correct":false,"es":"El vecino la cual tarjeta fue clonada.","errorWord":"which","correctWord":"whose","errorType":"Which por whose","explanation":"La posesión usa whose: whose card."}],"clue":"posesión → whose","clueExplain":"whose = “cuyo/cuya” · who’s = “who is”. Suenan igual; el apóstrofo delata al impostor.","correctReason":"“Whose card”: posesión con whose.","hint":"Uno de los dos “whose” esconde un verbo adentro."},{"badge":"🏦 La sucursal","options":[{"text":"The branch that opens early is downtown.","correct":true,"es":"La sucursal que abre temprano está en el centro."},{"text":"The branch who opens early is downtown.","correct":false,"es":"La sucursal quien abre temprano.","errorWord":"who","correctWord":"that","errorType":"Who con cosa","explanation":"Una sucursal es cosa: that/which."},{"text":"The branch that open early is downtown.","correct":false,"es":"La sucursal que abren temprano.","errorWord":"open","correctWord":"opens","errorType":"Concordancia interna","explanation":"“The branch” (it) pide opens."}],"clue":"cosa → that","clueExplain":"WHO para personas · WHICH para cosas · THAT sirve para ambas · WHOSE = posesión. El relativo reemplaza al sujeto: no se repite (no “which it”).","correctReason":"“That opens”: relativo y concordancia correctos.","hint":"¿La palabra descrita es persona o cosa? Y revisa que el relativo no venga con un pronombre repetido de contrabando."},{"badge":"👨‍💼 El agente","options":[{"text":"The agent who answered was new.","correct":true,"es":"El agente que contestó era nuevo."},{"text":"The agent which answered was new.","correct":false,"es":"El agente el cual contestó.","errorWord":"which","correctWord":"who","errorType":"Which con persona","explanation":"El agente es persona: who."},{"text":"The agent who he answered was new.","correct":false,"es":"El agente que él contestó.","errorWord":"he","correctWord":"(nada)","errorType":"Pronombre repetido","explanation":"“Who” ya es el sujeto: sin he."}],"clue":"persona → who","clueExplain":"WHO para personas · WHICH para cosas · THAT sirve para ambas · WHOSE = posesión. El relativo reemplaza al sujeto: no se repite (no “which it”).","correctReason":"“Who answered”: persona con who.","hint":"¿La palabra descrita es persona o cosa? Y revisa que el relativo no venga con un pronombre repetido de contrabando."},{"badge":"💳 La tarjeta","options":[{"text":"The card that expired last month still worked.","correct":true," t.","correct":false,"es":"Las alertas que llega por SMS.","errorWord":"arrives","correctWord":"arrive","errorType":"Concordancia interna","explanation":"“The alerts” es plural: arrive."},{"text":"The alerts who arrive by SMS are instant.","correct":false,"es":"Las alertas quienes llegan.","errorWord":"who","correctWord":"that","errorType":"Who con cosa","explanation":"Las alertas son cosas: that/which."}],"clue":"cosa → that + plural","clueExplain":"WHO para personas · WHICH para cosas · THAT sirve para ambas · WHOSE = posesión. El relativo reemplaza al sujeto: no se repite (no “which it”).","correctReason":"“That arrive”: relativo correcto y concordancia plural.","hint":"¿La palabra descrita es persona o cosa? Y revisa que el relativo no venga con un pronombre repetido de contrabando."},{"badge":"👦 El hijo","options":[{"text":"Her son, whose phone was stolen, filed a report.","correct":true,"es":"Su hijo, cuyo teléfono fue robado, hizo la denuncia."},{"text":"Her son, who's phone was stolen, filed a report.","correct":false,"es":"Su hijo, quien es teléfono fue robado.","errorWord":"who's","correctWord":"whose","errorType":"Who's ≠ whose","explanation":"La posesión es whose phone."},{"text":"Her son, that phone was stolen, filed a report.","correct":false,"es":"Su hijo, que teléfono fue robado.","errorWord":"that","correctWord":"whose","errorType":"That por whose","explanation":"La posesión usa whose: whose phone."}],"clue":"posesión → whose","clueExplain":"WHO para personas · WHICH para cosas · THAT sirve para ambas · WHOSE = posesión. El relativo reemplaza al sujeto: no se repite (no “which it”).","correctReason":"“Whose phone”: posesión correcta.","hint":"¿La palabra descrita es persona o cosa? Y revisa que el relativo no venga con un pronombre repetido de contrabando."},{"badge":"🏧 El cajero","options":[{"text":"The ATM that swallowed the card is outside.","correct":true,"es":"El cajero que se tragó la tarjeta está afuera."},{"text":"The ATM whose swallowed the card is outside.","correct":false,"es":"El cajero cuyo se tragó la tarjeta.","errorWord":"whose","correctWord":"that","errorType":"Whose sin posesión","explanation":"No hay posesión aquí: the ATM THAT swallowed."},{"text":"The ATM that swallowed the card are outside.","correct":false,"es":"El cajero que se tragó la tarjeta están afuera.","errorWord":"are","correctWord":"is","errorType":"Concordancia","explanation":"“The ATM” es singular: is."}],"clue":"cosa → that","clueExplain":"WHO para personas · WHICH para cosas · THAT sirve para ambas · WHOSE = posesión. El relativo reemplaza al sujeto: no se repite (no “which it”).","correctReason":"“That swallowed … is”: relativo y concordancia correctos.","hint":"¿La palabra descrita es persona o cosa? Y revisa que el relativo no venga con un pronombre repetido de contrabando."},{"badge":"👩‍💼 La gerente","options":[{"text":"The manager who signs the refunds is on leave.","correct":true,"es":"La gerente que firma los reembolsos está de permiso."},{"text":"The manager who sign the refunds is on leave.","correct":false,"es":"La gerente que firman los reembolsos.","errorWord":"sign","correctWord":"signs","errorType":"Concordancia interna","explanation":"“The manager” (she) pide signs."},{"text":"The manager which signs the refunds is on leave.","correct":false,"es":"La gerente la cual firma.","errorWord":"which","correctWord":"who","errorType":"Which con persona","explanation":"La gerente es persona: who."}],"clue":"persona → who + -s","clueExplain":"WHO para personas · WHICH para cosas · THAT sirve para ambas · WHOSE = posesión. El relativo reemplaza al sujeto: no se repite (no “which it”).","correctReason":"“Who signs”: persona con who y su -s.","hint":"¿La palabra descrita es persona o cosa? Y revisa que el relativo no venga con un pronombre repetido de contrabando."},{"badge":"🧾 El comprobante","options":[{"text":"The receipt that proves the payment is in the drawer.","correct":true,"es":"El comprobante que prueba el pago está en el cajón."},{"text":"The receipt that prove the payment is in the drawer.","correct":false,"es":"El comprobante que prueban el pago.","errorWord":"prove","correctWord":"proves","errorType":"Concordancia interna","explanation":"“The receipt” (it) pide proves."},{"text":"The receipt who proves the payment is in the drawer.","correct":false,"es":"El comprobante quien prueba el pago.","errorWord":"who","correctWord":"that","errorType":"Who con cosa","explanation":"El comprobante es cosa: that/which."}],"clue":"cosa → that + -s","clueExplain":"WHO para personas · WHICH para cosas · THAT sirve para ambas · WHOSE = posesión. El relativo reemplaza al sujeto: no se repite (no “which it”).","correctReason":"“That proves”: relativo y concordancia correctos.","hint":"¿La palabra descrita es persona o cosa? Y revisa que el relativo no venga con un pronombre repetido de contrabando."},{"badge":"👵 La señora","options":[{"text":"The lady who was waiting had three questions.","correct":true,"es":"La señora que esperaba tenía tres preguntas."},{"text":"The lady who were waiting had three questions.","correct":false,"es":"La señora que esperaban.","errorWord":"were","correctWord":"was","errorType":"Concordancia interna","explanation":"“The lady” (she) usa was."},{"text":"The lady which was waiting had three questions.","correct":false,"es":"La señora la cual esperaba.","errorWord":"which","correctWord":"who","errorType":"Which con persona","explanation":"La señora es persona: who."}],"clue":"persona → who + was","clueExplain":"WHO para personas · WHICH para cosas · THAT sirve para ambas · WHOSE = posesión. El relativo reemplaza al sujeto: no se repite (no “which it”).","correctReason":"“Who was waiting”: relativo y concordancia correctos.","hint":"¿La palabra descrita es persona o cosa? Y revisa que el relativo no venga con un pronombre repetido de contrabando."},{"badge":"💬 El mensaje","options":[{"text":"The message that confirmed the refund arrived late.","correct":true,"es":"El mensaje que confirmó el reembolso llegó tarde."},{"text":"The message that it confirmed the refund arrived late.","correct":false,"es":"El mensaje que él confirmó el reembolso.","errorWord":"it","correctWord":"(nada)","errorType":"Pronombre repetido","explanation":"“That” ya es el sujeto: sin it."},{"text":"The message who confirmed the refund arrived late.","correct":false,"es":"El mensaje quien confirmó.","errorWord":"who","correctWord":"that","errorType":"Who con cosa","explanation":"El mensaje es cosa: that/which."}],"clue":"cosa → that","clueExplain":"WHO para personas · WHICH para cosas · THAT sirve para ambas · WHOSE = posesión. El relativo reemplaza al sujeto: no se repite (no “which it”).","correctReason":"“That confirmed”: sin pronombre repetido.","hint":"¿La palabra descrita es persona o cosa? Y revisa que el relativo no venga con un pronombre repetido de contrabando."}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('(^|[^A-Za-z0-9_])('+escReg(o.errorWord)+')(?=$|[^A-Za-z0-9_])'),'$1<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=85?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=85?'¡Muy bien! Aprobaste esta práctica. 💪'
            :'Aún no llegas al 85%. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
</body>
</html>
