<!DOCTYPE html>
<html lang="es">
<head>

    <title>Identification · Conectores de Tiempo · JUCUM English Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2EA84B; --primary-light: #9FD3A2; --primary-dark: #1B5E20;
            --accent: #43C062; --bg-gradient-start: #F0F8F2; --bg-gradient-end: #DFF5E3;
            --text-dark: #1B5E20; --text-medium: #1F7A33; --text-light: #2E7D32;
            --success: #10B981; --success-light: #D1FAE5; --success-dark: #059669;
            --error: #EF4444; --error-light: #FEE2E2; --error-dark: #DC2626;
            --info: #3B82F6; --info-light: #DBEAFE; --info-dark: #1D4ED8;
            --purple: #8B5CF6; --purple-light: #EDE9FE; --purple-dark: #6D28D9;
            --orange-light: #FFEDD5; --orange-dark: #C2410C;
            --white: #FFFFFF;
            --shadow-soft: 0 4px 20px rgba(46,168,75,0.15);
            --shadow-strong: 0 8px 30px rgba(46,168,75,0.25);
            --border-radius: 20px;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family:'Nunito',sans-serif; background:linear-gradient(135deg,var(--bg-gradient-start) 0%,var(--bg-gradient-end) 100%); min-height:100vh; color:var(--text-dark); }
        .header { background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%); padding:1rem 1.5rem; display:flex; align-items:center; gap:1rem; position:sticky; top:0; z-index:100; box-shadow:var(--shadow-soft); }
        .header-info { flex:1; }
        .header-title { font-family:'Fredoka',sans-serif; font-size:1.1rem; font-weight:600; color:white; }
        .header-subtitle { font-size:0.8rem; color:rgba(255,255,255,0.85); margin-top:2px; }
        .progress-indicator { background:rgba(255,255,255,0.3); padding:0.4rem 0.9rem; border-radius:20px; font-weight:700; color:white; font-size:0.9rem; white-space:nowrap; }
        .progress-container { padding:0; height:6px; background:rgba(255,255,255,0.3); }
        .progress-fill { height:100%; background:white; border-radius:0 3px 3px 0; transition:width .5s ease; width:0%; }
        main { padding:1.5rem; max-width:650px; margin:0 auto; }
        .instructions { background:white; border-radius:16px; padding:1rem 1.25rem; margin-bottom:1.25rem; box-shadow:var(--shadow-soft); border-left:5px solid var(--primary); display:flex; gap:0.75rem; align-items:flex-start; }
        .instructions-icon { font-size:1.6rem; flex-shrink:0; }
        .instructions-title { font-family:'Fredoka',sans-serif; font-size:1rem; font-weight:600; color:var(--text-dark); margin-bottom:0.2rem; }
        .instructions-text { font-size:0.85rem; color:var(--text-medium); line-height:1.5; }
        .question-card { background:white; border-radius:var(--border-radius); box-shadow:var(--shadow-soft); padding:1.5rem; margin-bottom:1rem; animation:slideIn .4s ease; }
        .question-card.hidden { display:none; }
        @keyframes slideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
        .q-header { display:flex; align-items:center; gap:0.75rem; margin-bottom:1rem; }
        .question-number { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif; font-weight:700; font-size:0.95rem; flex-shrink:0; }
        .topic-badge { display:inline-flex; align-items:center; gap:0.3rem; padding:0.2rem 0.7rem; border-radius:20px; font-size:0.72rem; font-weight:700; background:#DFF5E3; color:var(--text-medium); margin-left:auto; }
        .toggle-row { display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem; }
        .toggle-btn { border:2px solid var(--primary-light); background:#F0F8F2; color:var(--text-medium); border-radius:20px; padding:0.4rem 0.9rem; font-family:'Nunito',sans-serif; font-size:0.8rem; font-weight:700; cursor:pointer; transition:all .2s; }
        .toggle-btn:hover { background:var(--primary-light); }
        .toggle-btn.active { background:var(--primary); color:white; border-color:var(--primary); }
        .hint-box { background:#EFFAF1; border-left:4px solid var(--primary); padding:0.7rem 1rem; border-radius:0 10px 10px 0; margin-bottom:1rem; font-size:0.88rem; color:#1B5E20; line-height:1.5; display:none; }
        .hint-box.show { display:block; }
        .hint-label { font-weight:700; color:var(--primary-dark); display:flex; align-items:center; gap:0.4rem; margin-bottom:0.2rem; font-size:0.82rem; text-transform:uppercase; letter-spacing:.5px; }
        .translation { color:var(--text-light); font-style:italic; font-size:0.88rem; margin:0.5rem 0 1rem; padding:0.6rem 0.9rem; background:#F0F8F2; border-radius:10px; display:none; }
        .translation.show { display:block; }
        .feedback { margin-top:1.25rem; border-radius:16px; overflow:hidden; display:none; box-shadow:0 4px 16px rgba(0,0,0,0.1); }
        .feedback.show { display:block; animation:fadeUp .35s ease; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        .fb-header { padding:0.9rem 1.25rem; display:flex; align-items:center; gap:0.75rem; }
        .feedback.correct .fb-header { background:linear-gradient(135deg,var(--success),var(--success-dark)); }
        .feedback.incorrect .fb-header { background:linear-gradient(135deg,var(--error),var(--error-dark)); }
        .fb-icon { font-size:1.6rem; }
        .fb-title { font-family:'Fredoka',sans-serif; font-size:1.1rem; color:white; font-weight:600; }
        .fb-subtitle { font-size:0.8rem; color:rgba(255,255,255,0.85); margin-top:1px; }
        .fb-body { background:white; border:2px solid; border-top:none; border-radius:0 0 16px 16px; padding:1.25rem; display:flex; flex-direction:column; gap:0.9rem; }
        .feedback.correct .fb-body { border-color:var(--success); }
        .feedback.incorrect .fb-body { border-color:var(--error); }
        .fb-block { border-radius:12px; padding:0.9rem 1rem; }
        .fb-block-title { font-weight:800; font-size:0.78rem; text-transform:uppercase; letter-spacing:.6px; margin-bottom:0.5rem; display:flex; align-items:center; gap:0.4rem; flex-wrap:wrap; }
        .fb-signal { background:#F0FDF4; border:1px solid #BBF7D0; }
        .fb-signal.wrong { background:#FFF1F2; border:1px solid #FECDD3; }
        .fb-signal .fb-block-title { color:var(--success-dark); }
        .fb-signal.wrong .fb-block-title { color:var(--error-dark); }
        .fb-text { font-size:0.92rem; color:var(--text-dark); line-height:1.55; }
        .signal-tag { display:inline-block; background:var(--success); color:white; border-radius:6px; padding:0.1rem 0.5rem; font-size:0.8rem; font-weight:700; margin:0 2px; }
        .signal-tag.red { background:var(--error); }
        .fb-compare { background:#F8FAFC; border:1px solid #E2E8F0; }
        .fb-compare-row { display:flex; align-items:baseline; gap:0.6rem; padding:0.35rem 0; border-bottom:1px dashed #E2E8F0; }
        .fb-compare-row:last-child { border-bottom:none; }
        .compare-label { font-size:0.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; padding:0.15rem 0.5rem; border-radius:6px; flex-shrink:0; }
        .compare-label.wrong { background:var(--error-light); color:var(--error-dark); }
        .compare-label.right { background:var(--success-light); color:var(--success-dark); }
        .compare-text { font-size:0.95rem; color:var(--text-dark); line-height:1.5; }
        .word-wrong { color:var(--error); font-weight:700; text-decoration:line-through; }
        .word-right { color:var(--success-dark); font-weight:700; }
        .fb-error { background:var(--error-light); }
        .fb-error .fb-block-title { color:var(--error-dark); }
        .error-badge { display:inline-block; background:var(--error); color:white; padding:0.2rem 0.6rem; border-radius:6px; font-size:0.75rem; font-weight:700; }
        .word-swap { display:flex; align-items:center; justify-content:center; gap:0.75rem; margin:0.6rem 0; flex-wrap:wrap; }
        .ws-box { padding:0.4rem 1rem; border-radius:8px; font-weight:700; font-size:1rem; }
        .ws-wrong { background:white; color:var(--error); border:2px solid var(--error); text-decoration:line-through; }
        .ws-arrow { font-size:1.3rem; color:var(--text-medium); }
        .ws-right { background:var(--success); color:white; }
        .error-text { font-size:0.88rem; color:var(--error-dark); line-height:1.5; }
        .fb-why { background:#F0FDF4; border:1px solid #BBF7D0; }
        .fb-why .fb-block-title { color:var(--success-dark); }
        .nav-buttons { display:flex; gap:0.75rem; margin-top:1.25rem; }
        .nav-btn { padding:0.8rem 1.2rem; border:none; border-radius:12px; font-family:'Nunito',sans-serif; font-size:0.95rem; font-weight:700; cursor:pointer; transition:all .2s; }
        .nav-btn.next { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; flex:1; }
        .nav-btn.prev { background:#F1F5F9; color:var(--text-dark); }
        .nav-btn:disabled { opacity:.4; cursor:default; }
        .nav-btn:not(:disabled):hover { transform:translateY(-2px); box-shadow:var(--shadow-soft); }
        .results-screen { display:none; text-align:center; padding:2rem 1.5rem; }
        .results-screen.show { display:block; animation:fadeUp .5s ease; }
        .results-emoji { font-size:4rem; margin-bottom:1rem; }
        .results-title { font-family:'Fredoka',sans-serif; font-size:2rem; margin-bottom:0.5rem; }
        .results-score { font-size:3rem; font-weight:800; color:var(--purple); margin:1rem 0; }
        .results-message { font-size:1.05rem; color:var(--text-medium); margin-bottom:1.5rem; }
        .stars-container { display:flex; justify-content:center; gap:0.5rem; margin:1.5rem 0; }
        .star { font-size:2.5rem; opacity:.3; transition:all .5s ease; }
        .star.earned { opacity:1; animation:starPop .5s ease; }
        @keyframes starPop { 0%{transform:scale(0)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }
        .results-buttons { display:flex; flex-direction:column; gap:1rem; margin-top:2rem; }
        .result-btn { padding:1rem 2rem; border:none; border-radius:12px; font-family:'Nunito',sans-serif; font-size:1rem; font-weight:700; cursor:pointer; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:0.5rem; transition:all .2s; }
        .result-btn.primary { background:linear-gradient(135deg,var(--purple),var(--purple-dark)); color:white; }
        .result-btn:hover { transform:translateY(-2px); box-shadow:var(--shadow-soft); }
        .q-label { font-size:0.88rem; color:var(--text-medium); font-weight:600; }
        .sentence-options { display:flex; flex-direction:column; gap:0.7rem; margin-bottom:0.5rem; }
        .sent-option { border:2.5px solid #E5E7EB; border-radius:14px; padding:1rem 1.1rem; cursor:pointer; transition:all .2s; background:white; text-align:left; font-family:'Nunito',sans-serif; display:flex; gap:0.75rem; align-items:flex-start; width:100%; }
        .sent-option:hover:not(.disabled) { border-color:var(--primary); background:var(--bg-gradient-start); transform:translateX(4px); }
        .sent-option.disabled { cursor:default; }
        .sent-option.correct { border-color:var(--success); background:var(--success-light); }
        .sent-option.incorrect { border-color:var(--error); background:var(--error-light); }
        .option-letter { width:26px; height:26px; border-radius:50%; background:var(--primary-light); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.8rem; flex-shrink:0; font-family:'Fredoka',sans-serif; }
        .sent-option.correct .option-letter { background:var(--success); color:white; }
        .sent-option.incorrect .option-letter { background:var(--error); color:white; }
        .option-text { font-size:0.97rem; color:var(--text-dark); line-height:1.5; font-weight:600; flex:1; }
        .option-status { font-size:1.1rem; flex-shrink:0; display:none; }
        .sent-option.disabled .option-status { display:block; }
        .error-highlight { color:var(--error); font-weight:800; text-decoration:underline wavy; }
        .correct-highlight { color:var(--success-dark); font-weight:800; }
    </style>
</head><body>
    <header class="header">
        <div class="header-info">
            <div class="header-title">🔍 Identification</div>
            <div class="header-subtitle">💚 A2 · Módulo 2 · Conectores de Tiempo</div>

    <div class="progress-container"><div class="progress-fill" id="progressFill"></div></div>

    <main>
        <div class="instructions">
            <div class="instructions-icon">🔍</div>
            <div>
                <div class="instructions-title">Identifica la oración correcta</div>
                <div class="instructions-text">Lee las tres oraciones y elige la que esté gramaticalmente correcta. Usa los botones para una pista o la traducción si las necesitas.</div>
            </div>

        <div id="questionsContainer"></div>

        <div class="results-screen" id="resultsScreen">

            <div class="results-buttons">
                <button class="result-btn primary" onclick="location.reload()">🔄 Intentar de Nuevo</button>
            </div>
        </div>
    </main>

    <script>
    const quizData = [{"badge":"🧾 El pago","options":[{"text":"Check the amount before you pay.","correct":true,"es":"Revisa el monto antes de pagar."},{"text":"Check the amount after you pay.","correct":false,"es":"Revisa el monto después de pagar.","errorWord":"after","correctWord":"before","errorType":"Conector invertido","explanation":"Revisar DESPUÉS de pagar ya no salva nada: before you pay."},{"text":"Check the amount before you will pay.","correct":false,"es":"Revisa el monto antes de que pagarás.","errorWord":"will","correctWord":"(nada)","errorType":"Will tras conector de tiempo","explanation":"Tras before va presente: before you pay."}],"clue":"before = antes","clueExplain":"BEFORE = antes · AFTER = después · WHEN = cuando (momento) · WHILE = mientras (duración) · UNTIL = hasta · AS SOON AS = en cuanto. Con estos conectores el verbo va conjugado normal (o -ing tras before/after).","correctReason":"“Before you pay”: el orden lógico y sin will.","hint":"La revisión solo sirve en un momento de la línea de tiempo."},{"badge":"💸 El reembolso","options":[{"text":"She waited until the refund arrived.","correct":true,"es":"Esperó hasta que llegó el reembolso."},{"text":"She waited during the refund arrived.","correct":false,"es":"Esperó durante el reembolso llegó.","errorWord":"during","correctWord":"until","errorType":"During + oración","explanation":"“During” acompaña sustantivos (during the meeting); con oración va until."},{"text":"She waited until the refund will arrive.","correct":false,"es":"Esperó hasta que llegará el reembolso.","errorWord":"will","correctWord":"(nada)","errorType":"Will tras conector de tiempo","explanation":"En narración pasada: until the refund arrived."}],"clue":"until + oración","clueExplain":"BEFORE = antes · AFTER = después · WHEN = cuando (momento) · WHILE = mientras (duración) · UNTIL = hasta · AS SOON AS = en cuanto. Con estos conectores el verbo va conjugado normal (o -ing tras before/after).","correctReason":"“Until the refund arrived”: conector y tiempo correctos.","hint":"Dibuja la línea de tiempo: ¿qué pasó primero, qué después, qué duraba? El conector debe contar esa historia."},{"badge":"📱 La notificación","options":[{"text":"Call the bank as soon as you see the charge.","correct":true,"es":"Llama al banco en cuanto veas el cargo."},{"text":"Call the bank as soon you see the charge.","correct":false,"es":"Llama al banco tan pronto ves el cargo.","errorWord":"soon","correctWord":"soon as","errorType":"Expresión incompleta","explanation":"La expresión completa es as soon AS."},{"text":"Call the bank as soon as you will see the charge.","correct":false,"es":"Llama en cuanto verás el cargo.","errorWord":"will","correctWord":"(nada)","errorType":"Will tras conector de tiempo","explanation":"Tras as soon as va presente: you see."}],"clue":"as soon as (completo)","clueExplain":"BEFORE = antes · AFTER = después · WHEN = cuando (momento) · WHILE = mientras (duración) · UNTIL = hasta · AS SOON AS = en cuanto. Con estos conectores el verbo va conjugado normal (o -ing tras before/after).","correctReason":"“As soon as you see”: expresión completa y sin will.","hint":"A la expresión le falta un vagón en una de las opciones."},{"badge":"🍽 La cena","options":[{"text":"They reviewed the budget after they had dinner.","correct":true,"es":"Revisaron el presupuesto después de cenar."},{"text":"They reviewed the budget after they will have dinner.","correct":false,"es":"Revisaron después de que cenarán.","errorWord":"will","correctWord":"(nada)","errorType":"Will tras conector de tiempo","explanation":"En pasado: after they had dinner."},{"text":"They reviewed the budget before they had dinner, right at the end of the night.","correct":false,"es":"Revisaron el presupuesto antes de cenar, al final de la noche.","errorWord":"before","correctWord":"after","errorType":"Conector ilógico","explanation":"“Al final de la noche” delata el orden: fue DESPUÉS de la cena → after."}],"clue":"after = después","clueExplain":"BEFORE = antes · AFTER = después · WHEN = cuando (momento) · WHILE = mientras (duración) · UNTIL = hasta · AS SOON AS = en cuanto. Con estos conectores el verbo va conjugado normal (o -ing tras before/after).","correctReason":"“After they had dinner”: orden temporal correcto.","hint":"Dibuja la línea de tiempo: ¿qué pasó primero, qué después, qué duraba? El conector debe contar esa historia."},{"badge":"🔔 La alarma","options":[{"text":"When the alert rang, Marcos froze the card.","correct":true,"es":"Cuando sonó la alerta, Marcos congeló la tarjeta."},{"text":"While the alert rang for an instant, Marcos froze the card.","correct":false,"es":"Mientras la alerta sonó un instante, Marcos congeló.","errorWord":"While","correctWord":"When","errorType":"While con instante","explanation":"Un instante no “dura”: los momentos puntuales van con when."},{"text":"When the alert was ringing all afternoon, Marcos froze the card once.","correct":false,"es":"Cuando la alerta sonaba toda la tarde, congeló una vez.","errorWord":"When","correctWord":"While","errorType":"Duración con when","explanation":"Una acción que dura toda la tarde pide while."}],"clue":"when = momento · while = duración","clueExplain":"BEFORE = antes · AFTER = después · WHEN = cuando (momento) · WHILE = mientras (duración) · UNTIL = hasta · AS SOON AS = en cuanto. Con estos conectores el verbo va conjugado normal (o -ing tras before/after).","correctReason":"“When the alert rang”: momento puntual con when.","hint":"Dibuja la línea de tiempo: ¿qué pasó primero, qué después, qué duraba? El conector debe contar esa historia."},{"badge":"📄 El contrato","options":[{"text":"Read the contract before signing it.","correct":true,"es":"Lee el contrato antes de firmarlo."},{"text":"Read the contract before to sign it.","correct":false,"es":"Lee el contrato antes de a firmarlo.","errorWord":"to","correctWord":"(nada)","errorType":"Before + to","explanation":"Tras before va -ing o sujeto+verbo: before signing / before you sign."},{"text":"Read the contract after signing it.","correct":false,"es":"Lee el contrato después de firmarlo.","errorWord":"after","correctWord":"before","errorType":"Conector ilógico","explanation":"Leer DESPUÉS de firmar es tarde: before signing."}],"clue":"before + -ing","clueExplain":"BEFORE = antes · AFTER = después · WHEN = cuando (momento) · WHILE = mientras (duración) · UNTIL = hasta · AS SOON AS = en cuanto. Con estos conectores el verbo va conjugado normal (o -ing tras before/after).","correctReason":"“Before signing”: conector + -ing correctos.","hint":"Dibuja la línea de tiempo: ¿qué pasó primero, qué después, qué duraba? El conector debe contar esa historia."},{"badge":"💼 El sueldo","options":[{"text":"She saves a part as soon as the salary arrives.","correct":true,"es":"Ahorra una parte en cuanto llega el sueldo."},{"text":"She saves a part as soon as the salary will arrive.","correct":false,"es":"Ahorra en cuanto llegará el sueldo.","errorWord":"will","correctWord":"(nada)","errorType":"Will tras conector de tiempo","explanation":"Tras as soon as va presente: arrives."},{"text":"She saves a part while the salary arrives in one instant.","correct":false,"es":"Ahorra mientras el sueldo llega en un instante.","errorWord":"while","correctWord":"as soon as","errorType":"While con instante","explanation":"La llegada es un momento: as soon as."}],"clue":"as soon as + presente","clueExplain":"BEFORE = antes · AFTER = después · WHEN = cuando (momento) · WHILE = mientras (duración) · UNTIL = hasta · AS SOON AS = en cuanto. Con estos conectores el verbo va conjugado normal (o -ing tras before/after).","correctReason":"“As soon as the salary arrives”: hábito sin will.","hint":"Dibuja la línea de tiempo: ¿qué pasó primero, qué después, qué duraba? El conector debe contar esa historia."},{"badge":"🏦 La fila","options":[{"text":"He read the notices while he was waiting.","correct":true,"es":"Leyó los avisos mientras esperaba."},{"text":"He read the notices during he was waiting.","correct":false,"es":"Leyó los avisos durante él esperaba.","errorWord":"during","correctWord":"while","errorType":"During + oración","explanation":"“During” va con sustantivos; con oración: while."},{"text":"He read the notices while he was wait.","correct":false,"es":"Leyó los avisos mientras estaba esperar.","errorWord":"wait","correctWord":"waiting","errorType":"Falta -ing","explanation":"Tras was va -ing: waiting."}],"clue":"while + oración","clueExplain":"BEFORE = antes · AFTER = después · WHEN = cuando (momento) · WHILE = mientras (duración) · UNTIL = hasta · AS SOON AS = en cuanto. Con estos conectores el verbo va conjugado normal (o -ing tras before/after).","correctReason":"“While he was waiting”: conector y forma correctos.","hint":"Dibuja la línea de tiempo: ¿qué pasó primero, qué después, qué duraba? El conector debe contar esa historia."},{"badge":"💳 La clave","options":[{"text":"Don't share your PIN until you verify the caller.","correct":true,"es":"No compartas tu clave hasta verificar quién llama."},{"text":"Don't share your PIN until you will verify the caller.","correct":false,"es":"No compartas hasta que verificarás.","errorWord":"will","correctWord":"(nada)","errorType":"Will tras conector de tiempo","explanation":"Tras until va presente: you verify."},{"text":"Don't share your PIN before you verify the caller, share it never.","correct":false,"es":"No compartas antes de verificar, compártela nunca.","errorWord":"never","correctWord":"(nada)","errorType":"Frase rota","explanation":"El cierre “share it never” no existe en inglés; la idea es until you verify."}],"clue":"until + presente","clueExplain":"BEFORE = antes · AFTER = después · WHEN = cuando (momento) · WHILE = mientras (duración) · UNTIL = hasta · AS SOON AS = en cuanto. Con estos conectores el verbo va conjugado normal (o -ing tras before/after).","correctReason":"“Until you verify”: condición temporal limpia.","hint":"Dibuja la línea de tiempo: ¿qué pasó primero, qué después, qué duraba? El conector debe contar esa historia."},{"badge":"📊 El informe","options":[{"text":"After she finished the chart, she showed it to Carlos.","correct":true,"es":"Después de terminar el cuadro, se lo mostró a Carlos."},{"text":"After she will finish the chart, she showed it to Carlos.","correct":false,"es":"Después de que terminará, se lo mostró.","errorWord":"will","correctWord":"(nada)","errorType":"Will tras conector de tiempo","explanation":"En narración pasada: after she finished."},{"text":"Before she finished the chart, she showed it complete to Carlos.","correct":false,"es":"Antes de terminar el cuadro, se lo mostró completo.","errorWord":"Before","correctWord":"After","errorType":"Conector ilógico","explanation":"No puede mostrarlo COMPLETO antes de terminarlo: after."}],"clue":"after + pasado","clueExplain":"BEFORE = antes · AFTER = después · WHEN = cuando (momento) · WHILE = mientras (duración) · UNTIL = hasta · AS SOON AS = en cuanto. Con estos conectores el verbo va conjugado normal (o -ing tras before/after).","correctReason":"“After she finished…”: orden lógico y sin will.","hint":"Dibuja la línea de tiempo: ¿qué pasó primero, qué después, qué duraba? El conector debe contar esa historia."},{"badge":"🧾 El cierre","options":[{"text":"The teller counted the cash when the branch closed.","correct":true,"es":"La cajera contó el efectivo cuando cerró la sucursal."},{"text":"The teller counted the cash while the branch closed in a second.","correct":false,"es":"Contó el efectivo mientras la sucursal cerró en un segundo.","errorWord":"while","correctWord":"when","errorType":"While con instante","explanation":"El cierre es un momento: when."},{"text":"The teller counted the cash when the branch was close.","correct":false,"es":"Contó cuando la sucursal estaba cerrar.","errorWord":"close","correctWord":"closing","errorType":"Forma rota","explanation":"Sería “was closing” (proceso) o “closed” (momento); “was close” significa “estaba cerca”."}],"clue":"when = momento","clueExplain":"BEFORE = antes · AFTER = después · WHEN = cuando (momento) · WHILE = mientras (duración) · UNTIL = hasta · AS SOON AS = en cuanto. Con estos conectores el verbo va conjugado normal (o -ing tras before/after).","correctReason":"“When the branch closed”: momento con when.","hint":"Dibuja la línea de tiempo: ¿qué pasó primero, qué después, qué duraba? El conector debe contar esa historia."},{"badge":"🛒 La lista","options":[{"text":"Make a list before you go to the market.","correct":true,"es":"Haz una lista antes de ir al mercado."},{"text":"Make a list before you will go to the market.","correct":false,"es":"Haz una lista antes de que irás.","errorWord":"will","correctWord":"(nada)","errorType":"Will tras conector de tiempo","explanation":"Tras before va presente: you go."},{"text":"Make a list until you go to the market.","correct":false,"es":"Haz una lista hasta que vayas al mercado.","errorWord":"until","correctWord":"before","errorType":"Conector ilógico","explanation":"La lista se hace ANTES de ir, no “hasta” ir: before."}],"clue":"before + presente","clueExplain":"BEFORE = antes · AFTER = después · WHEN = cuando (momento) · WHILE = mientras (duración) · UNTIL = hasta · AS SOON AS = en cuanto. Con estos conectores el verbo va conjugado normal (o -ing tras before/after).","correctReason":"“Before you go”: consejo bien conectado.","hint":"Dibuja la línea de tiempo: ¿qué pasó primero, qué después, qué duraba? El conector debe contar esa historia."},{"badge":"💰 El depósito","options":[{"text":"Wait until the deposit appears in the app.","correct":true,"es":"Espera hasta que el depósito aparezca en la aplicación."},{"text":"Wait until the deposit will appear in the app.","correct":false,"es":"Espera hasta que aparecerá.","errorWord":"will","correctWord":"(nada)","errorType":"Will tras conector de tiempo","explanation":"Tras until va presente: appears."},{"text":"Wait during the deposit appears in the app.","correct":false,"es":"Espera durante el depósito aparece.","errorWord":"during","correctWord":"until","errorType":"During + oración","explanation":"Con oración va until: until the deposit appears."}],"clue":"until + presente","clueExplain":"BEFORE = antes · AFTER = después · WHEN = cuando (momento) · WHILE = mientras (duración) · UNTIL = hasta · AS SOON AS = en cuanto. Con estos conectores el verbo va conjugado normal (o -ing tras before/after).","correctReason":"“Until the deposit appears”: correcto.","hint":"Dibuja la línea de tiempo: ¿qué pasó primero, qué después, qué duraba? El conector debe contar esa historia."},{"badge":"📞 El asesor","options":[{"text":"As soon as the agent answered, Sofía explained the problem.","correct":true,"es":"En cuanto contestó el agente, Sofía explicó el problema."},{"text":"As soon as the agent was answering for one second, Sofía explained the problem.","correct":false,"es":"En cuanto el agente contestaba un segundo, explicó.","errorWord":"answering","correctWord":"answered","errorType":"Instante en continuo","explanation":"Contestar el teléfono es un flash: answered."},{"text":"As soon that the agent answered, Sofía explained the problem.","correct":false,"es":"Tan pronto que contestó, explicó.","errorWord":"that","correctWord":"as","errorType":"Expresión deformada","explanation":"La expresión es as soon AS, no as soon that."}],"clue":"as soon as + flash","clueExplain":"BEFORE = antes · AFTER = después · WHEN = cuando (momento) · WHILE = mientras (duración) · UNTIL = hasta · AS SOON AS = en cuanto. Con estos conectores el verbo va conjugado normal (o -ing tras before/after).","correctReason":"“As soon as the agent answered”: expresión y tiempo correctos.","hint":"Dibuja la línea de tiempo: ¿qué pasó primero, qué después, qué duraba? El conector debe contar esa historia."},{"badge":"🏠 La renta","options":[{"text":"Pay the rent when it is due, not after.","correct":true,"es":"Paga la renta cuando toca, no después."},{"text":"Pay the rent when it will be due, not after.","correct":false,"es":"Paga cuando tocará.","errorWord":"will","correctWord":"(nada)","errorType":"Will tras conector de tiempo","explanation":"Tras when va presente: when it is due."},{"text":"Pay the rent while it is due for one day.","correct":false,"es":"Paga la renta mientras toca por un día.","errorWord":"while","correctWord":"when","errorType":"While con fecha puntual","explanation":"El vencimiento es una fecha puntual: when."}],"clue":"when + presente","clueExplain":"BEFORE = antes · AFTER = después · WHEN = cuando (momento) · WHILE = mientras (duración) · UNTIL = hasta · AS SOON AS = en cuanto. Con estos conectores el verbo va conjugado normal (o -ing tras before/after).","correctReason":"“When it is due”: regla temporal limpia.","hint":"Dibuja la línea de tiempo: ¿qué pasó primero, qué después, qué duraba? El conector debe contar esa historia."}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('(^|[^A-Za-z0-9_])('+escReg(o.errorWord)+')(?=$|[^A-Za-z0-9_])'),'$1<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=85?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=85?'¡Muy bien! Aprobaste esta práctica. 💪'
            :'Aún no llegas al 85%. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
</body>
</html>
