<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Práctica 3 · Escribe la oración · JUCUM English Center</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800&family=Atkinson+Hyperlegible:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--card:#fff;--text:#2A2A2A;--soft:#777;--bd:#E8E5DC;--fd:'Fredoka','Nunito',system-ui,sans-serif;--fb:'Nunito',system-ui,sans-serif;--fs:'Atkinson Hyperlegible',system-ui,sans-serif;
--ok:#2E7D32;--okbg:#E8F5E9;--okbd:#A5D6A7;--warn:#B45309;--warnbg:#FFF7E8;--warnbd:#F5C77E;--bad:#C62828;--badbd:#EF9A9A;
--sh:0 2px 4px rgba(0,0,0,.07),0 10px 30px rgba(0,0,0,.14);--shs:0 1px 2px rgba(0,0,0,.06),0 3px 10px rgba(0,0,0,.09)}
[data-level="a2"]{--lp:#2EA84B;--ld:#1B5E20;--ll:#DFF5E3;--lm:#9FD3A2;--lg:linear-gradient(135deg,#43C062,#1F7A33);--tint:#F0F8F2}
[data-level="pre-a1"]{--lp:#F9A825;--ld:#E65100;--ll:#FFF9C4;--lm:#FFECB3;--lg:linear-gradient(135deg,#F9A825,#FF8F00);--tint:#FAF7EE}
[data-level="a1"]{--lp:#2196F3;--ld:#0D47A1;--ll:#E3F2FD;--lm:#BBDEFB;--lg:linear-gradient(135deg,#1565C0,#2196F3 60%,#64B5F6);--tint:#F1F7FE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--tint);color:var(--text);font-family:var(--fb);min-height:100vh}
a{color:var(--ld)}a:hover{color:var(--lp)}
.mat{max-width:640px;margin:0 auto;min-height:100vh}
.mhead{background:var(--lg);padding:16px 18px;display:flex;align-items:center;gap:11px;color:#fff;position:sticky;top:0;z-index:20}
.mback{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.22);border:none;color:#fff;font-size:19px;cursor:pointer;flex-shrink:0}
.mbadge{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.2)}.mbadge img{width:26px;height:26px;object-fit:contain}
.mh-info{flex:1;min-width:0}.mh-info b{font-family:var(--fd);font-weight:600;font-size:16px;display:block}.mh-info span{font-size:11px;opacity:.9;font-weight:700}
.mh-count{background:rgba(255,255,255,.25);padding:5px 12px;border-radius:14px;font-weight:800;font-size:13px}
.pbar{height:5px;background:rgba(0,0,0,.06);position:sticky;top:68px;z-index:20}.pfill{height:100%;background:var(--lp);width:0;transition:width .5s}
.mbody{padding:16px 16px 40px}
.langsw{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.lsw-lab{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--soft)}
.lsw{display:flex;background:#fff;border:1.5px solid var(--lm);border-radius:11px;padding:3px;gap:2px;box-shadow:var(--shs)}

.instr{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shs);border-left:4px solid var(--lp);display:flex;gap:10px;margin-bottom:14px}
.instr .em{font-size:21px}.instr>div>b{font-family:var(--fd);font-weight:600;font-size:14.5px;display:block}
.instr p{margin:1px 0 0;font-size:12.5px;color:var(--soft);line-height:1.45}.instr p b{display:inline;font-family:var(--fb);font-size:inherit;font-weight:800;color:var(--ld)}
.qcard{background:#fff;border-radius:18px;box-shadow:var(--shs);padding:16px;margin-bottom:13px}.qcard.hidden{display:none}
.qtop{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.qnum{width:31px;height:31px;border-radius:50%;background:var(--lg);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:600;font-size:14px;flex-shrink:0}
.qlabel{font-size:12.5px;font-weight:800;color:var(--soft)}
.qpt{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);margin-left:auto}
.qreport{font-size:11px;font-weight:800;color:#B9742B;background:#FCF1E3;border:1px solid #F2D9B8;padding:4px 10px;border-radius:9px;cursor:pointer}
.consigna{background:var(--ll);border:1px solid var(--lm);border-radius:11px;padding:10px 13px;font-size:14px;font-weight:800;color:var(--ld);margin-bottom:12px}
.cuewrap{background:var(--tint);border:1px dashed var(--lm);border-radius:11px;padding:11px 12px;margin-bottom:10px}
.cuelab{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);margin-bottom:7px}
.cue{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.piece{font-family:var(--fb);font-weight:800;font-size:15px;color:var(--ld);background:#fff;border:1.5px solid var(--lm);border-radius:9px;padding:7px 12px;cursor:pointer;transition:.12s;box-shadow:var(--shs)}
.piece:hover{border-color:var(--lp);transform:translateY(-1px)}.piece.used{opacity:.42}
.slash{color:#C9C3B4;font-weight:800;font-size:15px}
.datos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:11px}
.dchip{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--lm);border-radius:11px;padding:7px 12px;box-shadow:var(--shs)}

.dchip span{font-size:12px;color:var(--soft);font-weight:800}
.keyrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.key{font-family:var(--fb);font-weight:800;font-size:15px;color:#fff;background:var(--lg);border:none;border-radius:9px;padding:7px 15px;cursor:pointer;box-shadow:var(--shs)}
.key.used{opacity:.42}.qcard.locked .key{opacity:.4;pointer-events:none}
.multi{font-size:10.5px;font-weight:800;color:var(--warn);background:var(--warnbg);border:1px solid var(--warnbd);border-radius:8px;padding:4px 9px;margin-top:8px;display:inline-block}
.wline{display:flex;align-items:flex-end;gap:9px;margin-bottom:6px}
.arrow{font-size:21px;color:var(--lp);font-weight:800;line-height:1.6}
.winput{flex:1;min-width:0;font-family:var(--fb);font-weight:700;font-size:17px;color:var(--text);background:#fff;border:none;border-bottom:2.5px solid var(--lm);padding:10px 6px;outline:none;border-radius:5px 5px 0 0}
.winput::placeholder{color:#C6C0B2;font-weight:700;font-style:italic;font-size:14px}
.winput:focus{border-bottom-color:var(--lp);background:#FFFDF6}.winput:disabled{background:transparent}
.winput.perfect,.winput.details{border-bottom-color:var(--ok);color:var(--ok)}.winput.details{border-bottom-color:var(--warn);color:var(--warn)}.winput.error{border-bottom-color:var(--bad)}.winput.order{border-bottom-color:var(--warn);color:var(--warn)}
.ordq{background:#FFF7E8;border:1.5px solid var(--warnbd);border-radius:11px;padding:11px 13px;font-size:13px;font-weight:700;color:#6B4E00;line-height:1.5}
.blk.noteb{background:#EAF3FB;border:1.5px solid #BBDEFB;border-radius:11px;padding:11px 13px;font-size:13px;font-weight:700;color:#0D47A1;line-height:1.5}
.tools{display:flex;gap:7px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.tl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--soft)}
.tool{font-family:var(--fb);font-size:12px;font-weight:800;border:1.5px solid #D9D3C4;background:#fff;color:#5B554A;border-radius:8px;padding:6px 11px;cursor:pointer}
.tool.ap{font-size:17px;line-height:1;padding:5px 14px;color:var(--ld);border-color:var(--lm);background:var(--ll)}
.tip{font-size:11px;color:var(--soft);font-weight:700;flex:1;min-width:130px}
.support{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sbtn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border-radius:9px;padding:7px 13px;cursor:pointer;border:1.5px solid}
.sbtn.hint{background:var(--tint);color:var(--ld);border-color:var(--lm)}.sbtn.tr{background:#F3E5F5;color:#7B1FA2;border-color:#CE93D8}.sbtn.used{opacity:.55}
.reveal{display:none;border-radius:0 11px 11px 0;padding:10px 13px;font-size:13px;line-height:1.55;margin-bottom:12px}.reveal.show{display:block}
.reveal.hintbox{background:var(--tint);border-left:3px solid var(--lp)}.reveal.trbox{background:#F3E5F5;border-left:3px solid #7B1FA2;font-family:var(--fs);font-style:italic;color:#5A2A66}
.reveal .lab{display:block;font-style:normal;font-family:var(--fb);font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;opacity:.8}
.tcheck{width:100%;padding:12px;border:none;border-radius:11px;background:var(--lg);color:#fff;font-family:var(--fb);font-weight:800;font-size:14px;cursor:pointer}.tcheck:disabled{opacity:.4;cursor:default}
.reg{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--soft);font-weight:800;margin-top:9px}
.fb{margin-top:13px;border-radius:14px;overflow:hidden;display:none}.fb.show{display:block}
.fbh{padding:10px 14px;display:flex;align-items:center;gap:8px;color:#fff;font-family:var(--fd);font-weight:600;font-size:15px}
.fb.perfect .fbh{background:linear-gradient(135deg,var(--ok),#1B5E20)}.fb.details .fbh,.fb.order .fbh{background:linear-gradient(135deg,#EF8A00,var(--warn))}.fb.error .fbh{background:linear-gradient(135deg,var(--bad),#922)}
.fbh .pts{margin-left:auto;flex-shrink:0;white-space:nowrap;font-family:var(--fb);font-size:11px;font-weight:800;background:rgba(255,255,255,.25);padding:3px 10px;border-radius:10px}
.fbb{background:#fff;border:2px solid;border-top:none;border-radius:0 0 14px 14px;padding:13px;display:flex;flex-direction:column;gap:10px}
.fb.perfect .fbb{border-color:var(--okbd)}.fb.details .fbb,.fb.order .fbb{border-color:var(--warnbd)}.fb.error .fbb{border-color:var(--badbd)}
.blk{border-radius:11px;padding:10px 12px;font-size:13px;line-height:1.5}
.blk b.lab{font-size:10px;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px;opacity:.85}
.blk.yours{background:#FAFAF7;border:1px solid var(--bd)}
.blk.answer{background:var(--okbg);border:1px solid var(--okbd)}.blk.answer .a{font-weight:800;color:var(--ok);font-size:15px}
.blk.alt{background:#F5F3FF;border:1px solid #DDD6FE;color:#5B21B6;font-size:12.5px}
.blk.storyq{background:#FFF8E1;border:1px solid #FFE082;color:#6B4E00;font-family:var(--fs);font-style:italic}
.corr{background:#FFFDF7;border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:16.5px;line-height:2.15;font-weight:800}
.corr .keep{color:#3B3B3B}
.corr .del{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px;opacity:.7}
.corr .add{color:var(--ok);background:var(--okbg);border:1px solid var(--okbd);border-radius:6px;padding:1px 7px;margin-left:3px}
.corr .amb{color:var(--warn);background:#FFF3D6;border-radius:5px;padding:1px 5px;text-decoration:underline wavy var(--warnbd)}
.struct{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:11px;padding:11px 12px;color:#1D4ED8}
.struct>b.lab{display:block;font-family:var(--fd);font-weight:600;font-size:14.5px;margin-bottom:2px}
.frm{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:4px 0 8px}
.frm .pl{background:#fff;border:1px solid #BFDBFE;border-radius:7px;padding:3px 9px;font-size:12px;font-weight:800}
.frm .pl.hit{background:#1D4ED8;color:#fff;border-color:#1D4ED8}
.exrow{display:flex;flex-wrap:wrap;gap:5px}
.exchip{background:#fff;border:1px solid #BFDBFE;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:800;color:#1D4ED8}
.frm .pls{color:#93B4F5;font-weight:800}
.sline{font-size:13px;line-height:1.6;color:#1E3A8A;padding:7px 0;border-top:1px dashed #BFDBFE}.sline:first-of-type{border-top:none;padding-top:0}
.sline q,.wy q{font-family:var(--fs);font-style:normal;font-weight:800;background:#fff;border-radius:4px;padding:0 5px;quotes:'«' '»'}
.esbox{background:#FDF2F8;border:1px solid #F9C6E0;border-radius:11px;padding:10px 12px;color:#9D2463;font-size:13px;line-height:1.55}
.esbox b.lab{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;opacity:.85}
.why{display:flex;flex-direction:column;gap:7px}
.wy{display:flex;gap:9px;font-size:13px;line-height:1.55;border:1px solid var(--warnbd);background:var(--warnbg);color:#7A4A08;border-radius:10px;padding:9px 11px}
.wy.b{border-color:var(--badbd);background:#FFF8F7;color:#7A2F2F}
.wy .ic{flex-shrink:0;font-size:15px}
.wy .t{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;opacity:.85}
.qcard.locked .piece,.qcard.locked .tool{opacity:.4;pointer-events:none}
.nav{display:flex;gap:9px;margin-top:14px}.nb{padding:12px 15px;border:none;border-radius:11px;font-family:var(--fb);font-weight:800;font-size:13.5px;cursor:pointer}
.nb.next{background:var(--lg);color:#fff;flex:1}.nb.prev{background:#F1F0EA;color:var(--text)}.nb:disabled{opacity:.4;cursor:default}
.rform{margin-top:12px;background:#FCF7EF;border:1.5px solid #F0D9B8;border-radius:13px;padding:13px;display:none}.rform.show{display:block}
.rform h4{margin:0 0 9px;font-family:var(--fd);font-weight:600;font-size:13.5px;color:#92510F}
.rform select,.rform textarea{width:100%;font-family:var(--fb);font-size:13px;border:1.5px solid #E7D3B4;border-radius:9px;padding:9px 11px;margin-bottom:9px;background:#fff;resize:vertical}.rform textarea{min-height:54px}
.rrow{display:flex;gap:9px}.rsend{background:#C77D2E;color:#fff;border:none;border-radius:9px;padding:10px 17px;font-weight:800;font-size:13px;cursor:pointer;flex:1}.rcancel{background:#F1E7D6;color:#92510F;border:none;border-radius:9px;padding:10px 15px;font-weight:800;font-size:13px;cursor:pointer}
.rdone{background:#EAF7EC;border:1.5px solid var(--okbd);border-radius:13px;padding:13px;margin-top:12px;display:none}.rdone.show{display:block}
.results{display:none;padding:20px 16px 40px;text-align:center}.results.show{display:block}
.unlock{border-radius:13px;padding:11px;display:flex;align-items:center;gap:9px;justify-content:center;font-weight:800;font-size:14px;margin-bottom:15px}
.unlock.pass{background:var(--okbg);border:1.5px solid var(--okbd);color:var(--ok)}.unlock.fail{background:#FFF7E8;border:1.5px solid #F0C66B;color:#92510F}
.hero{background:var(--lg);border-radius:20px;padding:24px 20px;color:#fff;box-shadow:var(--shs)}.hero .em{font-size:50px;line-height:1}
.stars{display:flex;justify-content:center;gap:7px;margin:9px 0}.star{font-size:28px;opacity:.32}.star.on{opacity:1}
.score{font-family:var(--fd);font-weight:600;font-size:46px;line-height:1}.score small{font-size:20px;opacity:.8}
.phrase{font-size:14px;line-height:1.5;margin-top:9px;font-weight:700;opacity:.96}
.strip{display:flex;gap:10px;margin:15px 0 6px}.stat{flex:1;background:#fff;border:1px solid var(--bd);border-radius:13px;padding:12px 9px;box-shadow:var(--shs)}
.stat b{font-family:var(--fd);font-weight:600;font-size:22px;display:block;color:var(--ld)}.stat span{font-size:11px;color:var(--soft);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.note2{font-size:11.5px;color:var(--soft);font-weight:700;margin-bottom:14px}
.action{background:#fff;border:1.5px solid var(--lm);border-left:4px solid var(--lp);border-radius:13px;padding:13px 15px;text-align:left;font-size:13px;line-height:1.5;font-weight:700;margin-bottom:15px;box-shadow:var(--shs)}
.reinf{background:#FFF7E8;border:1.5px solid #F0C66B;border-radius:13px;padding:13px;text-align:left;margin-bottom:15px}
.reinf b{font-size:12px;color:#92510F;display:flex;gap:6px;align-items:center;text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px}
.rchips{display:flex;flex-wrap:wrap;gap:7px}.rchip{background:#fff;border:1.5px solid #F0C66B;color:#92510F;border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:800}
.surprise{background:linear-gradient(135deg,#FFF3D6,#FFFBF0);border:1.5px dashed var(--lp);border-radius:13px;padding:12px;display:flex;align-items:center;gap:11px;text-align:left;margin-bottom:15px}
.surprise .em{font-size:28px}.surprise b{font-size:13px;color:var(--ld)}.surprise p{margin:1px 0 0;font-size:11.5px;color:var(--soft);font-weight:700}
.rbtns{display:flex;flex-direction:column;gap:10px}.rbtn{padding:14px;border:none;border-radius:13px;font-family:var(--fb);font-weight:800;font-size:14px;cursor:pointer}
.rbtn.back{background:var(--lg);color:#fff}.rbtn.retry{background:#F1F0EA;color:var(--text)}
.mfoot{display:flex;align-items:center;justify-content:center;gap:8px;font-size:10.5px;color:#B0A99A;padding:16px;font-weight:700}.mfoot img{height:20px;opacity:.5}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:12px 22px;border-radius:24px;font-weight:800;font-size:13.5px;box-shadow:var(--sh);z-index:200;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.helpfab{position:fixed;right:16px;bottom:16px;z-index:120;width:44px;height:44px;border-radius:50%;background:var(--lg);color:#fff;border:none;font-size:22px;font-weight:800;cursor:pointer;box-shadow:var(--sh)}
.helpov{position:fixed;inset:0;z-index:130;background:rgba(20,20,25,.5);display:none;align-items:center;justify-content:center;padding:18px}.helpov.show{display:flex}
.helpcard{background:#fff;border-radius:18px;max-width:390px;width:100%;max-height:86%;overflow-y:auto;box-shadow:var(--sh);padding:18px 20px;position:relative}
.helpcard h3{font-family:var(--fd);font-weight:600;font-size:17px;color:var(--ld);margin:0 0 8px}.helpcard .hx{position:absolute;top:11px;right:13px;border:none;background:none;font-size:20px;color:#bbb;cursor:pointer}
.helptip{display:flex;gap:6px;font-size:12.5px;color:#555;padding:4px 0;line-height:1.45}.helptip b{color:var(--ld)}
.chip{position:fixed;left:16px;bottom:16px;z-index:120;display:flex;align-items:center;gap:7px;background:var(--ld);color:#fff;padding:8px 14px;border-radius:22px;font-weight:800;font-size:12.5px;box-shadow:var(--shs)}.chip small{font-weight:700;opacity:.8;font-size:9px}
</style>
</head>
<body data-level="a2">
<div class="mat">
  <div class="mhead"><button class="mback" onclick="exitGuard()">‹</button>
    <div class="mbadge"><img src="https://jucum-english-center.netlify.app/assets/jucum-figure.png" alt="JUCUM" onerror="this.style.display='none'"></div>

      <div class="lsw"><button id="lswEs" class="on" onclick="setLang('es')">Español</button><button id="lswEn" onclick="setLang('en')">English</button></div></div>
    <div class="instr"><div class="em">✍️</div><div><b id="insT"></b><p id="insP"></p></div></div>

  </div>
  <div class="results" id="results">

    <div class="strip"><div class="stat"><b id="fhits">0/15</b><span id="lHits"></span></div><div class="stat"><b id="ftime">0:00</b><span id="lTime"></span></div><div class="stat"><b id="fxp">+0</b><span id="lXp2"></span></div></div>

  <div class="reg" id="reg${i}" style="display:none"></div>
  <div class="fb" id="fb${i}"></div>
  <div class="rform" id="rf${i}"><h4 id="rfh${i}">${t.rFormH}</h4><select id="rt${i}">${t.rOpts.map(o=>`<option>${o}</option>`).join('')}</select><textarea id="rn${i}" placeholder="${t.rPlace}"></textarea><div class="rrow"><button class="rsend" onclick="sendReport(${i})">${t.rSend}</button><button class="rcancel" onclick="toggleReport(${i})">${t.rCancel}</button></div></div>
  <div class="rdone" id="rd${i}"><div style="font-weight:800;font-size:13px;color:#1B5E20">${t.rDone}</div><div style="font-size:11.5px;color:#555;margin-top:3px" id="rcl${i}">${t.rCodeLab}</div><div style="font-family:var(--fs);font-size:11.5px;background:#fff;border:1px dashed var(--okbd);border-radius:8px;padding:9px;margin-top:7px;color:#1B5E20;word-break:break-all" id="rc${i}"></div></div>
  <div class="nav"><button class="nb prev" onclick="nav(${i},-1)" ${i===0?'disabled':''}>${t.prev}</button><button class="nb next" id="nx${i}" onclick="nav(${i},1)" disabled>${i===QS.length-1?t.seeRes:t.next}</button></div></div>`;}
function put(i,txt){const el=document.getElementById('wi'+i);if(el.disabled)return;startTimer();
 const s=el.selectionStart??el.value.length,v=el.value,pre=v.slice(0,s),sp=pre&&!/[\s'’]$/.test(pre)&&!/^['’]/.test(txt);
 el.value=pre+(sp?' ':'')+txt+v.slice(s);const p=(pre+(sp?' ':'')+txt).length;el.focus();el.setSelectionRange(p,p);typed(i);}
function ins(i,k){put(i,QS[i].cue[k]);}
function insKey(i){put(i,QS[i].key.replace(/^much \+ /,'much '));}
function ap(i){put(i,"'");}
function clr(i){const el=document.getElementById('wi'+i);if(el.disabled)return;el.value='';el.focus();typed(i);}
function typed(i){startTimer();const el=document.getElementById('wi'+i);QS[i]._in=el.value;
 document.getElementById('chk'+i).disabled=!el.value.trim();
 const txt=' '+norm(el.value).toLowerCase()+' ';
 QS[i].cue.forEach((w,k)=>{const b=document.getElementById('p'+i+'_'+k);if(b)b.classList.toggle('used',txt.indexOf(' '+norm(w).toLowerCase()+' ')>=0);});
 const kb=document.getElementById('k'+i);if(kb)kb.classList.toggle('used',new RegExp('\\b'+QS[i].key.split(' ')[0].slice(0,4)).test(norm(el.value).toLowerCase()));}
function check(i){const el=document.getElementById('wi'+i);if(!el.value.trim()||locked[i])return;
 locked[i]=true;const it=QS[i];let r=escalar(grade(el.value,it.answer,it.exact));
 /*COMMA-V2*/if(it.commaStrict){const cw=r.warn.filter(w=>w.t==='Coma'||w.t==='Coma de más');if(cw.length){r.warn=r.warn.filter(w=>cw.indexOf(w)<0);cw.forEach(w=>r.hard.push({sub:'commaKey',u:w.u,a:w.a}));r.kind='error';r.score=0;r.words.forEach(w=>{if(w.c==='warn')w.c='bad';});}}
 if(r.kind==='error'&&it.alsoValid&&it.alsoValid.length){const alt=escalar(grade(el.value,it.alsoValid,it.exact));
  if(alt.kind!=='error'&&!alt.err.length)r={kind:'order',words:[],warn:[],err:[],hard:[],score:0,ref:it.answer[0],alt:alt.ref};}
 it._res=r;it._in=el.value;picked[i]=r.kind;
 if(r.kind==='perfect'||r.kind==='details'){score++;xpTotal+=XPQ;toast('+'+XPQ+' XP ⭐');}else wrongTags.push(it.reinf[lang]);
 if(it._tr)usedTr++;
 el.disabled=true;el.className='winput '+r.kind;
 document.getElementById('q'+i).classList.add('locked');
 document.getElementById('chk'+i).style.display='none';
 renderFb(i,r,it);
 document.getElementById('nx'+i).disabled=false;bump();}
function renderFb(i,r,it){const t=T[lang],fb=document.getElementById('fb'+i);
 const head=r.kind==='perfect'?t.fbOk:r.kind==='details'?t.fbW:r.kind==='order'?t.fbOrd:t.fbNo;
 let b='';
 if(r.kind==='order'){b+=`<div class="blk alt"><b class="lab">${t.bOrdY}</b><span class="a">${esc(it._in||'')}</span></div><div class="ordq">${t.ordMsg}</div>`;}
 else if(r.kind!=='perfect'){
  b+=`<div class="blk yours"><b class="lab">${t.bYours}</b><div class="corr">${corrLine(r)}</div></div>`;
  if(r.err.length){b+=structBlock(it,r);if(L(it.es))b+=`<div class="esbox"><b class="lab">${t.bEs}</b>${L(it.es)}</div>`;
  if(L(it.lit))b+=`<div class="blk alt"><b class="lab">${t.bLit}</b>${L(it.lit)}</div>`;}
  if(r.warn.length)b+=`<div class="why">${r.warn.map(e=>{const[ti,tx]=why(e);return `<div class="wy"><span class="ic">🟡</span><div><span class="t">${ti}</span>${tx}</div></div>`;}).join('')}</div>`;
  if(r.hard&&r.hard.length)b+=`<div class="why">${r.hard.map(e=>{const[ti,tx]=hardWhy(e);return `<div class="wy b"><span class="ic">🔴</span><div><span class="t">${ti}</span>${tx}</div></div>`;}).join('')}</div>`;}
 b+=`<div class="blk answer"><b class="lab">${t.bAnswer}</b><span class="a">${esc(r.ref)}</span></div>`;
 if(it.answer.length>1)b+=`<div class="blk alt"><b class="lab">${t.bAlt}</b>${it.answer.filter(a=>a!==r.ref).map(esc).join(' · ')}</div>`;
 if(it.noteB)b+=`<div class="blk noteb"><b class="lab">${t.noteLab}</b>${it.noteB[lang]}</div>`;
 if(it.story)b+=`<div class="blk storyq"><b class="lab" style="font-family:var(--fb);font-style:normal">${t.bStory}</b>${esc(it.story)}</div>`;
 fb.className='fb show '+r.kind;
 fb.innerHTML=`<div class="fbh"><span>${head}</span><span class="pts">${(r.kind==='perfect'||r.kind==='details')?t.pts1:t.pts0}</span></div><div class="fbb">${b}</div>`;
 const reg=document.getElementById('reg'+i);reg.style.display='flex';reg.textContent=t.locked;}
function reveal(i,which){startTimer();const it=QS[i];
 if(which==='hint'){document.getElementById('hr'+i).classList.toggle('show');document.getElementById('hb'+i).classList.add('used');}
 else{document.getElementById('trb'+i).classList.toggle('show');const b=document.getElementById('tb'+i);if(!b.classList.contains('used')){b.classList.add('used');it._tr=true;}}}
function bump(){document.getElementById('pfill').style.width=(picked.filter(x=>x!==null).length/QS.length*100)+'%';}
function show(i){document.querySelectorAll('#qbox .qcard').forEach((c,x)=>c.classList.toggle('hidden',x!==i));document.getElementById('cq').textContent=i+1;cur=i;window.scrollTo({top:0,behavior:'smooth'});}
function nav(i,d){if(d<0){if(i>0)show(i-1);return;}if(i<QS.length-1)show(i+1);else results();}
function results(){const t=T[lang];document.getElementById('mbody').style.display='none';document.getElementById('results').classList.add('show');
 const pct=Math.round(score/QS.length*100),passed=pct>=PASS;
 const um=document.getElementById('unlockMsg');um.className='unlock '+(passed?'pass':'fail');um.textContent=passed?t.pass:t.fail;
 document.getElementById('heroEm').textContent=passed?'🎉':'💪';
 document.getElementById('fscore').textContent=pct;document.getElementById('fhits').textContent=score+'/'+QS.length;
 document.getElementById('ftime').textContent=fmt(sec);document.getElementById('fxp').textContent='+'+(passed?xpTotal:0);
 const stars=pct>=90?3:pct>=PASS?2:1;document.querySelectorAll('.star').forEach((s,x)=>{if(x<stars)setTimeout(()=>s.classList.add('on'),x*220);});
 document.getElementById('fphrase').textContent=pct>=90?t.ph[0]:pct>=PASS?t.ph[1]:t.ph[2];
 document.getElementById('supportNote').innerHTML=usedTr>0?t.supp(usedTr):'';
 const uniq=[...new Set(wrongTags)],reinf=document.getElementById('reinf');
 if(uniq.length){reinf.style.display='block';document.getElementById('rchips').innerHTML=uniq.map(x=>`<span class="rchip">${x}</span>`).join('');}else reinf.style.display='none';
 const act=document.getElementById('actionMsg');
 act.innerHTML=pct>=90?(lang==='es'?'Dominas este tema. Continúa con la siguiente actividad en la plataforma.':'You\u2019ve mastered this. Move on to the next activity.'):passed?(lang==='es'?'Aprobaste. Antes de seguir, repasa: <b>'+uniq.join(', ')+'</b>.':'You passed. Before moving on, review: <b>'+uniq.join(', ')+'</b>.'):(lang==='es'?'Te faltó poco. Enfócate en <b>'+(uniq.slice(0,2).join(' y ')||'el tema')+'</b>, abre el resumen y vuelve a intentarlo.':'Almost there. Focus on <b>'+(uniq.slice(0,2).join(' and ')||'the topic')+'</b> and try again.');
 document.getElementById('surprise').style.display=passed?'flex':'none';
 window.scrollTo({top:0,behavior:'smooth'});
 window.JUCUM_OWN_PANEL=true;window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:pct,xp:passed?xpTotal:0,finished:passed}}));}
function restart(){render();}
function toggleReport(i){document.getElementById('rf'+i).classList.toggle('show');}
function sendReport(i){const type=document.getElementById('rt'+i).value,note=document.getElementById('rn'+i).value.trim();
 document.getElementById('rf'+i).classList.remove('show');
 const payload={mat:MAT.reportId,q:i+1,issue:type,note:note||'-',wrote:(QS[i]._in||'').slice(0,120)};
 document.getElementById('rc'+i).textContent='JEC-RPT · '+JSON.stringify(payload);document.getElementById('rd'+i).classList.add('show');
 try{window.dispatchEvent(new CustomEvent('jucum:report',{detail:payload}));}catch(e){}
 toast(lang==='es'?'✓ Reporte enviado a soporte':'✓ Report sent to support');}
function applyUiLang(){const t=T[lang];
 document.getElementById('chipNote').textContent=t.timeNote;document.getElementById('lswLab').textContent=t.lswLab;
 document.getElementById('insT').textContent=t.insT;document.getElementById('insP').innerHTML=t.insP;
 document.getElementById('mhtitle').textContent=MAT.title;document.getElementById('mhsub').textContent=MAT.subtitle;
 document.getElementById('lHits').textContent=t.hits;document.getElementById('lTime').textContent=t.time;document.getElementById('lXp2').textContent=t.xpL;
 document.getElementById('lReinf').textContent=t.reinf;document.getElementById('lXp').textContent=t.xp;document.getElementById('lXpSub').textContent=t.xpSub;
 document.getElementById('lBack').textContent=t.back;document.getElementById('lRetry').textContent=t.retry;
 document.getElementById('helpT').textContent=t.helpT;
 document.getElementById('helpTips').innerHTML=t.tips.map(x=>'<div class="helptip">• <span>'+x+'</span></div>').join('');
 QS.forEach((it,i)=>{const e=id=>document.getElementById(id+i);
  if(e('ql'))e('ql').textContent=t.qlabel+' '+(i+1);if(e('qp'))e('qp').textContent=t.pt;if(e('qr'))e('qr').textContent=t.report;
  if(e('cn')&&it.task)e('cn').innerHTML='👉 '+it.task[lang];if(e('mu'))e('mu').textContent=t.multi(it.answer.length);
  const cl=document.querySelector('#q'+i+' .cl');if(cl)cl.textContent=t.cueLab;
  const kb=document.querySelector('#q'+i+' .kb');if(kb)kb.textContent=t.kb;
  const tp=document.querySelector('#q'+i+' .tp');if(tp)tp.textContent=t.tip;
  const wi=e('wi');if(wi)wi.placeholder=t.wph;if(e('wc'))e('wc').textContent=t.clear;
  const sh=document.querySelector('#hb'+i+' .sh');if(sh)sh.textContent=t.hint;const st=document.querySelector('#tb'+i+' .st');if(st)st.textContent=t.tr;
  const hl=document.querySelector('#hr'+i+' .hl');if(hl)hl.textContent=t.hintLab;const hv=document.querySelector('#hr'+i+' .hv');if(hv)hv.innerHTML=it.hint[lang];
  const tl2=document.querySelector('#trb'+i+' .tl2');if(tl2)tl2.textContent=t.trLab;
  const chk=e('chk');if(chk&&chk.style.display!=='none')chk.textContent=t.check;
  if(e('nx'))e('nx').textContent=(i===QS.length-1?t.seeRes:t.next);
  const pv=document.querySelector('#q'+i+' .prev');if(pv)pv.textContent=t.prev;
  if(e('rfh'))e('rfh').textContent=t.rFormH;if(e('rcl'))e('rcl').textContent=t.rCodeLab;
  if(locked[i]&&it._res){const w=e('wi');if(w){w.value=it._in||'';w.disabled=true;}renderFb(i,it._res,it);}});
 wrongTags=[];QS.forEach((it,i)=>{if(picked[i]==='error')wrongTags.push(it.reinf[lang]);});}
function setLang(l){lang=l;document.getElementById('lswEs').classList.toggle('on',l==='es');document.getElementById('lswEn').classList.toggle('on',l==='en');applyUiLang();if(document.getElementById('results').classList.contains('show'))results();}
function openHelp(){document.getElementById('helpov').classList.add('show');}
function closeHelp(){document.getElementById('helpov').classList.remove('show');}
function exitGuard(){if(!document.getElementById('results').classList.contains('show')&&(sec>0||locked.some(Boolean)))openExit();else volver();}
function openExit(){const t=T[lang];document.getElementById('exitT').textContent=t.exitT;document.getElementById('exitP').innerHTML=t.exitP(xpTotal);
 document.getElementById('exitStay').textContent=t.exitStay;document.getElementById('exitLeave').textContent=t.exitLeave;document.getElementById('exitov').classList.add('show');}
function closeExit(){document.getElementById('exitov').classList.remove('show');}
function leaveNow(){document.getElementById('exitov').classList.remove('show');xpTotal=0;volver();}
function volver(){if(document.referrer)location.href=document.referrer;else if(history.length>1)history.back();else toast(lang==='es'?'Vuelve a tu práctica en la plataforma':'Go back to your practice');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
document.addEventListener('contextmenu',e=>{if(e.target.closest('.mat')){e.preventDefault();toast(lang==='es'?'Material protegido © JUCUM EC':'Protected material © JUCUM EC');}});
render();
</script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
