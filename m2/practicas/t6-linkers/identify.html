    <style>
        :root {

        .fb-header { padding:0.9rem 1.25rem; display:flex; align-items:center; gap:0.75rem; }

        .fb-icon { font-size:1.6rem; }

        .word-swap { display:flex; align-items:center; justify-content:center; gap:0.75rem; margin:0.6rem 0; flex-wrap:wrap; }

        .error-text { font-size:0.88rem; color:var(--error-dark); line-height:1.5; }
        .fb-why { background:#F0FDF4; border:1px solid #BBF7D0; }

        .results-screen { display:none; text-align:center; padding:2rem 1.5rem; }

        .results-emoji { font-size:4rem; margin-bottom:1rem; }

        .results-score { font-size:3rem; font-weight:800; color:var(--purple); margin:1rem 0; }
        .results-message { font-size:1.05rem; color:var(--text-medium); margin-bottom:1.5rem; }
        .stars-container { display:flex; justify-content:center; gap:0.5rem; margin:1.5rem 0; }
        .star { font-size:2.5rem; opacity:.3; transition:all .5s ease; }

        .results-buttons { display:flex; flex-direction:column; gap:1rem; margin-top:2rem; }
        .result-btn { padding:1rem 2rem; border:none; border-radius:12px; font-family:'Nunito',sans-serif; font-size:1rem; font-weight:700; cursor:pointer; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:0.5rem; transition:all .2s; }
        .result-btn.primary { background:linear-gradient(135deg,var(--purple),var(--purple-dark)); color:white; }
        .result-btn:hover { transform:translateY(-2px); box-shadow:var(--shadow-soft); }
        .q-label { font-size:0.88rem; color:var(--text-medium); font-weight:600; }
        .sentence-options { display:flex; flex-direction:column; gap:0.7rem; margin-bottom:0.5rem; }

        .sent-option:hover:not(.disabled) { border-color:var(--primary); background:var(--bg-gradient-start); transform:translateX(4px); }
        .sent-option.disabled { cursor:default; }
        .sent-option.correct { border-color:var(--success); background:var(--success-light); }
        .sent-option.incorrect { border-color:var(--error); background:var(--error-light); }
        .option-letter { width:26px; height:26px; border-radius:50%; background:var(--primary-light); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.8rem; flex-shrink:0; font-family:'Fredoka',sans-serif; }
        .sent-option.correct .option-letter { background:var(--success); color:white; }
        .sent-option.incorrect .option-letter { background:var(--error); color:white; }
        .option-text { font-size:0.97rem; color:var(--text-dark); line-height:1.5; font-weight:600; flex:1; }
        .option-status { font-size:1.1rem; flex-shrink:0; display:none; }
        .sent-option.disabled .option-status { display:block; }
        .error-highlight { color:var(--error); font-weight:800; text-decoration:underline wavy; }
        .correct-highlight { color:var(--success-dark); font-weight:800; }
    </style>

    <script>
    const quizData = [{"badge":"🏦 La fila","options":[{"text":"The line was long, so Marcos used the app.","correct":true,"es":"La fila era larga, así que Marcos usó la aplicación."},{"text":"The line was long, because Marcos used the app.","correct":false,"es":"La fila era larga porque Marcos usó la aplicación.","errorWord":"because","correctWord":"so","errorType":"Causa y consecuencia invertidas","explanation":"Usar la app es la CONSECUENCIA de la fila: va con so."},{"text":"The line was long, why Marcos used the app.","correct":false,"es":"La fila era larga, por qué Marcos usó la app.","errorWord":"why","correctWord":"so","errorType":"Why como conector","explanation":"“Why” pregunta; no une causa y efecto. Aquí va so."}],"clue":"so = consecuencia","clueExplain":"BECAUSE presenta la causa · SO presenta la consecuencia · BUT contrasta · ALTHOUGH concede (y NUNCA se combina con but) · because OF solo acompaña sustantivos.","correctReason":"“…, so Marcos used the app”: la consecuencia con so.","hint":"Lee la lógica: ¿qué parte es la causa y cuál la consecuencia? Y ojo con los conectores dobles."},{"badge":"✈️ El sueño","options":[{"text":"She saves money because she wants to travel.","correct":true,"es":"Ahorra dinero porque quiere viajar."},{"text":"She saves money because of she wants to travel.","correct":false,"es":"Ahorra por ella quiere viajar.","errorWord":"of","correctWord":"(nada)","errorType":"Because of + oración","explanation":"“Because of” acompaña sustantivos; con oración va because solo."},{"text":"She saves money so she wants to travel.","correct":false,"es":"Ahorra dinero así que quiere viajar.","errorWord":"so","correctWord":"because","errorType":"Causa y consecuencia invertidas","explanation":"Querer viajar es la CAUSA: va con because."}],"clue":"because + oración","clueExplain":"BECAUSE presenta la causa · SO presenta la consecuencia · BUT contrasta · ALTHOUGH concede (y NUNCA se combina con but) · because OF solo acompaña sustantivos.","correctReason":"“Because she wants to travel”: causa con because.","hint":"Lee la lógica: ¿qué parte es la causa y cuál la consecuencia? Y ojo con los conectores dobles."},{"badge":"💳 La tarjeta","options":[{"text":"The card was lost, but the money was safe.","correct":true,"es":"La tarjeta se perdió, pero el dinero estaba a salvo."},{"text":"The card was lost, but although the money was safe.","correct":false,"es":"La tarjeta se perdió, pero aunque el dinero estaba a salvo.","errorWord":"although","correctWord":"(nada)","errorType":"Conectores dobles","explanation":"But y although no van juntos: uno u otro."},{"text":"The card was lost, nor the money was safe.","correct":false,"es":"La tarjeta se perdió, ni el dinero estaba a salvo.","errorWord":"nor","correctWord":"but","errorType":"Nor sin neither","explanation":"“Nor” necesita neither; el contraste simple usa but."}],"clue":"but = contraste","clueExplain":"BECAUSE presenta la causa · SO presenta la consecuencia · BUT contrasta · ALTHOUGH concede (y NUNCA se combina con but) · because OF solo acompaña sustantivos.","correctReason":"“…, but the money was safe”: contraste con un solo conector.","hint":"Lee la lógica: ¿qué parte es la causa y cuál la consecuencia? Y ojo con los conectores dobles."},{"badge":"🧾 El reclamo","options":[{"text":"Although the fee was small, Carlos disputed it.","correct":true,"es":"Aunque el cargo era pequeño, Carlos lo reclamó."},{"text":"Although the fee was small, but Carlos disputed it.","correct":false,"es":"Aunque el cargo era pequeño, pero Carlos lo reclamó.","errorWord":"but","correctWord":"(nada)","errorType":"Although + but","explanation":"En inglés although NO se acompaña de but: uno solo."},{"text":"Despite the fee was small, Carlos disputed it.","correct":false,"es":"A pesar el cargo era pequeño, Carlos lo reclamó.","errorWord":"Despite","correctWord":"Although","errorType":"Despite + oración","explanation":"“Despite” acompaña sustantivos; con oración va although."}],"clue":"although solo","clueExplain":"el “aunque…pero” del español NO se traduce: although trabaja sin but.","correctReason":"“Although …, Carlos disputed it”: concesión con un solo conector.","hint":"El español mete un “pero” después de “aunque”. El inglés no lo permite."},{"badge":"💵 El pago","options":[{"text":"You can pay in cash or with your card.","correct":true,"es":"Puedes pagar en efectivo o con tu tarjeta."},{"text":"You can pay in cash o with your card.","correct":false,"es":"Puedes pagar en efectivo o con tarjeta.","errorWord":"o","correctWord":"or","errorType":"Conector en español","explanation":"La “o” española se coló: en inglés es or."},{"text":"You can pay in cash nor with your card.","correct":false,"es":"Puedes pagar en efectivo ni con tarjeta.","errorWord":"nor","correctWord":"or","errorType":"Nor sin neither","explanation":"“Nor” va con neither; la alternativa simple usa or."}],"clue":"or = alternativa","clueExplain":"BECAUSE presenta la causa · SO presenta la consecuencia · BUT contrasta · ALTHOUGH concede (y NUNCA se combina con but) · because OF solo acompaña sustantivos.","correctReason":"“Cash or card”: alternativa con or.","hint":"Lee la lógica: ¿qué parte es la causa y cuál la consecuencia? Y ojo con los conectores dobles."},{"badge":"📊 El cuadro","options":[{"text":"Diana made a chart and canceled three subscriptions.","correct":true,"es":"Diana hizo un cuadro y canceló tres suscripciones."},{"text":"Diana made a chart but and canceled three subscriptions.","correct":false,"es":"Diana hizo un cuadro pero y canceló tres.","errorWord":"but","correctWord":"(nada)","errorType":"Conectores dobles","explanation":"Un solo conector: and."},{"text":"Diana made a chart and canceled although three subscriptions.","correct":false,"es":"Diana hizo un cuadro y canceló aunque tres.","errorWord":"although","correctWord":"(nada)","errorType":"Conector perdido","explanation":"“Although” no pinta nada dentro de la segunda acción."}],"clue":"and = suma","clueExplain":"BECAUSE presenta la causa · SO presenta la consecuencia · BUT contrasta · ALTHOUGH concede (y NUNCA se combina con but) · because OF solo acompaña sustantivos.","correctReason":"“…and canceled…”: dos acciones sumadas con and.","hint":"Lee la lógica: ¿qué parte es la causa y cuál la consecuencia? Y ojo con los conectores dobles."},{"badge":"🔒 El congelamiento","options":[{"text":"The app froze the card, so nobody could use it.","correct":true,"es":"La aplicación congeló la tarjeta, así que nadie pudo usarla."},{"text":"The app froze the card, because nobody could use it.","correct":false,"es":"La congeló porque nadie pudo usarla.","errorWord":"because","correctWord":"so","errorType":"Causa y consecuencia invertidas","explanation":"Que nadie la use es la CONSECUENCIA: so."},{"text":"The app froze the card, so why nobody could use it.","correct":false,"es":"La congeló, así que por qué nadie pudo usarla.","errorWord":"why","correctWord":"(nada)","errorType":"Palabra de más","explanation":"“So” trabaja solo: so nobody could use it."}],"clue":"so = consecuencia","clueExplain":"BECAUSE presenta la causa · SO presenta la consecuencia · BUT contrasta · ALTHOUGH concede (y NUNCA se combina con but) · because OF solo acompaña sustantivos.","correctReason":"“…, so nobody could use it”: consecuencia con so.","hint":"Lee la lógica: ¿qué parte es la causa y cuál la consecuencia? Y ojo con los conectores dobles."},{"badge":"📞 El banco","options":[{"text":"He called the bank because the charge was strange.","correct":true,"es":"Llamó al banco porque el cargo era extraño."},{"text":"He called the bank because of the charge was strange.","correct":false,"es":"Llamó por el cargo era extraño.","errorWord":"of","correctWord":"(nada)","errorType":"Because of + oración","explanation":"Con una oración completa va because, sin of."},{"text":"He called the bank so the charge was strange.","correct":false,"es":"Llamó al banco así que el cargo era extraño.","errorWord":"so","correctWord":"because", ico","explanation":"No es consecuencia: es contraste → but."}],"clue":"but = contraste","clueExplain":"BECAUSE presenta la causa · SO presenta la consecuencia · BUT contrasta · ALTHOUGH concede (y NUNCA se combina con but) · because OF solo acompaña sustantivos.","correctReason":"“…, but the app worked”: contraste lógico.","hint":"Lee la lógica: ¿qué parte es la causa y cuál la consecuencia? Y ojo con los conectores dobles."},{"badge":"⚡ La reacción","options":[{"text":"The alert arrived, so he acted fast.","correct":true,"es":"La alerta llegó, así que actuó rápido."},{"text":"The alert arrived, because he acted fast.","correct":false,"es":"La alerta llegó porque actuó rápido.","errorWord":"because","correctWord":"so","errorType":"Causa y consecuencia invertidas","explanation":"Actuar rápido es la CONSECUENCIA de la alerta: so."},{"text":"The alert arrived, why he acted fast.","correct":false,"es":"La alerta llegó, por qué actuó rápido.","errorWord":"why","correctWord":"so","errorType":"Why como conector","explanation":"“Why” no une; aquí va so."}],"clue":"so = consecuencia","clueExplain":"BECAUSE presenta la causa · SO presenta la consecuencia · BUT contrasta · ALTHOUGH concede (y NUNCA se combina con but) · because OF solo acompaña sustantivos.","correctReason":"“…, so he acted fast”: consecuencia con so.","hint":"Lee la lógica: ¿qué parte es la causa y cuál la consecuencia? Y ojo con los conectores dobles."}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('(^|[^A-Za-z0-9_])('+escReg(o.errorWord)+')(?=$|[^A-Za-z0-9_])'),'$1<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=85?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=85?'¡Muy bien! Aprobaste esta práctica. 💪'
            :'Aún no llegas al 85%. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
</body>
</html>
