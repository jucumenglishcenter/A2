        .fb-header { padding:0.9rem 1.25rem; display:flex; align-items:center; gap:0.75rem; }

        .fb-icon { font-size:1.6rem; }

        .sent-option.correct { border-color:var(--success); background:var(--success-light); }

        .option-letter { width:26px; height:26px; border-radius:50%; background:var(--primary-light); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.8rem; flex-shrink:0; font-family:'Fredoka',sans-serif; }

        .error-highlight { color:var(--error); font-weight:800; text-decoration:underline wavy; }
        .correct-highlight { color:var(--success-dark); font-weight:800; }

ll.","correct":true,"es":"Encontró el error mientras revisaba la boleta."},{"text":"She was finding the error while she reviewed the bill.","correct":false,"es":"Estaba encontrando el error mientras revisó.","errorWord":"reviewed","correctWord":"was reviewing","errorType":"Tiempos invertidos","explanation":"Revisar es el proceso largo: was reviewing; encontrar es el flash: found."},{"text":"She found the error while she was review the bill.","correct":false,"es":"Encontró el error mientras estaba revisar.","errorWord":"review","correctWord":"reviewing","errorType":"Falta -ing","explanation":"Tras was va -ing: reviewing."}],"clue":"flash simple · fondo -ing","clueExplain":"acción LARGA de fondo → past continuous (was/were + -ing) · acción CORTA que interrumpe → past simple. “While” abraza a la larga; “when” suele traer a la corta.","correctReason":"“Found … while she was reviewing”: correcto.","hint":"Identifica cuál acción era el fondo (larga) y cuál el flash (corta). Cada una tiene su tiempo."},{"badge":"🚪 El cierre","options":[{"text":"The doors were closing when Marcos ran in.","correct":true,"es":"Las puertas se cerraban cuando Marcos entró corriendo."},{"text":"The doors closed when Marcos was running in for a moment.","correct":false,"es":"Las puertas se cerraron cuando Marcos corría adentro.","errorWord":"closed","correctWord":"were closing","errorType":"Tiempos invertidos","explanation":"El cierre lento es el fondo: were closing; la entrada, el flash: ran in."},{"text":"The doors were closing when Marcos runned in.","correct":false,"es":"Se cerraban cuando Marcos corrió-ó.","errorWord":"runned","correctWord":"ran","errorType":"Irregular regularizado","explanation":"“Run” es irregular: ran."}],"clue":"fondo -ing · flash simple","clueExplain":"acción LARGA de fondo → past continuous (was/were + -ing) · acción CORTA que interrumpe → past simple. “While” abraza a la larga; “when” suele traer a la corta.","correctReason":"“Were closing … ran in”: correcto.","hint":"Identifica cuál acción era el fondo (larga) y cuál el flash (corta). Cada una tiene su tiempo."},{"badge":"📊 Dos cosas a la vez","options":[{"text":"While Diana was making the chart, Carlos was checking the receipts.","correct":true,"es":"Mientras Diana hacía el cuadro, Carlos revisaba los comprobantes."},{"text":"While Diana was making the chart, Carlos checked suddenly the receipts.","correct":false,"es":"Mientras hacía el cuadro, Carlos revisó de repente.","errorWord":"suddenly","correctWord":"(nada)","errorType":"Adverbio fuera de lugar","explanation":"Dos acciones PARALELAS van ambas en continuo, sin “suddenly” en medio del objeto."},{"text":"While Diana was making the chart, Carlos was check the receipts.","correct":false,"es":"Mientras hacía el cuadro, Carlos estaba revisar.","errorWord":"check","correctWord":"checking","errorType":"Falta -ing","explanation":"Tras was va -ing: checking."}],"clue":"dos fondos paralelos","clueExplain":"dos acciones largas simultáneas van AMBAS en continuo: was making … was checking.","correctReason":"“Was making … was checking”: acciones paralelas en continuo.","hint":"Aquí nada interrumpe a nada: son dos fondos al mismo tiempo."},{"badge":"🔔 El sueño","options":[{"text":"He was dreaming when the alarm rang.","correct":true,"es":"Soñaba cuando sonó la alarma."},{"text":"He dreamed when the alarm was ringing.","correct":false,"es":"Soñó cuando la alarma sonaba.","errorWord":"dreamed","correctWord":"was dreaming","errorType":"Tiempos invertidos","explanation":"Soñar es el fondo: was dreaming; la alarma, el flash: rang."},{"text":"He was dreaming when the alarm ringed.","correct":false,"es":"Soñaba cuando la alarma sonó-ó.","errorWord":"ringed","correctWord":"rang","errorType":"Irregular regularizado","explanation":"“Ring” es irregular: rang."}],"clue":"fondo -ing · flash simple","clueExplain":"acción LARGA de fondo → past continuous (was/were + -ing) · acción CORTA que interrumpe → past simple. “While” abraza a la larga; “when” suele traer a la corta.","correctReason":"“Was dreaming … rang”: correcto.","hint":"Identifica cuál acción era el fondo (larga) y cuál el flash (corta). Cada una tiene su tiempo."},{"badge":"🏦 El apagón","options":[{"text":"While the clerk was printing the receipt, the power failed.","correct":true,"es":"Mientras la empleada imprimía el comprobante, se fue la energía."},{"text":"While the clerk printed the receipt, the power was failing.","correct":false,"es":"Mientras imprimió, la energía estaba fallando.","errorWord":"printed","correctWord":"was printing","errorType":"While + acción larga","explanation":"“While” abraza la impresión (larga): was printing; el corte es el flash: failed."},{"text":"While the clerk was printing the receipt, the power was fail.","correct":false,"es":"Mientras imprimía, la energía estaba fallar.","errorWord":"fail","correctWord":"failing","errorType":"Falta -ing","explanation":"Tras was va -ing (aunque aquí lo natural es “failed”)."}],"clue":"while + continuo","clueExplain":"acción LARGA de fondo → past continuous (was/were + -ing) · acción CORTA que interrumpe → past simple. “While” abraza a la larga; “when” suele traer a la corta.","correctReason":"“Was printing … failed”: fondo e interrupción correctos.","hint":"Identifica cuál acción era el fondo (larga) y cuál el flash (corta). Cada una tiene su tiempo."},{"badge":"👀 El error","options":[{"text":"I noticed the mistake while I was signing.","correct":true,"es":"Noté el error mientras firmaba."},{"text":"I was noticing the mistake while I signed.","correct":false,"es":"Estaba notando el error mientras firmé.","errorWord":"signed","correctWord":"was signing","errorType":"Tiempos invertidos","explanation":"Firmar es el proceso: was signing; notar es el flash: noticed."},{"text":"I noticed the mistake while I was sign.","correct":false,"es":"Noté el error mientras estaba firmar.","errorWord":"sign","correctWord":"signing","errorType":"Falta -ing","explanation":"Tras was va -ing: signing."}],"clue":"flash simple · fondo -ing","clueExplain":"acción LARGA de fondo → past continuous (was/were + -ing) · acción CORTA que interrumpe → past simple. “While” abraza a la larga; “when” suele traer a la corta.","correctReason":"“Noticed … while I was signing”: correcto.","hint":"Identifica cuál acción era el fondo (larga) y cuál el flash (corta). Cada una tiene su tiempo."}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('(^|[^A-Za-z0-9_])('+escReg(o.errorWord)+')(?=$|[^A-Za-z0-9_])'),'$1<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=85?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=85?'¡Muy bien! Aprobaste esta práctica. 💪'
            :'Aún no llegas al 85%. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
</body>
</html>
