const GLOSS = [{"w":"outage / cut","es":"corte (de servicio)","ex":"The water cut has lasted five days, hasn't it?"},{"w":"issue / problem","es":"problema / incidencia","ex":"State the issue clearly, with dates and numbers."},{"w":"claim / complaint","es":"reclamo / queja","ex":"A formal complaint needs evidence, not only emotion."},{"w":"report","es":"reporte / reportar","ex":"She reported the outage on the company website."},{"w":"evidence","es":"evidencia / pruebas","ex":"Attach the images as evidence, one per page."},{"w":"refund / credit","es":"reembolso / crédito","ex":"They offered a credit worth a week of service."},{"w":"replace / replacement","es":"reemplazar / reemplazo","ex":"The company must send a replacement, not excuses."},{"w":"support team","es":"equipo de soporte","ex":"The support team receives an ocean of emails every day."},{"w":"supervisor","es":"supervisor/a","ex":"\"Could you tell me if a supervisor is available?\""},{"w":"escalate","es":"escalar (una queja)","ex":"If the agent cannot help, escalate the case politely."},{"w":"used to","es":"solía (hábito pasado)","ex":"Her uncle used to work the land in his village."},{"w":"how much / how many","es":"cuánto/a · cuántos/as","ex":"How many days has the building been dry?"},{"w":"a few / a little","es":"unos pocos / un poco","ex":"They kept a few bottles and a little patience."},{"w":"too many / too much","es":"demasiados / demasiado","ex":"Too many calls, too much waiting, and no answers."},{"w":"some / any / no","es":"algo de / nada de","ex":"There isn't any water in the whole building."},{"w":"must / might / can't (deducción)","es":"debe de / podría / no puede ser","ex":"It must be the main pipe; it can't be only our floor."},{"w":"have to (obligación)","es":"tener que","ex":"You have to keep the receipt and the claim number."},{"w":"tag questions","es":"preguntas coletilla (¿no?)","ex":"The truck comes today, doesn't it?"},{"w":"indirect questions","es":"preguntas indirectas","ex":"\"Could you tell me when the technician will arrive?\""},{"w":"present perfect + since/for","es":"perfecto + desde/durante","ex":"We have been without water since Monday."},{"w":"attach","es":"adjuntar","ex":"Attach two images and the receipt to the form."},{"w":"state","es":"exponer / declarar","ex":"State the facts; skip the drama."},{"w":"imply","es":"insinuar / dar a entender","ex":"\"Are you implying that I broke it myself?\""},{"w":"inform","es":"informar","ex":"The company informed the building with one small paper."},{"w":"benefit","es":"beneficio","ex":"A calm voice is a benefit in every negotiation."},{"w":"value","es":"valor / valorar","ex":"The credit's value was a fraction of the damage."},{"w":"process","es":"proceso / trámite","ex":"The process has three steps and one long wait."},{"w":"category","es":"categoría","ex":"Choose the claim category: billing, damage, or delay."},{"w":"deadline / window","es":"plazo / ventana (del técnico)","ex":"The technician's window was from nine to one."},{"w":"nerves of steel","es":"nervios de acero","ex":"Negotiating requires patience and nerves of steel."},{"w":"fraction","es":"fracción / una parte","ex":"They offered a fraction of the real value."},{"w":"item","es":"artículo / ítem","ex":"Check every item on the bill, line by line."}];
/* Cada oración alineada EN↔ES (para resaltado por oración en ambos idiomas) */
const STORYDATA = {"1":{"sTitle":"A Week Without Water","sTitleEs":"Una semana sin agua","dTitle":"The Internet Is Down","dTitleEs":"Se cayó el internet","paras":[[["Lucia has lived in the same building for six years, unit 4B.","Lucia ha vivido en el mismo edificio por seis años, departamento 4B."],["It is an ordinary building: tired paint, dark stairs, kind neighbors.","Es un edificio común: pintura cansada, escaleras oscuras, vecinos amables."],["On Monday morning, she opened the tap and nothing came out.","El lunes por la mañana, abrió el caño y no salió nada."],["Not a drop — the pipes only made a sad, empty sound.","Ni una gota — las tuberías solo hicieron un sonido triste y vacío."],["\"It must be a small repair,\" she thought. \"It can't last long.\"","«Debe de ser una reparación pequeña», pensó. «No puede durar mucho»."]],[["She was wrong: the building has been dry since that Monday.","Estaba equivocada: el edificio ha estado seco desde ese lunes."],["How many days can a family live without running water? They learned.","¿Cuántos días puede vivir una familia sin agua corriente? Lo aprendieron."],["The neighbors kept a few bottles and a little patience, and shared both.","Los vecinos guardaron unas botellas y un poco de paciencia, y compartieron ambas."],["The lady from 2A, Doña Rita, held meetings by the main door.","La señora del 2A, Doña Rita, organizaba reuniones junto a la puerta principal."],["Her dog Rocco followed her everywhere, tail high like a flag.","Su perro Rocco la seguía a todas partes, con la cola en alto como bandera."]],[["The water company informed the building with one small paper on the wall.","La empresa de agua informó al edificio con un papelito en la pared."],["\"Repairs in process. We appreciate your patience.\" No date, no names.","«Reparaciones en proceso. Agradecemos su paciencia». Sin fecha, sin nombres."],["\"Patience is not a plan,\" said Lucia, taking a photo of the paper.","«La paciencia no es un plan», dijo Lucia, tomando una foto del papel."],["She decided to report the issue on the company website that night.","Decidió reportar el problema en la página web de la empresa esa noche."],["The form asked for a claim category, dates, and clear evidence.","El formulario pedía una categoría de reclamo, fechas y evidencia clara."]],[["Lucia used to write angry messages when services failed; not anymore.","Lucia solía escribir mensajes furiosos cuando fallaban los servicios; ya no."],["Experience has taught her a simple rule: state the facts, skip the drama.","La experiencia le ha enseñado una regla simple: expón los hechos, evita el drama."],["\"Day five without water. Building of twelve families. Two small children, one baby.\"","«Día cinco sin agua. Edificio de doce familias. Dos niños pequeños, un bebé»."],["She attached three images: the dry tap, the paper, the street works.","Adjuntó tres imágenes: el caño seco, el papel, las obras en la calle."],["Facts, dates, and photos: a calm argument beats a loud one.","Hechos, fechas y fotos: un argumento tranquilo le gana a uno ruidoso."]],[["On day six, a water truck finally arrived, and the street celebrated.","El día seis, por fin llegó un camión cisterna, y la calle celebró."],["People ran down in a happy race, with buckets, pots, and one inflatable pool.","La gente bajó corriendo en una carrera feliz, con baldes, ollas y una piscina inflable."],["\"How much can I take?\" asked everyone; \"Enough for today,\" said the driver.","«¿Cuánto puedo llevar?», preguntaba todos; «Suficiente por hoy», decía el conductor."],["Doña Rita organized the line with the voice of a general.","Doña Rita organizó la fila con voz de general."],["For one wet, happy hour, the sidewalk looked like a small lake.","Por una hora mojada y feliz, la vereda pareció un pequeño lago."]],[["That evening, Lucia received a call from the company's support team.","Esa noche, Lucia recibió una llamada del equipo de soporte de la empresa."],["\"We have read your report. It was clear and complete. Thank you.\"","«Hemos leído su reporte. Fue claro y completo. Gracias»."],["\"Could you tell me when the service will return?\" she asked politely.","«¿Podría decirme cuándo volverá el servicio?», preguntó con cortesía."],["\"Tomorrow before noon. Your building was moved up the list.\"","«Mañana antes del mediodía. Su edificio subió en la lista»."],["A good report, it seems, can move pipes and priorities.","Un buen reporte, parece, puede mover tuberías y prioridades."]],[["Water returned on day seven, at eleven in the morning, with applause.","El agua volvió el día siete, a las once de la mañana, con aplausos."],["First it came out brown, then clear, then gloriously ordinary.","Primero salió marrón, luego clara, luego gloriosamente normal."],["The neighbors met that night on the roof, enjoying the city view, thirsty for celebration.","Los vecinos se reunieron esa noche en la azotea, disfrutando la vista de la ciudad, sedientos de celebración."],["Doña Rita brought juice; the kids brought too many balloons for one roof.","Doña Rita trajo jugo; los niños trajeron demasiados globos para una azotea."],["Even Rocco got a bowl of fresh water and his own party.","Hasta Rocco recibió su tazón de agua fresca y su propia fiesta."]],[["The company later sent a credit: a fraction of the trouble, honestly.","La empresa luego envió un crédito: una fracción del problema, honestamente."],["But Lucia kept a benefit more useful than money: a method.","Pero Lucia se quedó con un beneficio más útil que el dinero: un método."],["Report early, state facts, attach evidence, and ask indirect, polite questions.","Reporta temprano, expón hechos, adjunta evidencia y haz preguntas indirectas y corteses."],["\"Water teaches you its value the week it disappears,\" says Doña Rita.","«El agua te enseña su valor la semana que desaparece», dice Doña Rita."],["Nobody in the building argues with that sentence anymore.","Ya nadie en el edificio discute esa frase."]]],"datos":["Deducción con modales: <b>must be</b> (debe de ser) · <b>can't be / can't last</b> (no puede ser/durar): <span class=\"frase\">It must be a small repair.</span>","Perfecto + <b>since/for</b>: <span class=\"frase\">has been dry since Monday · has lived there for six years.</span>",null,"<b>used to</b> = solía: <span class=\"frase\">She used to write angry messages.</span> (hábito pasado que ya no existe)","<b>How much</b> + incontable (water) · <b>How many</b> + contable (days).","Pregunta indirecta (más cortés): <span class=\"frase\">Could you tell me when the service will return?</span> — el orden vuelve a afirmación.","<b>too many</b> + contables: <span class=\"frase\">too many balloons</span> · <b>too much</b> + incontables: too much waiting.",null],"dlg":[["Lucia","Good morning. My internet has been down since last night.","Buenos días. Mi internet está caído desde anoche."],["Agente","Good morning! Let's check that. Could you give me your client number?","¡Buenos días! Vamos a revisarlo. ¿Podría darme su número de cliente?"],["Lucia","Yes, it's 55-431. Unit 4B, Los Álamos building.","Sí, es 55-431. Departamento 4B, edificio Los Álamos."],["Agente","Thank you. How long has the connection been down, exactly?","Gracias. ¿Exactamente cuánto tiempo lleva caída la conexión?"],["Lucia","Since ten at night. About twelve hours now.","Desde las diez de la noche. Unas doce horas ya."],["Agente","And the router lights — are any of them red?","Y las luces del router — ¿alguna está en rojo?"],["Lucia","One is red, two are off. That can't be good, can it?","Una está roja, dos apagadas. Eso no puede ser bueno, ¿no?"],["Agente","It usually means a line problem, not your router.","Normalmente significa un problema de línea, no su router."],["Lucia","So the problem must be outside the building, right?","Entonces el problema debe de estar fuera del edificio, ¿verdad?"],["Agente","Very probably. Have you tried turning it off and on?","Muy probablemente. ¿Ya probó apagarlo y encenderlo?"],["Lucia","Twice. I even tried airplane mode on my phone, out of pure hope.","Dos veces. Hasta probé el modo avión en mi teléfono, de pura esperanza."],["Agente","Ha! Airplane mode fixes phones, not routers, unfortunately.","¡Ja! El modo avión arregla teléfonos, no routers, lamentablemente."],["Lucia","Could you tell me whether there is an outage in my area?","¿Podría decirme si hay un corte en mi zona?"],["Agente","One moment… Yes. There is a cut on your whole street.","Un momento… Sí. Hay un corte en toda su calle."],["Lucia","I knew it! My neighbor has the same problem, hasn't she?","¡Lo sabía! Mi vecina tiene el mismo problema, ¿no?"],["Agente","She has. We have received an ocean of reports — several from your building.","Así es. Hemos recibido un océano de reportes — varios de su edificio."],["Lucia","And when will the technicians repair it?","¿Y cuándo lo repararán los técnicos?"],["Agente","The estimate says today before six in the evening.","La estimación dice hoy antes de las seis de la tarde."],["Lucia","Before six. I work from home, you know? Every hour costs me.","Antes de las seis. Trabajo desde casa, ¿sabe? Cada hora me cuesta."],["Agente","I understand. I can register a compensation request for the lost hours.","Entiendo. Puedo registrar una solicitud de compensación por las horas perdidas."],["Lucia","Yes, please. What information do you need from me?","Sí, por favor. ¿Qué información necesita de mí?"],["Agente","Nothing else. The system already shows the outage on your line.","Nada más. El sistema ya muestra el corte en su línea."],["Lucia","Perfect. And could you send me the claim number by message?","Perfecto. ¿Y podría enviarme el número de reclamo por mensaje?"],["Agente","Done. You will receive it in a minute, with the repair window.","Hecho. Lo recibirá en un minuto, con la ventana de reparación."],["Lucia","Thank you. You have been very clear, honestly.","Gracias. Ha sido muy claro, honestamente."],["Agente","Thank you for the calm call. Not everybody stays this polite!","Gracias por la llamada tranquila. ¡No todos se mantienen así de corteses!"],["Lucia","Ha! Shouting never fixed a cable, did it?","¡Ja! Gritar nunca arregló un cable, ¿o sí?"],["Agente","Never in my experience. Have a good day, Lucia.","Nunca en mi experiencia. Buen día, Lucia."]]},"2":{"sTitle":"The Model That Didn't Arrive","sTitleEs":"El modelo que no llegó","dTitle":"A Damaged Delivery","dTitleEs":"Una entrega dañada","paras":[[["Lucia's uncle Jorge was born in a small village near the mountains.","El tío Jorge de Lucia nació en un pueblito cerca de las montañas."],["He used to work the land there before moving to the city.","Solía trabajar la tierra allá antes de mudarse a la ciudad."],["Now his hobby is the radio: he repairs old ones on weekends.","Ahora su pasatiempo es la radio: repara radios viejas los fines de semana."],["Last month, he ordered a specific model online: the R-90, silver, with wooden sides.","El mes pasado, pidió un modelo específico por internet: la R-90, plateada, con lados de madera."],["He has known and wanted that exact model since he was young.","Ha conocido y querido ese modelo exacto desde que era joven."]],[["The website promised delivery in one week; the box took three.","La página web prometía entrega en una semana; la caja tardó tres."],["When it finally arrived, Jorge opened it with the heart of a boy.","Cuando por fin llegó, Jorge la abrió con corazón de niño."],["Inside, there was a radio — but the wrong one entirely.","Adentro, había una radio — pero completamente equivocada."],["A plastic model, black, modern, with none of the R-90's warm face.","Un modelo de plástico, negro, moderno, sin nada de la cara cálida de la R-90."],["\"This must be a joke,\" he said quietly, checking the label twice.","«Esto debe de ser una broma», dijo en voz baja, revisando la etiqueta dos veces."]],[["The invoice said R-90; the object inside said otherwise.","La factura decía R-90; el objeto de adentro decía otra cosa."],["Jorge called Lucia, because everyone in the family calls Lucia.","Jorge llamó a Lucia, porque todos en la familia llaman a Lucia."],["\"Have you touched anything else in the box?\" she asked first.","«¿Has tocado algo más de la caja?», preguntó ella primero."],["\"Nothing. I have only lifted the radio and my own eyebrows.\"","«Nada. Solo he levantado la radio y mis propias cejas»."],["\"Perfect. Now we prepare the claim, step by step.\"","«Perfecto. Ahora preparamos el reclamo, paso a paso»."]],[["Step one: photograph everything — box, label, invoice, and the wrong item.","Paso uno: fotografiar todo — caja, etiqueta, factura y el artículo equivocado."],["Jorge took a few photos; Lucia asked for a few more, closer.","Jorge tomó unas fotos; Lucia pidió unas más, de cerca."],["\"The label is the key image: it proves their mistake, not ours.\"","«La etiqueta es la imagen clave: prueba su error, no el nuestro»."],["Step two: find the returns page on the website, read it completely.","Paso dos: buscar la página de devoluciones en la web, leerla completa."],["The process allowed replacements within thirty days — they had seven left.","El proceso permitía reemplazos dentro de treinta días — les quedaban siete."]],[["Step three: write the claim with clean, simple, polite language.","Paso tres: escribir el reclamo con lenguaje limpio, simple y cortés."],["\"I ordered model R-90 on May 3rd. I received a different product.\"","«Pedí el modelo R-90 el 3 de mayo. Recibí un producto diferente»."],["\"I have attached six images and the invoice as evidence.\"","«He adjuntado seis imágenes y la factura como evidencia»."],["\"I am requesting the original model or a full refund.\"","«Solicito el modelo original o un reembolso completo»."],["Short sentences, strong verbs, exact dates: the grammar of results.","Frases cortas, verbos fuertes, fechas exactas: la gramática de los resultados."]],[["The store answered in two days, faster than anybody expected, with an interesting offer.","La tienda respondió en dos días, más rápido de lo que cualquiera esperaba, con una oferta interesante."],["\"The R-90 is out of stock. We can offer a newer model plus credit.\"","«La R-90 está agotada. Podemos ofrecer un modelo más nuevo más un crédito»."],["Jorge looked at the photo of the \"newer model\" with suspicious eyes.","Jorge miró la foto del «modelo más nuevo» con ojos desconfiados."],["\"It has no soul,\" he declared. \"A radio needs a wooden heart.\"","«No tiene alma», declaró. «Una radio necesita un corazón de madera»."],["Lucia translated that into claim language: \"We prefer the refund, thank you.\"","Lucia lo tradujo a lenguaje de reclamo: «Preferimos el reembolso, gracias»."]],[["The refund arrived complete, to the last cent, five days later.","El reembolso llegó completo, hasta el último centavo, cinco días después."],["In addition, the store sent a discount code and a short apology.","Además, la tienda envió un código de descuento y una disculpa corta."],["\"See? Companies respect customers who respect the process,\" said Lucia.","«¿Ves? Las empresas respetan a los clientes que respetan el proceso», dijo Lucia."],["Jorge nodded, already searching for the R-90 on a different website.","Jorge asintió, ya buscando la R-90 en otra página web."],["Some loves do not accept replacements, and that is fine.","Algunos amores no aceptan reemplazos, y eso está bien."]],[["Two weeks later, a small shop in the center called Jorge back.","Dos semanas después, una tiendita del centro llamó a Jorge."],["They had found one R-90, used but healthy, at a fair price.","Habían encontrado una R-90, usada pero sana, a un precio justo."],["He paid in cash, carried it home like a sleeping baby.","Pagó en efectivo y la llevó a casa como a un bebé dormido."],["That Sunday, a radio program from France filled the kitchen while rain fell outside.","Ese domingo, un programa de radio desde Francia llenó la cocina mientras afuera caía la lluvia."],["\"Worth every step of the claim,\" he said. Nobody disagreed.","«Valió cada paso del reclamo», dijo. Nadie estuvo en desacuerdo."]]],"datos":["<b>used to</b> + verbo = solía: <span class=\"frase\">He used to work the land.</span>","Deducción: <b>must be</b> = debe de ser: <span class=\"frase\">This must be a joke.</span>","Perfecto para experiencias recientes: <span class=\"frase\">Have you touched anything else? · I have only lifted the radio.</span>","<b>a few</b> + contables = unas pocas: <span class=\"frase\">a few photos, a few more.</span>","Puntuación de un reclamo: frases cortas, punto seguido, fechas exactas — <span class=\"frase\">\"I ordered model R-90 on May 3rd. I received a different product.\"</span>",null,null,null],"dlg":[["Courier","Delivery for apartment 4B! One large box.","¡Entrega para el departamento 4B! Una caja grande."],["Lucia","That's me. Oh… the box looks a little sad, doesn't it?","Soy yo. Oh… la caja se ve un poco triste, ¿no?"],["Courier","It rained on the route. The truck got wet inside.","Llovió en la ruta. El camión se mojó por dentro."],["Lucia","Wet? This box contains a lamp. Glass, mainly.","¿Mojado? Esta caja contiene una lámpara. Vidrio, principalmente."],["Courier","Let's check it together before you sign, then.","Revisémosla juntos antes de que firme, entonces."],["Lucia","Good idea. Could you hold that side, please?","Buena idea. ¿Podría sostener ese lado, por favor?"],["Courier","Of course. Careful… okay, opening it now.","Claro. Cuidado… bien, la abro ahora."],["Lucia","The base is fine… but look, the glass has a crack.","La base está bien… pero mire, el vidrio tiene una rajadura."],["Courier","You are right. A small one, but it's there.","Tiene razón. Pequeña, pero ahí está."],["Lucia","Small cracks become big cracks. That is their hobby.","Las rajaduras pequeñas se vuelven grandes. Ese es su pasatiempo."],["Courier","Ha! True. Do you want to reject the delivery?","¡Ja! Cierto. ¿Quiere rechazar la entrega?"],["Lucia","What are my options, exactly?","¿Cuáles son mis opciones, exactamente?"],["Courier","Reject it now, or accept it with a damage note.","Rechazarla ahora, o aceptarla con una nota de daño."],["Lucia","Which one protects me more?","¿Cuál me protege más?"],["Courier","The damage note. You keep the lamp AND the claim.","La nota de daño. Se queda con la lámpara Y el reclamo."],["Lucia","Then let's write that note with much detail.","Entonces escribamos esa nota con mucho detalle."],["Courier","\"One crack, left side, four centimeters…\" like that?","«Una rajadura, lado izquierdo, cuatro centímetros…» ¿así?"],["Lucia","Exactly like that. And I will take a few photos now.","Exactamente así. Y yo tomaré unas fotos ahora."],["Courier","Take one with today's paper too. Old trick, works great.","Tome una con el periódico de hoy también. Viejo truco, funciona genial."],["Lucia","You are good at this. Has this happened many times?","Es bueno en esto. ¿Esto ha pasado muchas veces?"],["Courier","Too many times this rainy season, honestly.","Demasiadas veces en esta temporada de lluvias, honestamente."],["Lucia","Then the company must improve its boxes, don't you think?","Entonces la empresa debe mejorar sus cajas, ¿no cree?"],["Courier","I have said it in three meetings. Now I just bring tape.","Lo he dicho en tres reuniones. Ahora solo traigo cinta."],["Lucia","Ha! Okay, note written, photos ready. Where do I sign?","¡Ja! Bien, nota escrita, fotos listas. ¿Dónde firmo?"],["Courier","Here, and the claim code goes to your phone.","Aquí, y el código de reclamo llega a su teléfono."],["Lucia","Received. Thank you for checking with me.","Recibido. Gracias por revisar conmigo."],["Courier","Thank YOU. Customers who check save me problems later.","Gracias a USTED. Los clientes que revisan me ahorran problemas después."],["Lucia","Stay dry out there! The sky looks angry again.","¡Manténgase seco por ahí! El cielo se ve enojado otra vez."]]},"3":{"sTitle":"The Contract She Didn't Read","sTitleEs":"El contrato que no leyó","dTitle":"The Wrong Charge","dTitleEs":"El cargo equivocado","paras":[[["Lucia's neighbor Carmen signed a new internet contract last month.","La vecina de Lucia, Carmen, firmó un contrato nuevo de internet el mes pasado."],["The seller talked fast, smiled faster, and pointed at a shiny tablet.","El vendedor hablaba rápido, sonreía más rápido y señalaba una tablet brillante."],["\"Free installation! Double speed! A gift for new clients!\"","«¡Instalación gratis! ¡Doble velocidad! ¡Un regalo para clientes nuevos!»"],["Carmen signed on the screen with her finger, happy and hurried.","Carmen firmó en la pantalla con su dedo, contenta y apurada."],["She did not scroll down; nobody ever scrolls down.","No bajó la pantalla; nadie baja nunca la pantalla."]],[["The first bill arrived pretty normal; the second arrived pretty creative.","La primera factura llegó bastante normal; la segunda llegó bastante creativa."],["A \"premium support\" charge had appeared: eighteen soles and ninety cents.","Había aparecido un cargo de «soporte premium»: dieciocho soles con noventa céntimos."],["In addition, a \"device protection\" item added twelve soles more.","Además, un ítem de «protección de equipo» sumaba doce soles más."],["\"How many gifts am I paying for?\" Carmen asked her kitchen wall.","«¿Cuántos regalos estoy pagando?», le preguntó Carmen a la pared de su cocina."],["The wall, wisely, kept quiet; Lucia, kindly, did not.","La pared, sabiamente, guardó silencio; Lucia, amablemente, no."]],[["\"First, we find the contract. The real one, not the promises.\"","«Primero, encontramos el contrato. El de verdad, no las promesas»."],["Carmen found the PDF in her email, thirty-one pages long.","Carmen encontró el PDF en su correo, de treinta y una páginas."],["The extra charges lived on page nineteen, in small, tired letters.","Los cargos extra vivían en la página diecinueve, en letras pequeñas y cansadas."],["\"Optional services, free for one month, automatic after that.\"","«Servicios opcionales, gratis por un mes, automáticos después»."],["The gift, in contrast with the seller's smile, had a price.","El regalo, en contraste con la sonrisa del vendedor, tenía precio."]],[["Carmen used to accept these things quietly, as bad luck.","Carmen solía aceptar estas cosas en silencio, como mala suerte."],["\"My mother used to say: signed is signed,\" she sighed.","«Mi madre decía: lo firmado, firmado está», suspiró."],["\"Your mother didn't have consumer law,\" answered Lucia, opening the website.","«Tu madre no tenía ley del consumidor», respondió Lucia, abriendo la página web."],["Optional services, by law, require clear acceptance — not page nineteen.","Los servicios opcionales, por ley, requieren aceptación clara — no la página diecinueve."],["Knowledge, like water, changes everything the day it arrives.","El conocimiento, como el agua, lo cambia todo el día que llega."]],[["They called the company together, with the bill and the contract open.","Llamaron juntas a la empresa, con la factura y el contrato abiertos."],["\"Could you explain when I accepted these optional services?\" asked Carmen.","«¿Podría explicarme cuándo acepté estos servicios opcionales?», preguntó Carmen."],["The agent searched, hummed, searched again, and found no acceptance.","El agente buscó, tarareó, volvió a buscar y no encontró ninguna aceptación."],["\"They will be removed and refunded on your next bill, madam.\"","«Serán retirados y reembolsados en su próxima factura, señora»."],["Two sentences, three minutes, thirty soles less on every future bill.","Dos frases, tres minutos, treinta soles menos en cada factura futura."]],[["The victory smelled so good that Carmen invited the neighbors for tea.","La victoria olió tan bien que Carmen invitó a los vecinos a tomar té."],["Doña Rita arrived first, with Rocco and strong opinions about sellers.","Doña Rita llegó primero, con Rocco y opiniones fuertes sobre los vendedores."],["\"They must inform us clearly! It's the law, isn't it?\"","«¡Deben informarnos con claridad! Es la ley, ¿no?»"],["\"It is,\" said Lucia, \"and we have to read before signing. Both things.\"","«Lo es», dijo Lucia, «y tenemos que leer antes de firmar. Ambas cosas»."],["More neighbors joined, and the room divided into a friendly debate.","Más vecinos se unieron, y la sala se dividió en un debate amistoso."]],[["That week, three more neighbors checked their own bills carefully.","Esa semana, tres vecinos más revisaron sus propias facturas con cuidado."],["The lady from 2A found an old charge for a magazine nobody received.","La señora del 2A encontró un cargo viejo por una revista que nadie recibía."],["The student from 5C discovered he was paying for two routers.","El estudiante del 5C descubrió que pagaba por dos routers."],["One building, one week, three claims — and every claim succeeded.","Un edificio, una semana, tres reclamos — y todos los reclamos prosperaron."],["Small print loses its power when many eyes read it.","La letra pequeña pierde su poder cuando muchos ojos la leen."]],[["Carmen keeps the famous page nineteen printed on her refrigerator now.","Carmen ahora tiene la famosa página diecinueve impresa en su refrigeradora."],["Under it, in red pen: \"Read first. Sign later. Always.\"","Debajo, con lapicero rojo: «Lee primero. Firma después. Siempre»."],["The seller with the shiny tablet does not visit the building anymore.","El vendedor de la tablet brillante ya no visita el edificio."],["Word travels fast between neighbors who share tea and claims.","Las noticias viajan rápido entre vecinos que comparten té y reclamos."],["\"We are ordinary people,\" says Carmen, \"but we read now.\"","«Somos gente común», dice Carmen, «pero ahora leemos»."]]],"datos":[null,"Céntimos: <b>cents</b> — <span class=\"frase\">eighteen soles and ninety cents.</span> · <b>in addition</b> = además.","<b>in contrast with</b> = en contraste con: <span class=\"frase\">the gift, in contrast with the smile, had a price.</span>","<b>used to</b> para hábitos que ya cambiaron: <span class=\"frase\">Carmen used to accept these things quietly.</span>","Pregunta indirecta con valor de reclamo: <span class=\"frase\">Could you explain when I accepted these services?</span>","Tag question: <span class=\"frase\">It's the law, isn't it?</span> · Obligación: <b>must inform</b> · <b>have to read</b>.",null,null],"dlg":[["Jorge","Good afternoon. There is a charge on my bill that I don't recognize.","Buenas tardes. Hay un cargo en mi factura que no reconozco."],["Agente","Good afternoon, sir. Could you tell me which item it is?","Buenas tardes, señor. ¿Podría decirme qué ítem es?"],["Jorge","\"Streaming Plus\", twenty-four soles. I don't even know what that is.","«Streaming Plus», veinticuatro soles. Ni siquiera sé qué es eso."],["Agente","Let me check your account… One moment, please.","Déjeme revisar su cuenta… Un momento, por favor."],["Jorge","Take your time. I have tea and patience.","Tómese su tiempo. Tengo té y paciencia."],["Agente","Ha! Thank you. I see the charge, active since April.","¡Ja! Gracias. Veo el cargo, activo desde abril."],["Jorge","Since April! How much have I paid in total, then?","¡Desde abril! ¿Cuánto he pagado en total, entonces?"],["Agente","Three months… seventy-two soles in total.","Tres meses… setenta y dos soles en total."],["Jorge","Seventy-two soles for a service I have never opened.","Setenta y dos soles por un servicio que nunca he abierto."],["Agente","Did anybody else use your account, maybe? A family member?","¿Alguien más usó su cuenta, quizás? ¿Un familiar?"],["Jorge","Are you implying my radio did it? I live alone, madam.","¿Está insinuando que fue mi radio? Vivo solo, señorita."],["Agente","Understood. Do you remember a call in March, about a promotion?","Entendido. ¿Recuerda una llamada en marzo, sobre una promoción?"],["Jorge","A young man called, yes. I said \"send me the information\".","Llamó un joven, sí. Le dije «envíeme la información»."],["Agente","The system marked that call as an acceptance, unfortunately.","El sistema marcó esa llamada como una aceptación, lamentablemente."],["Jorge","\"Send me information\" is not \"yes\", young lady. Not in any language.","«Envíeme información» no es «sí», señorita. En ningún idioma."],["Agente","I agree with you, honestly. Let me state that in the case.","Coincido con usted, honestamente. Déjeme dejarlo asentado en el caso."],["Jorge","Thank you. What are the next steps?","Gracias. ¿Cuáles son los siguientes pasos?"],["Agente","I am cancelling the service now, first of all.","Estoy cancelando el servicio ahora, antes que nada."],["Agente","And I am requesting the refund of the three months.","Y estoy solicitando el reembolso de los tres meses."],["Jorge","The complete seventy-two? With its cents included?","¿Los setenta y dos completos? ¿Con sus céntimos incluidos?"],["Agente","Complete, with its cents. It will appear on your next bill.","Completos, con sus céntimos. Aparecerá en su próxima factura."],["Jorge","And how can I be sure this doesn't return next year?","¿Y cómo puedo estar seguro de que esto no vuelve el próximo año?"],["Agente","I am adding a note: \"No promotions by phone for this client.\"","Estoy agregando una nota: «Sin promociones por teléfono para este cliente»."],["Jorge","Excellent. You have been kind and quick.","Excelente. Ha sido amable y rápida."],["Agente","And you have been the calmest claim of my whole week, sir.","Y usted ha sido el reclamo más tranquilo de toda mi semana, señor."],["Jorge","Age teaches. Shouting spends energy; questions recover money.","La edad enseña. Gritar gasta energía; las preguntas recuperan dinero."],["Agente","I am writing that down for my own life, honestly.","Estoy anotando eso para mi propia vida, honestamente."],["Jorge","Free of charge, young lady. Have a good afternoon.","Sin costo, señorita. Buenas tardes."]]},"4":{"sTitle":"When the Heat Stopped Working","sTitleEs":"Cuando la terma dejó de funcionar","dTitle":"Escalating a Complaint","dTitleEs":"Escalando una queja","paras":[[["The weather turned early that year: winter, serious and gray, with icy mornings.","El clima cambió temprano ese año: invierno, serio y gris, con mañanas heladas."],["In Lucia's building, the water heater of unit 4B chose that exact week to die.","En el edificio de Lucia, la terma del 4B eligió exactamente esa semana para morir."],["It was only two years old, still under guarantee — and giving no heat.","Tenía apenas dos años, aún en garantía — y sin dar nada de calor."],["The first cold shower was a surprise; the second, a declaration of war.","La primera ducha fría fue una sorpresa; la segunda, una declaración de guerra."],["\"Nobody should start a Tuesday like this,\" Lucia informed her mirror.","«Nadie debería empezar un martes así», le informó Lucia a su espejo."]],[["She checked the basics first, like the manual's website suggested.","Primero revisó lo básico, como sugería la página web del manual."],["The electric switch functioned; the pilot light did not.","El interruptor eléctrico funcionaba; la llama piloto no."],["The temperature dial turned freely, connected to absolutely nothing.","La perilla de temperatura giraba libre, conectada a absolutamente nada."],["\"It might be the thermostat; it can't be the electricity,\" she reasoned.","«Podría ser el termostato; no puede ser la electricidad», razonó."],["Deduction is free; technicians, in beautiful contrast, are not.","Deducir es gratis; los técnicos, en hermoso contraste, no lo son."]],[["The guarantee promised service \"within seventy-two hours\" — a pretty phrase.","La garantía prometía servicio «dentro de las setenta y dos horas» — una frase bonita."],["Lucia registered the case on Monday and waited; the week passed, wordless.","Lucia registró el caso el lunes y esperó; la semana pasó, sin una palabra."],["She called on Friday: \"Your case is in process,\" said a tired voice.","Llamó el viernes: «Su caso está en proceso», dijo una voz cansada."],["\"In process\" is where cases go to sleep, Lucia has learned.","«En proceso» es donde los casos se van a dormir, ha aprendido Lucia."],["Seven days of ice-cold showers, at the height of winter, builds character — and claims.","Siete días de duchas heladas, en pleno invierno, construye carácter — y reclamos."]],[["On day eight, she prepared her escalation like a small project.","El día ocho, preparó su escalada como un pequeño proyecto."],["Task one: a timeline — dates of the case, calls, and promises.","Tarea uno: una línea de tiempo — fechas del caso, llamadas y promesas."],["Task two: the guarantee page, with the seventy-two hours underlined.","Tarea dos: la página de la garantía, con las setenta y dos horas subrayadas."],["Task three: the exact value of eight days without hot water.","Tarea tres: el valor exacto de ocho días sin agua caliente."],["Facts in categories and nerves of steel: that is how ordinary people win.","Hechos en categorías y nervios de acero: así gana la gente común."]],[["She called and asked, politely, for a supervisor by name.","Llamó y pidió, con cortesía, un supervisor por su nombre."],["\"Could you tell me who supervises guarantee cases in my district?\"","«¿Podría decirme quién supervisa los casos de garantía en mi distrito?»"],["Questions with names travel further than shouts without them.","Las preguntas con nombres llegan más lejos que los gritos sin ellos."],["The supervisor listened to the timeline in complete, respectful silence.","El supervisor escuchó la línea de tiempo en silencio completo y respetuoso."],["\"You are right, and we are late. Let me fix both things.\"","«Tiene razón, y estamos tarde. Déjeme arreglar ambas cosas»."]],[["The technician arrived the next morning, at the promised hour.","El técnico llegó a la mañana siguiente, a la hora prometida."],["The thermostat, as deduced, had died of ordinary old age.","El termostato, como se dedujo, había muerto de simple vejez."],["He replaced it in forty minutes, whistling, not missing a beat.","Lo reemplazó en cuarenta minutos, silbando, sin perder el ritmo."],["\"Good deduction, by the way. You must like detective stories.\"","«Buena deducción, por cierto. Le deben gustar las historias de detectives»."],["\"I like hot showers,\" said Lucia. \"They sharpen the mind.\"","«Me gustan las duchas calientes», dijo Lucia. «Afilan la mente»."]],[["The company also sent compensation: one month of the guarantee extended.","La empresa también envió compensación: un mes de garantía extendida."],["Lucia accepted it, though she valued something else more.","Lucia la aceptó, aunque valoraba más otra cosa."],["The supervisor called personally to confirm the repair. \"Everything working?\"","El supervisor llamó personalmente para confirmar la reparación. «¿Todo funcionando?»"],["\"Hot as new. Thank you for treating the case like it mattered.\"","«Caliente como nueva. Gracias por tratar el caso como si importara»."],["\"Your timeline made it easy. Most people only bring anger.\"","«Su línea de tiempo lo hizo fácil. La mayoría solo trae enojo»."]],[["That night, the building's group chat glowed with the news.","Esa noche, el chat del edificio brilló con la noticia."],["Doña Rita declared Lucia \"official minister of impossible claims\".","Doña Rita declaró a Lucia «ministra oficial de reclamos imposibles»."],["Lucia answered with a checklist for everyone, short and clear.","Lucia respondió con una lista para todos, corta y clara."],["\"Timeline. Evidence. Guarantee page. Polite escalation. Hot shower.\"","«Línea de tiempo. Evidencia. Página de garantía. Escalada cortés. Ducha caliente»."],["Somewhere in the building, a water heater shivered with respect.","En algún lugar del edificio, una terma tembló de respeto."]]],"datos":[null,"Deducción con modales: <b>might be</b> (podría ser) · <b>can't be</b> (no puede ser): <span class=\"frase\">It might be the thermostat; it can't be the electricity.</span>","Perfecto para aprendizajes: <span class=\"frase\">Lucia has learned…</span> · pasado simple para hechos con fecha: <span class=\"frase\">She registered the case on Monday.</span>",null,"Pregunta indirecta para escalar con cortesía: <span class=\"frase\">Could you tell me who supervises guarantee cases…?</span>",null,null,"Puntuación expresiva de una lista: puntos cortos y claros — <span class=\"frase\">\"Timeline. Evidence. Guarantee page.\"</span>"],"dlg":[["Lucia","Good morning. Case 7-741, the broken water heater. It has been eight days.","Buenos días. Caso 7-741, la terma malograda. Ya son ocho días."],["Agente Ruth","Good morning. Let me open the case… yes, it is still in process.","Buenos días. Déjeme abrir el caso… sí, sigue en proceso."],["Lucia","The guarantee promises service within seventy-two hours, doesn't it?","La garantía promete servicio dentro de las setenta y dos horas, ¿no?"],["Agente Ruth","It does, normally. This season has too many cases, honestly.","Así es, normalmente. Esta temporada tiene demasiados casos, honestamente."],["Lucia","I understand the season. My shower, sadly, does not.","Entiendo la temporada. Mi ducha, tristemente, no."],["Agente Ruth","Ha! I can add an urgency note to the case.","¡Ja! Puedo agregar una nota de urgencia al caso."],["Lucia","You added one on Friday. I have the note number here.","Ya agregó una el viernes. Tengo el número de la nota aquí."],["Agente Ruth","Oh. You keep very good records, madam.","Oh. Usted lleva muy buenos registros, señora."],["Lucia","Eight cold days sharpen the memory. Could I speak with a supervisor?","Ocho días fríos afilan la memoria. ¿Podría hablar con un supervisor?"],["Agente Ruth","One moment, please. I will transfer you to Mr. Beto.","Un momento, por favor. La transfiero con el señor Beto."],["Supervisor Beto","Good morning, this is Beto, guarantee supervisor. How can I help?","Buenos días, habla Beto, supervisor de garantías. ¿En qué puedo ayudar?"],["Lucia","Good morning. Case 7-741. May I read you a short timeline?","Buenos odos los casos fueran como el suyo, señora."],["Lucia","Give them my checklist. It's free — unlike cold showers.","Deles mi lista. Es gratis — a diferencia de las duchas frías."],["Agente Ruth","Ha! Have a warm week, Lucia.","¡Ja! Tenga una semana calientita, Lucia."],["Lucia","From tomorrow at eleven, I certainly will.","Desde mañana a las once, sin duda la tendré."]]}};

<script>
(function(){
  var FX={i:0,playing:false,sents:[],cfg:null};
  try{ FX.cfg=JSON.parse(localStorage.getItem("jucum_focus_cfg")||"null"); }catch(e){}
  FX.cfg=FX.cfg||{accent:"US",rate:0.9,text:"both"};
  function $g(id){return document.getElementById(id);}
  window.openFocus=function(){
    try{ if(!PARAS||!PARAS.length) return; }catch(e){ return; }
    FX.sents=[]; PARAS.forEach(function(p){ (p.pairs||[]).forEach(function(q){ FX.sents.push({en:q.en,es:q.es}); }); });
    try{ pausePlay(); }catch(e){}
    try{ $g("fxov").setAttribute("data-level", document.getElementById("screen").getAttribute("data-level")||"a2"); }catch(e){} $g("fxov").style.display="block"; fxShowSet();
  };
  function fxShowSet(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){}
    $g("fxset").style.display="block"; $g("fxread").style.display="none"; fxPaint(); }
  window.fxGear=function(){ fxShowSet(); };
  window.fxCfg=function(k,v){ FX.cfg[k]=v; try{localStorage.setItem("jucum_focus_cfg",JSON.stringify(FX.cfg));}catch(e){} fxPaint(); };
  function fxPaint(){ ["US","GB"].forEach(function(a){ $g("fxa"+a).classList.toggle("on",FX.cfg.accent===a); });
    [[0.75,"fxr075"],[0.9,"fxr09"],[1,"fxr1"],[1.15,"fxr115"]].forEach(function(p){ $g(p[1]).classList.toggle("on",FX.cfg.rate===p[0]); });
    $g("fxten").classList.toggle("on",FX.cfg.text==="en"); $g("fxtboth").classList.toggle("on",FX.cfg.text==="both"); }
  window.fxStart=function(){ FX.i=0; $g("fxset").style.display="none"; $g("fxread").style.display="flex"; FX.playing=true; fxRender(); fxSay(); };
  window.closeFocus=function(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} $g("fxov").style.display="none"; };
  function fxVoice(){ try{ var vs=speechSynthesis.getVoices()||[]; var gb=(FX.cfg.accent==="GB"||FX.cfg.accent==="UK"); var want=gb?"en-gb":"en-us";
    var pref= gb?["Google UK English Female","Google UK English Male","Microsoft Sonia","Microsoft Libby","Microsoft Ryan","Microsoft Thomas","Daniel","Kate","Serena"]:["Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Michelle","Microsoft Ana","Samantha","Alex"];
    var en=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf("en")===0;});
    var exact=en.filter(function(v){return v.lang.replace("_","-").toLowerCase()===want;});
    for(var i=0;i<pref.length;i++){ for(var j=0;j<exact.length;j++){ if(exact[j].name&&exact[j].name.indexOf(pref[i])===0) return exact[j]; } }
    if(exact.length) return exact[0];
    for(var i2=0;i2<pref.length;i2++){ for(var j2=0;j2<en.length;j2++){ if(en[j2].name&&en[j2].name.indexOf(pref[i2])===0) return en[j2]; } }
    return en[0]||null; }catch(e){ return null; } }
  function fxRender(){ var s=FX.sents[FX.i]||{en:"",es:""};
    $g("fxcnt").textContent="ORACIÓN "+(FX.i+1)+" DE "+FX.sents.length;
    $g("fxen").textContent=s.en; $g("fxes").textContent=s.es;
    $g("fxes").style.display=FX.cfg.text==="both"?"block":"none";
    $g("fxplay").textContent=FX.playing?"⏸":"▶";
    $g("fxbar").style.width=(FX.sents.length?Math.round((FX.i+1)/FX.sents.length*100):0)+"%"; }
  function fxSay(){ try{ speechSynthesis.cancel(); var s=FX.sents[FX.i]; if(!s) return;
    var u=new SpeechSynthesisUtterance(s.en); u.rate=FX.cfg.rate; var v=fxVoice(); if(v){u.voice=v;u.lang=v.lang;} else u.lang="en-US";
    u.onend=function(){ if(!FX.playing) return; if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); setTimeout(function(){ if(FX.playing) fxSay(); },420); } else { FX.playing=false; fxRender(); } };
    speechSynthesis.speak(u); }catch(e){}
  }
  window.fxToggle=function(){ if(FX.playing){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} } else { FX.playing=true; fxSay(); } fxRender(); };
  window.fxPrev=function(){ if(FX.i>0){ FX.i--; fxRender(); if(FX.playing) fxSay(); } };
  window.fxNext=function(){ if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); if(FX.playing) fxSay(); } };
})();
</script>

(function(){

        return; }
      cloudDone[storyId]=true;

  };
  (function seed(k){ var api=window.JUCUM_CONNECT;
    if(!api||!api.getCompletedParts){ if(k<20) setTimeout(function(){seed(k+1);},700); return; }

  })(0);
