 took too many time.","correct":false,"es":"Tomó demasiados tiempo.","errorWord":"many","correctWord":"much","errorType":"Too many con incontable","explanation":"“Time” es incontable: too much time."},{"text":"The form took too much times.","correct":false,"es":"Tomó demasiados tiempos.","errorWord":"times","correctWord":"time","errorType":"Incontable en plural","explanation":"Con too much: time, sin -s."}],"clue":"too much + incontable","clueExplain":"A FEW + contable plural (unos cuantos) · A LITTLE + incontable (un poco de) · TOO MANY + contable plural (demasiados) · TOO MUCH + incontable (demasiado).","correctReason":"“Too much time”: incontable con too much.","hint":"Dos preguntas: ¿el sustantivo se cuenta? y ¿la cantidad es pequeña (a few/a little) o excesiva (too many/too much)?"},{"badge":"🧴 Las botellas","options":[{"text":"She bought too many bottles for one week.","correct":true,"es":"Compró demasiadas botellas para una semana."},{"text":"She bought too much bottles for one week.","correct":false,"es":"Compró demasiado botellas.","errorWord":"much","correctWord":"many","errorType":"Too much con contable","explanation":"“Bottles” es contable plural: too many."},{"text":"She bought too many bottle for one week.","correct":false,"es":"Compró demasiadas botella.","errorWord":"bottle","correctWord":"bottles","errorType":"Singular tras too many","explanation":"“Too many” pide plural: bottles."}],"clue":"too many + plural","clueExplain":"A FEW + contable plural (unos cuantos) · A LITTLE + incontable (un poco de) · TOO MANY + contable plural (demasiados) · TOO MUCH + incontable (demasiado).","correctReason":"“Too many bottles”: plural correcto.","hint":"Dos preguntas: ¿el sustantivo se cuenta? y ¿la cantidad es pequeña (a few/a little) o excesiva (too many/too much)?"},{"badge":"🧠 La decisión","options":[{"text":"A little information was enough to decide.","correct":true,"es":"Un poco de información bastó para decidir."},{"text":"A few information was enough to decide.","correct":false,"es":"Unas cuantas información bastaron.","errorWord":"few","correctWord":"little","errorType":"A few con incontable","explanation":"“Information” es incontable: a little."},{"text":"A little informations was enough to decide.","correct":false,"es":"Un poco de informaciones bastó.","errorWord":"informations","correctWord":"information","errorType":"Incontable en plural","explanation":"“Information” nunca lleva -s."}],"clue":"a little + incontable","clueExplain":"A FEW + contable plural (unos cuantos) · A LITTLE + incontable (un poco de) · TOO MANY + contable plural (demasiados) · TOO MUCH + incontable (demasiado).","correctReason":"“A little information”: incontable bien cuantificado.","hint":"Dos preguntas: ¿el sustantivo se cuenta? y ¿la cantidad es pequeña (a few/a little) o excesiva (too many/too much)?"},{"badge":"📧 El problema","options":[{"text":"A few emails solved the whole problem.","correct":true,"es":"Unos cuantos correos resolvieron todo el problema."},{"text":"A little emails solved the whole problem.","correct":false,"es":"Un poco de correos resolvieron el problema.","errorWord":"little","correctWord":"few","errorType":"A little con contable","explanation":"“Emails” es contable plural: a few emails."},{"text":"He needs a few rest after the shift.","correct":false,"es":"Necesita unos cuantos descanso.","errorWord":"few","correctWord":"little","errorType":"A few con incontable","explanation":"“Rest” (descanso) es incontable: a little rest."}],"clue":"¿contable o no?","clueExplain":"dos sustantivos opuestos: emails se cuenta, rest no. El cuantificador debe seguir a cada uno.","correctReason":"“A few emails”: contable plural con a few.","hint":"Uno de estos sustantivos no se puede contar. Encuéntralo."},{"badge":"🍬 El azúcar","options":[{"text":"Too much sugar is bad for you.","correct":true,"es":"Demasiada azúcar te hace daño."},{"text":"Too many sugar is bad for you.","correct":false,"es":"Demasiados azúcar te hacen daño.","errorWord":"many","correctWord":"much","errorType":"Too many con incontable","explanation":"“Sugar” es incontable: too much sugar."},{"text":"Too much sugars is bad for you.","correct":false,"es":"Demasiados azúcares.","errorWord":"sugars","correctWord":"sugar","errorType":"Incontable en plural","explanation":"“Sugar” queda en singular."}],"clue":"too much + incontable","clueExplain":"A FEW + contable plural (unos cuantos) · A LITTLE + incontable (un poco de) · TOO MANY + contable plural (demasiados) · TOO MUCH + incontable (demasiado).","correctReason":"“Too much sugar”: incontable con too much.","hint":"Dos preguntas: ¿el sustantivo se cuenta? y ¿la cantidad es pequeña (a few/a little) o excesiva (too many/too much)?"},{"badge":"🧾 La boleta","options":[{"text":"Too many charges appeared on the bill.","correct":true,"es":"Aparecieron demasiados cargos en la boleta."},{"text":"Too much charges appeared on the bill.","correct":false,"es":"Apareció demasiado cargos.","errorWord":"much","correctWord":"many","errorType":"Too much con contable","explanation":"“Charges” es contable plural: too many."},{"text":"Too many charge appeared on the bill.","correct":false,"es":"Aparecieron demasiados cargo.","errorWord":"charge","correctWord":"charges","errorType":"Singular tras too many","explanation":"“Too many” pide plural: charges."}],"clue":"too many + plural","clueExplain":"A FEW + contable plural (unos cuantos) · A LITTLE + incontable (un poco de) · TOO MANY + contable plural (demasiados) · TOO MUCH + incontable (demasiado).","correctReason":"“Too many charges”: plural con too many.","hint":"Dos preguntas: ¿el sustantivo se cuenta? y ¿la cantidad es pequeña (a few/a little) o excesiva (too many/too much)?"},{"badge":"😮‍💨 El turno","options":[{"text":"She needs a little rest after the long shift.","correct":true,"es":"Necesita un poco de descanso después del turno largo."},{"text":"She needs a few rest after the long shift.","correct":false,"es":"Necesita unos cuantos descanso.","errorWord":"few","correctWord":"little","errorType":"A few con incontable","explanation":"“Rest” es incontable: a little rest."},{"text":"She needs a little rests after the long shift.","correct":false,"es":"Necesita unos descansos.","errorWord":"rests","correctWord":"rest","errorType":"Incontable en plural","explanation":"“Rest” no lleva plural aquí."}],"clue":"a little + incontable","clueExplain":"A FEW + contable plural (unos cuantos) · A LITTLE + incontable (un poco de) · TOO MANY + contable plural (demasiados) · TOO MUCH + incontable (demasiado).","correctReason":"“A little rest”: incontable con a little.","hint":"Dos preguntas: ¿el sustantivo se cuenta? y ¿la cantidad es pequeña (a few/a little) o excesiva (too many/too much)?"}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('(^|[^A-Za-z0-9_])('+escReg(o.errorWord)+')(?=$|[^A-Za-z0-9_])'),'$1<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=85?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=85?'¡Muy bien! Aprobaste esta práctica. 💪'
            :'Aún no llegas al 85%. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
</body>
</html>
