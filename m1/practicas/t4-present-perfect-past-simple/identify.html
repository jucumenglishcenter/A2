wice this week.","correct":true,"es":"Hemos llamado dos veces esta semana."},{"text":"We have call twice this week.","correct":false,"es":"Hemos llamado dos veces esta semana.","errorWord":"call","correctWord":"called","errorType":"Falta el participio","explanation":"Tras have va el participio: called."},{"text":"We has called twice this week.","correct":false,"es":"Hemos llamado esta semana.","errorWord":"has","correctWord":"have","errorType":"Concordancia have/has","explanation":"“We” usa have."}],"clue":"this week → perfect","clueExplain":"señales de tiempo TERMINADO (yesterday, ago, last…, in 2019, on Monday) → past simple. Señales de conexión con el presente (since, for, already, yet, just, ever, never, this week) → present perfect.","correctReason":"“Have called … this week”: semana aún abierta → perfect.","hint":"Busca la señal de tiempo de la oración: ella decide el tiempo verbal, no el gusto."},{"badge":"📧 Sin ignorar","options":[{"text":"He has never ignored an email.","correct":true,"es":"Nunca ha ignorado un correo."},{"text":"He has never ignore an email.","correct":false,"es":"Nunca ha ignorado un correo.","errorWord":"ignore","correctWord":"ignored","errorType":"Falta el participio","explanation":"Tras never va el participio: ignored."},{"text":"He has ignored never an email.","correct":false,"es":"Nunca ha ignorado un correo.","errorWord":"never","correctWord":"(entre has y el participio)","errorType":"Posición de never","explanation":"“Never” va entre has y el participio."}],"clue":"has + never + participio","clueExplain":"señales de tiempo TERMINADO (yesterday, ago, last…, in 2019, on Monday) → past simple. Señales de conexión con el presente (since, for, already, yet, just, ever, never, this week) → present perfect.","correctReason":"“Has never ignored”: never en su casilla, participio correcto.","hint":"Busca la señal de tiempo de la oración: ella decide el tiempo verbal, no el gusto."},{"badge":"🗓 El lunes","options":[{"text":"The refund arrived on Monday.","correct":true,"es":"El reembolso llegó el lunes."},{"text":"The refund has arrived on Monday.","correct":false,"es":"El reembolso ha llegado el lunes.","errorWord":"has","correctWord":"(nada)","errorType":"Perfect con día cerrado","explanation":"“On Monday” (pasado) es tiempo cerrado: past simple."},{"text":"The refund arrive on Monday.","correct":false,"es":"El reembolso llega el lunes.","errorWord":"arrive","correctWord":"arrived","errorType":"Presente con día pasado","explanation":"La escena es pasada: arrived."}],"clue":"día cerrado → past simple","clueExplain":"señales de tiempo TERMINADO (yesterday, ago, last…, in 2019, on Monday) → past simple. Señales de conexión con el presente (since, for, already, yet, just, ever, never, this week) → present perfect.","correctReason":"“Arrived on Monday”: día pasado con past simple.","hint":"Busca la señal de tiempo de la oración: ella decide el tiempo verbal, no el gusto."},{"badge":"🏦 La sucursal","options":[{"text":"Has she ever visited the branch?","correct":true,"es":"¿Alguna vez ha visitado la sucursal?"},{"text":"Has she ever visit the branch?","correct":false,"es":"¿Alguna vez ha visitado la sucursal?","errorWord":"visit","correctWord":"visited","errorType":"Falta el participio","explanation":"Tras el sujeto va el participio: visited."},{"text":"Have she ever visited the branch?","correct":false,"es":"¿Alguna vez ha visitado la sucursal?","errorWord":"Have","correctWord":"Has","errorType":"Concordancia have/has","explanation":"She usa has."}],"clue":"Has she ever…?","clueExplain":"señales de tiempo TERMINADO (yesterday, ago, last…, in 2019, on Monday) → past simple. Señales de conexión con el presente (since, for, already, yet, just, ever, never, this week) → present perfect.","correctReason":"“Has she ever visited?”: pregunta de experiencia correcta.","hint":"Busca la señal de tiempo de la oración: ella decide el tiempo verbal, no el gusto."},{"badge":"⏰ Hace dos horas","options":[{"text":"The team arrived two hours ago.","correct":true,"es":"El equipo llegó hace dos horas."},{"text":"The team has arrived two hours ago.","correct":false,"es":"El equipo ha llegado hace dos horas.","errorWord":"has","correctWord":"(nada)","errorType":"Perfect con ago","explanation":"“Ago” cierra el tiempo: past simple."},{"text":"The team arrived since two hours.","correct":false,"es":"El equipo llegó desde dos horas.","errorWord":"since","correctWord":"(nada)","errorType":"Since con duración","explanation":"“Two hours” es duración: se dice “two hours ago”, no “since two hours”."}],"clue":"ago → past simple","clueExplain":"señales de tiempo TERMINADO (yesterday, ago, last…, in 2019, on Monday) → past simple. Señales de conexión con el presente (since, for, already, yet, just, ever, never, this week) → present perfect.","correctReason":"“Arrived two hours ago”: past simple con ago.","hint":"“Ago” y “since” no son intercambiables. Uno cierra, el otro conecta."}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('(^|[^A-Za-z0-9_])('+escReg(o.errorWord)+')(?=$|[^A-Za-z0-9_])'),'$1<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=85?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=85?'¡Muy bien! Aprobaste esta práctica. 💪'
            :'Aún no llegas al 85%. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
</body>
</html>
