    <style>
        :root {

            --white: #FFFFFF;

            --shadow-strong: 0 8px 30px rgba(46,168,75,0.25);

        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        .header { background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%); padding:1rem 1.5rem; display:flex; align-items:center; gap:1rem; position:sticky; top:0; z-index:100; box-shadow:var(--shadow-soft); }

        .header-title { font-family:'Fredoka',sans-serif; font-size:1.1rem; font-weight:600; color:white; }
        .header-subtitle { font-size:0.8rem; color:rgba(255,255,255,0.85); margin-top:2px; }
        .progress-indicator { background:rgba(255,255,255,0.3); padding:0.4rem 0.9rem; border-radius:20px; font-weight:700; color:white; font-size:0.9rem; white-space:nowrap; }
        .progress-container { padding:0; height:6px; background:rgba(255,255,255,0.3); }

        .instructions { background:white; border-radius:16px; padding:1rem 1.25rem; margin-bottom:1.25rem; box-shadow:var(--shadow-soft); border-left:5px solid var(--primary); display:flex; gap:0.75rem; align-items:flex-start; }
        .instructions-icon { font-size:1.6rem; flex-shrink:0; }

        .question-card.hidden { display:none; }
        @keyframes slideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
        .q-header { display:flex; align-items:center; gap:0.75rem; margin-bottom:1rem; }
        .question-number { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif; font-weight:700; font-size:0.95rem; flex-shrink:0; }
        .topic-badge { display:inline-flex; align-items:center; gap:0.3rem; padding:0.2rem 0.7rem; border-radius:20px; font-size:0.72rem; font-weight:700; background:#DFF5E3; color:var(--text-medium); margin-left:auto; }
        .toggle-row { display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem; }
        .toggle-btn { border:2px solid var(--primary-light); background:#F0F8F2; color:var(--text-medium); border-radius:20px; padding:0.4rem 0.9rem; font-family:'Nunito',sans-serif; font-size:0.8rem; font-weight:700; cursor:pointer; transition:all .2s; }
        .toggle-btn:hover { background:var(--primary-light); }
        .toggle-btn.active { background:var(--primary); color:white; border-color:var(--primary); }
        .hint-box { background:#EFFAF1; border-left:4px solid var(--primary); padding:0.7rem 1rem; border-radius:0 10px 10px 0; margin-bottom:1rem; font-size:0.88rem; color:#1B5E20; line-height:1.5; display:none; }

        .hint-label { font-weight:700; color:var(--primary-dark); display:flex; align-items:center; gap:0.4rem; margin-bottom:0.2rem; font-size:0.82rem; text-transform:uppercase; letter-spacing:.5px; }
        .translation { color:var(--text-light); font-style:italic; font-size:0.88rem; margin:0.5rem 0 1rem; padding:0.6rem 0.9rem; background:#F0F8F2; border-radius:10px; display:none; }
        .translation.show { display:block; }
        .feedback { margin-top:1.25rem; border-radius:16px; overflow:hidden; display:none; box-shadow:0 4px 16px rgba(0,0,0,0.1); }
        .feedback.show { display:block; animation:fadeUp .35s ease; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        .fb-header { padding:0.9rem 1.25rem; display:flex; align-items:center; gap:0.75rem; }
        .feedback.correct .fb-header { background:linear-gradient(135deg,var(--success),var(--success-dark)); }
        .feedback.incorrect .fb-header { background:linear-gradient(135deg,var(--error),var(--error-dark)); }
        .fb-icon { font-size:1.6rem; }
        .fb-title { font-family:'Fredoka',sans-serif; font-size:1.1rem; color:white; font-weight:600; }
        .fb-subtitle { font-size:0.8rem; color:rgba(255,255,255,0.85); margin-top:1px; }
        .fb-body { background:white; border:2px solid; border-top:none; border-radius:0 0 16px 16px; padding:1.25rem; display:flex; flex-direction:column; gap:0.9rem; }
        .feedback.correct .fb-body { border-color:var(--success); }
        .feedback.incorrect .fb-body { border-color:var(--error); }
        .fb-block { border-radius:12px; padding:0.9rem 1rem; }
        .fb-block-title { font-weight:800; font-size:0.78rem; text-transform:uppercase; letter-spacing:.6px; margin-bottom:0.5rem; display:flex; align-items:center; gap:0.4rem; flex-wrap:wrap; }
        .fb-signal { background:#F0FDF4; border:1px solid #BBF7D0; }

        .fb-text { font-size:0.92rem; color:var(--text-dark); line-height:1.55; }

        .fb-compare-row:last-child { border-bottom:none; }
        .compare-label { font-size:0.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; padding:0.15rem 0.5rem; border-radius:6px; flex-shrink:0; }
        .compare-label.wrong { background:var(--error-light); color:var(--error-dark); }
        .compare-label.right { background:var(--success-light); color:var(--success-dark); }
        .compare-text { font-size:0.95rem; color:var(--text-dark); line-height:1.5; }
        .word-wrong { color:var(--error); font-weight:700; text-decoration:line-through; }
        .word-right { color:var(--success-dark); font-weight:700; }
        .fb-error { background:var(--error-light); }
        .fb-error .fb-block-title { color:var(--error-dark); }
        .error-badge { display:inline-block; background:var(--error); color:white; padding:0.2rem 0.6rem; border-radius:6px; font-size:0.75rem; font-weight:700; }
        .word-swap { display:flex; align-items:center; justify-content:center; gap:0.75rem; margin:0.6rem 0; flex-wrap:wrap; }
        .ws-box { padding:0.4rem 1rem; border-radius:8px; font-weight:700; font-size:1rem; }
        .ws-wrong { background:white; color:var(--error); border:2px solid var(--error); text-decoration:line-through; }
        .ws-arrow { font-size:1.3rem; color:var(--text-medium); }
        .ws-right { background:var(--success); color:white; }
        .error-text { font-size:0.88rem; color:var(--error-dark); line-height:1.5; }
        .fb-why { background:#F0FDF4; border:1px solid #BBF7D0; }
        .fb-why .fb-block-title { color:var(--success-dark); }
        .nav-buttons { display:flex; gap:0.75rem; margin-top:1.25rem; }
        .nav-btn { padding:0.8rem 1.2rem; border:none; border-radius:12px; font-family:'Nunito',sans-serif; font-size:0.95rem; font-weight:700; cursor:pointer; transition:all .2s; }
        .nav-btn.next { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; flex:1; }
        .nav-btn.prev { background:#F1F5F9; color:var(--text-dark); }
        .nav-btn:disabled { opacity:.4; cursor:default; }
        .nav-btn:not(:disabled):hover { transform:translateY(-2px); box-shadow:var(--shadow-soft); }
        .results-screen { display:none; text-align:center; padding:2rem 1.5rem; }
        .results-screen.show { display:block; animation:fadeUp .5s ease; }
        .results-emoji { font-size:4rem; margin-bottom:1rem; }
        .results-title { font-family:'Fredoka',sans-serif; font-size:2rem; margin-bottom:0.5rem; }
        .results-score { font-size:3rem; font-weight:800; color:var(--purple); margin:1rem 0; }
        .results-message { font-size:1.05rem; color:var(--text-medium); margin-bottom:1.5rem; }
        .stars-container { display:flex; justify-content:center; gap:0.5rem; margin:1.5rem 0; }
        .star { font-size:2.5rem; opacity:.3; transition:all .5s ease; }
        .star.earned { opacity:1; animation:starPop .5s ease; }
        @keyframes starPop { 0%{transform:scale(0)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }
        .results-buttons { display:flex; flex-direction:column; gap:1rem; margin-top:2rem; }
        .result-btn { padding:1rem 2rem; border:none; border-radius:12px; font-family:'Nunito',sans-serif; font-size:1rem; font-weight:700; cursor:pointer; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:0.5rem; transition:all .2s; }
        .result-btn.primary { background:linear-gradient(135deg,var(--purple),var(--purple-dark)); color:white; }
        .result-btn:hover { transform:translateY(-2px); box-shadow:var(--shadow-soft); }
        .q-label { font-size:0.88rem; color:var(--text-medium); font-weight:600; }
        .sentence-options { display:flex; flex-direction:column; gap:0.7rem; margin-bottom:0.5rem; }
        .sent-option { border:2.5px solid #E5E7EB; border-radius:14px; padding:1rem 1.1rem; cursor:pointer; transition:all .2s; background:white; text-align:left; font-family:'Nunito',sans-serif; display:flex; gap:0.75rem; align-items:flex-start; width:100%; }
        .sent-option:hover:not(.disabled) { border-color:var(--primary); background:var(--bg-gradient-start); transform:translateX(4px); }
        .sent-option.disabled { cursor:default; }
        .sent-option.correct { border-color:var(--success); background:var(--success-light); }
        .sent-option.incorrect { border-color:var(--error); background:var(--error-light); }
        .option-letter { width:26px; height:26px; border-radius:50%; background:var(--primary-light); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.8rem; flex-shrink:0; font-family:'Fredoka',sans-serif; }
        .sent-option.correct .option-letter { background:var(--success); color:white; }
        .sent-option.incorrect .option-letter { background:var(--error); color:white; }
        .option-text { font-size:0.97rem; color:var(--text-dark); line-height:1.5; font-weight:600; flex:1; }
        .option-status { font-size:1.1rem; flex-shrink:0; display:none; }
        .sent-option.disabled .option-status { display:block; }
        .error-highlight { color:var(--error); font-weight:800; text-decoration:underline wavy; }
        .correct-highlight { color:var(--success-dark); font-weight:800; }
    </style>

    <script>
    const quizData = [{"badge":"🧾 Los comprobantes","options":[{"text":"You keep your receipts, don't you?","correct":true,"es":"Guardas tus comprobantes, ¿no?"},{"text":"You keep your receipts, do you?","correct":false,"es":"Guardas tus comprobantes, ¿sí?","errorWord":"do","correctWord":"don't","errorType":"Polaridad de la tag","explanation":"La oración es afirmativa: la tag va negativa → don't you?"},{"text":"You keep your receipts, don't they?","correct":false,"es":"Guardas tus comprobantes, ¿no ellos?","errorWord":"they","correctWord":"you","errorType":"Pronombre de la tag","explanation":"La tag repite el sujeto: you → don't YOU?"}],"clue":"afirmación → tag negativa","clueExplain":"la tag invierte la polaridad (afirmación → tag negativa; negación → tag positiva), copia el MISMO auxiliar/tiempo y usa el pronombre del sujeto.","correctReason":"“…don't you?”: polaridad invertida y pronombre correcto.","hint":"Tres chequeos: ¿polaridad invertida? ¿mismo auxiliar y tiempo? ¿pronombre correcto?"},{"badge":"💧 El agua","options":[{"text":"The water is back, isn't it?","correct":true,"es":"El agua ya volvió, ¿no?"},{"text":"The water is back, is it?","correct":false,"es":"El agua volvió, ¿sí?","errorWord":"is","correctWord":"isn't","errorType":"Polaridad de la tag","explanation":"Afirmación → tag negativa: isn’t it?"},{"text":"The water is back, isn't she?","correct":false,"es":"El agua volvió, ¿no ella?","errorWord":"she","correctWord":"it","errorType":"Pronombre de la tag","explanation":"“The water” = it: isn’t IT?"}],"clue":"afirmación → tag negativa","clueExplain":"la tag invierte la polaridad (afirmación → tag negativa; negación → tag positiva), copia el MISMO auxiliar/tiempo y usa el pronombre del sujeto.","correctReason":"“…isn't it?”: mismo verbo, polaridad opuesta, pronombre it.","hint":"Tres chequeos: ¿polaridad invertida? ¿mismo auxiliar y tiempo? ¿pronombre correcto?"},{"badge":"💸 Los cargos","options":[{"text":"The fees are hidden, aren't they?","correct":true,"es":"Los cargos están escondidos, ¿no?"},{"text":"The fees are hidden, aren't it?","correct":false,"es":"Los cargos están escondidos, ¿no eso?","errorWord":"it","correctWord":"they","errorType":"Pronombre de la tag","explanation":"“The fees” es plural: aren’t THEY?"},{"text":"The fees are hidden, don't they?","correct":false,"es":"Los cargos están escondidos, ¿no?","errorWord":"don't","correctWord":"aren't","errorType":"Auxiliar de la tag","explanation":"La oración usa are: la tag copia ese verbo → aren’t they?"}],"clue":"la tag copia el auxiliar","clueExplain":"la tag invierte la polaridad (afirmación → tag negativa; negación → tag positiva), copia el MISMO auxiliar/tiempo y usa el pronombre del sujeto.","correctReason":"“…aren't they?”: copia “are”, invierte y usa they.","hint":"Tres chequeos: ¿polaridad invertida? ¿mismo auxiliar y tiempo? ¿pronombre correcto?"},{"badge":"🏠 Desde casa","options":[{"text":"Carlos can work from home, can't he?","correct":true,"es":"Carlos puede trabajar desde casa, ¿no?"},{"text":"Carlos can work from home, doesn't he?","correct":false,"es":"Carlos puede trabajar desde casa, ¿no?","errorWord":"doesn't","correctWord":"can't","errorType":"Auxiliar de la tag","explanation":"La oración usa can: la tag lo copia → can’t he?"},{"text":"Carlos can work from home, can't she?","correct":false,"es":"Carlos puede trabajar desde casa, ¿no ella?","errorWord":"she","correctWord":"he","errorType":"Pronombre de la tag","explanation":"Carlos = he: can’t HE?"}],"clue":"la tag copia el modal","clueExplain":"la tag invierte la polaridad (afirmación → tag negativa; negación → tag positiva), copia el MISMO auxiliar/tiempo y usa el pronombre del sujeto.","correctReason":"“…can't he?”: modal copiado, polaridad invertida.","hint":"Tres chequeos: ¿polaridad invertida? ¿mismo auxiliar y tiempo? ¿pronombre correcto?"},{"badge":"👩‍💼 La gerente","options":[{"text":"The manager answers fast, doesn't she?","correct":true,"es":"La gerente responde rápido, ¿no?"},{"text":"The manager answers fast, isn't she?","correct":false,"es":"La gerente responde rápido, ¿no es?","errorWord":"isn't","correctWord":"doesn't","errorType":"Auxiliar de la tag","explanation":"“Answers” es verbo normal en presente: la tag usa doesn’t."},{"text":"The manager answers fast, doesn't it?","correct":false,"es":"La gerente responde rápido, ¿no eso?","errorWord":"it","correctWord":"she","errorType":"Pronombre de la tag","explanation":"La gerente = she: doesn’t SHE?"}],"clue":"verbo normal → does/doesn’t","clueExplain":"la tag invierte la polaridad (afirmación → tag negativa; negación → tag positiva), copia el MISMO auxiliar/tiempo y usa el pronombre del sujeto.","correctReason":"“…doesn't she?”: verbo normal toma su auxiliar do/does en la tag.","hint":"¿La oración usa to be, un modal… o un verbo normal? Eso elige el auxiliar de la colita."},{"badge":"💳 El doble cobro","options":[{"text":"They won't charge us twice, will they?","correct":true,"es":"No nos cobrarán dos veces, ¿verdad?"},{"text":"They won't charge us twice, do they?","correct":false,"es":"No nos cobrarán dos veces, ¿sí?","errorWord":"do","correctWord":"will","errorType":"Auxiliar de la tag","explanation":"La oración usa won’t (will): la tag copia will → will they?"},{"text":"They won't charge us twice, will it?","correct":false,"es":"No nos cobrarán, ¿verdad eso?","errorWord":"it","correctWord":"they","errorType":"Pronombre de la tag","explanation":"They → will THEY?"}],"clue":"negación → tag positiva","clueExplain":"la tag invierte la polaridad (afirmación → tag negativa; negación → tag positiva), copia el MISMO auxiliar/tiempo y usa el pronombre del sujeto.","correctReason":"“…will they?”: won’t (negativo) → tag positiva con will.","hint":"Tres chequeos: ¿polaridad invertida? ¿mismo auxiliar y tiempo? ¿pronombre correcto?"},{"badge":"✍️ La firma","options":[{"text":"You haven't signed yet, have you?","correct":true,"es":"Todavía no has firmado, ¿verdad?"},{"text":"You haven't signed yet, hasn't you?","correct":false,"es":"No has firmado, ¿no has?","errorWord":"hasn't","correctWord":"have","errorType":"Polaridad y concordancia","explanation":"Negación → tag POSITIVA, y con you va have: have you?"},{"text":"You haven't signed yet, do you?","correct":false,"es":"No has firmado, ¿sí?","errorWord":"do","correctWord":"have","errorType":"Auxiliar de la tag","explanation":"La oración usa have (perfect): la tag copia have → have you?"}],"clue":"negación → tag positiva","clueExplain":"la tag invierte la polaridad (afirmación → tag negativa; negación → tag positiva), copia el MISMO auxiliar/tiempo y usa el pronombre del sujeto.","correctReason":"“…have you?”: tag positiva copiando el auxiliar del perfect.","hint":"Tres chequeos: ¿polaridad invertida? ¿mismo auxiliar y tiempo? ¿pronombre correcto?"},{"badge":"💪 Lucia","options":[{"text":"Lucia didn't give up, did she?","correct":true,"es":"Lucía no se rindió, ¿verdad?"},{"text":"Lucia didn't give up, doesn't she?","correct":false,"es":"Lucía no se rindió, ¿no?","errorWord":"doesn't","correctWord":"did","errorType":"Tiempo de la tag","explanation":"La oración está en pasado (didn’t): la tag copia did → did she?"},{"text":"Lucia didn't give up, did he?","correct":false,"es":"Lucía no se rindió, ¿verdad él?","errorWord":"he","correctWord":"she","errorType":"Pronombre de la tag","explanation":"Lucía = she: did SHE?"}],"clue":"la tag copia el tiempo","clueExplain":"la tag invierte la polaridad (afirmación → tag negativa; negación → tag positiva), copia el MISMO auxiliar/tiempo y usa el pronombre del sujeto.","correctReason":"“…did she?”: pasado copiado, tag positiva, pronombre she.","hint":"Tres chequeos: ¿polaridad invertida? ¿mismo auxiliar y tiempo? ¿pronombre correcto?"},{"badge":"📋 Los formularios","options":[{"text":"The forms aren't long, are they?","correct":true,"es":"Los formularios no son largos, ¿verdad?"},{"text":"The forms aren't long, were they?","correct":false,"es":"Los formularios no eran largos, ¿verdad?","errorWord":"were","correctWord":"are","errorType":"Tiempo de la tag","explanation":"La oración está en presente (aren’t): la tag copia are → are they?"},{"text":"The forms aren't long, are it?","correct":false,"es":"Los formularios no son largos, ¿eso?","errorWord":"it","correctWord":"they","errorType":"Pronombre de la tag","explanation":"“The forms” es plural: are THEY?"}],"clue":"mismo tiempo en la tag","clueExplain":"la tag invierte la polaridad (afirmación → tag negativa; negación → tag positiva), copia el MISMO auxiliar/tiempo y usa el pronombre del sujeto.","correctReason":"“…are they?”: presente copiado y pronombre plural.","hint":"Tres chequeos: ¿polaridad invertida? ¿mismo auxiliar y tiempo? ¿pronombre correcto?"},{"badge":"🏢 La oficina","options":[{"text":"The office isn't open, is it?","correct":true,"es":"La oficina no está abierta, ¿verdad?"},{"text":"The office isn't open, was it?","correct":false,"es":"La oficina no estaba abierta, ¿verdad?","errorWord":"was","correctWord":"is","errorType":"Tiempo de la tag","explanation":"La oración está en presente: is it?"},{"text":"The office isn't open, is she?","correct":false,"es":"La oficina no está abierta, ¿ella?","errorWord":"she","correctWord":"it","errorType":"Pronombre de la tag","explanation":"“The office” = it: is IT?"}],"clue":"negación → tag positiva","clueExplain":"la tag invierte la polaridad (afirmación → tag negativa; negación → tag positiva), copia el MISMO auxiliar/tiempo y usa el pronombre del sujeto.","correctReason":"“…is it?”: tag positiva en presente con it.","hint":"Tres chequeos: ¿polaridad invertida? ¿mismo auxiliar y tiempo? ¿pronombre correcto?"},{"badge":"🚚 El equipo","options":[{"text":"The team will come today, won't it?","correct":true,"es":"El equipo vendrá hoy, ¿no?"},{"text":"The team will come today, will it?","correct":false,"es":"El equipo vendrá hoy, ¿sí?","errorWord":"will","correctWord":"won't","errorType":"Polaridad de la tag","explanation":"Afirmación → tag negativa: won’t it?"},{"text":"The team will come today, doesn't it?","correct":false,"es":"El equipo vendrá hoy, ¿no?","errorWord":"doesn't","correctWord":"won't","errorType":"Auxiliar de la tag","explanation":"La oración usa will: la tag copia will → won’t it?"}],"clue":"will → won’t en la tag","clueExplain":"la tag invierte la polaridad (afirmación → tag negativa; negación → tag positiva), copia el MISMO auxiliar/tiempo y usa el pronombre del sujeto.","correctReason":"“…won't it?”: will copiado y polaridad invertida.","hint":"Tres chequeos: ¿polaridad invertida? ¿mismo auxiliar y tiempo? ¿pronombre correcto?"},{"badge":"🔧 La tubería","options":[{"text":"They have fixed the pipe, haven't they?","correct":true,"es":"Ya arreglaron la tubería, ¿no?"},{"text":"They have fixed the pipe, haven't it?","correct":false,"es":"Ya arreglaron la tubería, ¿no eso?","errorWord":"it","correctWord":"they","errorType":"Pronombre de la tag","explanation":"They → haven’t THEY?"},{"text":"They have fixed the pipe, didn't they?","correct":false,"es":"Ya arreglaron la tubería, ¿no?","errorWord":"didn't","correctWord":"haven't","errorType":"Auxiliar de la tag","explanation":"La oración usa have (perfect): la tag copia have → haven’t they?"}],"clue":"perfect → have en la tag","clueExplain":"la tag invierte la polaridad (afirmación → tag negativa; negación → tag positiva), copia el MISMO auxiliar/tiempo y usa el pronombre del sujeto.","correctReason":"“…haven't they?”: el perfect presta su have a la tag.","hint":"Tres chequeos: ¿polaridad invertida? ¿mismo auxiliar y tiempo? ¿pronombre correcto?"},{"badge":"📞 La llamada","options":[{"text":"The call wasn't long, was it?","correct":true,"es":"La llamada no fue larga, ¿verdad?"},{"text":"The call wasn't long, isn't it?","correct":false,"es":"La llamada no es larga, ¿no?","errorWord":"isn't","correctWord":"was","errorType":"Tiempo y polaridad","explanation":"La oración es pasada y negativa: tag positiva en pasado → was it?"},{"text":"The call wasn't long, was she?","correct":false,"es":"La llamada no fue larga, ¿ella?","errorWord":"she","correctWord":"it","errorType":"Pronombre de la tag","explanation":"“The call” = it: was IT?"}],"clue":"mismo tiempo en la tag","clueExplain":"la tag invierte la polaridad (afirmación → tag negativa; negación → tag positiva), copia el MISMO auxiliar/tiempo y usa el pronombre del sujeto.","correctReason":"“…was it?”: pasado copiado, tag positiva.","hint":"Tres chequeos: ¿polaridad invertida? ¿mismo auxiliar y tiempo? ¿pronombre correcto?"},{"badge":"📄 El contrato","options":[{"text":"He didn't read the contract, did he?","correct":true,"es":"No leyó el contrato, ¿verdad?"},{"text":"He didn't read the contract, doesn't he?","correct":false,"es":"No lee el contrato, ¿no?","errorWord":"doesn't","correctWord":"did","errorType":"Tiempo de la tag","explanation":"La oración es pasada (didn’t): la tag copia did → did he?"},{"text":"He didn't read the contract, did she?","correct":false,"es":"No leyó el contrato, ¿ella?","errorWord":"she","correctWord":"he","errorType":"Pronombre de la tag","explanation":"He → did HE?"}],"clue":"negación → tag positiva","clueExplain":"la tag invierte la polaridad (afirmación → tag negativa; negación → tag positiva), copia el MISMO auxiliar/tiempo y usa el pronombre del sujeto.","correctReason":"“…did he?”: pasado y pronombre correctos.","hint":"Tres chequeos: ¿polaridad invertida? ¿mismo auxiliar y tiempo? ¿pronombre correcto?"},{"badge":"📝 Por escrito","options":[{"text":"We should complain in writing, shouldn't we?","correct":true,"es":"Deberíamos reclamar por escrito, ¿no?"},{"text":"We should complain in writing, should we?","correct":false,"es":"Deberíamos reclamar, ¿sí?","errorWord":"should","correctWord":"shouldn't","errorType":"Polaridad de la tag","explanation":"Afirmación → tag negativa: shouldn’t we?"},{"text":"We should complain in writing, shouldn't they?","correct":false,"es":"Deberíamos reclamar, ¿no ellos?","errorWord":"they","correctWord":"we","errorType":"Pronombre de la tag","explanation":"We → shouldn’t WE?"}],"clue":"afirmación → tag negativa","clueExplain":"la tag invierte la polaridad (afirmación → tag negativa; negación → tag positiva), copia el MISMO auxiliar/tiempo y usa el pronombre del sujeto.","correctReason":"“…shouldn't we?”: modal copiado e invertido.","hint":"Tres chequeos: ¿polaridad invertida? ¿mismo auxiliar y tiempo? ¿pronombre correcto?"}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('(^|[^A-Za-z0-9_])('+escReg(o.errorWord)+')(?=$|[^A-Za-z0-9_])'),'$1<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=85?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=85?'¡Muy bien! Aprobaste esta práctica. 💪'
            :'Aún no llegas al 85%. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
</body>
