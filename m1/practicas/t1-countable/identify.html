        .error-highlight { color:var(--error); font-weight:800; text-decoration:underline wavy; }
        .correct-highlight { color:var(--success-dark); font-weight:800; }

oney, water, time, data…) no llevan plural ni a/an y usan MUCH; los contables usan MANY y sí tienen plural.","correctReason":"“There was water”: incontable con verbo singular y sin artículo.","hint":"Primero clasifica el sustantivo: ¿se puede contar de a uno? Eso decide much/many, el plural y el artículo."},{"badge":"📱 El plan","options":[{"text":"Nadia pays a lot of money for her phone plan.","correct":true,"es":"Nadia paga mucho dinero por su plan de teléfono."},{"text":"Nadia pays many money for her phone plan.","correct":false,"es":"Nadia paga muchos dineros.","errorWord":"many","correctWord":"a lot of","errorType":"Many con incontable","explanation":"“Money” es incontable: a lot of / much money."},{"text":"Nadia pays a lot of moneys for her phone plan.","correct":false,"es":"Nadia paga muchos dineros.","errorWord":"moneys","correctWord":"money","errorType":"Incontable en plural","explanation":"“Money” no tiene plural."}],"clue":"money = incontable","clueExplain":"incontables (information, advice, money, water, time, data…) no llevan plural ni a/an y usan MUCH; los contables usan MANY y sí tienen plural.","correctReason":"“A lot of money”: cuantificador válido para incontable.","hint":"Primero clasifica el sustantivo: ¿se puede contar de a uno? Eso decide much/many, el plural y el artículo."},{"badge":"💰 Los costos","options":[{"text":"How much will the new part cost?","correct":true,"es":"¿Cuánto costará el repuesto nuevo?"},{"text":"How many money do they need for the repair?","correct":false,"es":"¿Cuánto dinero necesitan?","errorWord":"many","correctWord":"much","errorType":"Many con incontable","explanation":"“Money” es incontable: how much money."},{"text":"How much emails did you send to the office?","correct":false,"es":"¿Cuántos correos enviaste?","errorWord":"much","correctWord":"many","errorType":"Much con contable","explanation":"“Emails” es contable plural: how many emails."}],"clue":"how much / how many","clueExplain":"HOW MUCH pregunta por incontables; HOW MANY por contables en plural. Cada oración prueba un caso.","correctReason":"“How much will it cost?” pregunta por dinero (incontable) sin sustantivo: correcto.","hint":"Tres preguntas distintas: clasifica el sustantivo de cada una antes de juzgar."},{"badge":"📧 Los correos","options":[{"text":"Two emails arrived with the confirmation number.","correct":true,"es":"Llegaron dos correos con el número de confirmación."},{"text":"Two email arrived with the confirmation number.","correct":false,"es":"Llegaron dos correo.","errorWord":"email","correctWord":"emails","errorType":"Plural sin -s","explanation":"“Two” exige plural: two emails."},{"text":"There was two emails with the confirmation number.","correct":false,"es":"Había dos correos.","errorWord":"was","correctWord":"were","errorType":"Concordancia","explanation":"“Two emails” es plural: there were."}],"clue":"contables en plural","clueExplain":"incontables (information, advice, money, water, time, data…) no llevan plural ni a/an y usan MUCH; los contables usan MANY y sí tienen plural.","correctReason":"“Two emails arrived”: plural correcto con su verbo.","hint":"Primero clasifica el sustantivo: ¿se puede contar de a uno? Eso decide much/many, el plural y el artículo."},{"badge":"📄 El contrato","options":[{"text":"The contract listed extra fees at the bottom.","correct":true,"es":"El contrato listaba cargos extra al final."},{"text":"The contract listed much extra fees at the bottom.","correct":false,"es":"El contrato listaba muchos cargos extra.","errorWord":"much","correctWord":"(nada)","errorType":"Much con contable","explanation":"“Fees” es contable plural: many fees (o sin cuantificador)."},{"text":"The contract listed extra fee at the bottom.","correct":false,"es":"El contrato listaba cargo extra.","errorWord":"fee","correctWord":"fees","errorType":"Contable singular suelto","explanation":"Un contable singular no va solo: “a fee” o el plural “fees”."}],"clue":"fees = contable","clueExplain":"inconta  plural ni a/an y usan MUCH; los contables usan MANY y sí tienen plural.","correctReason":"“How many forms”: contable plural con many.","hint":"Primero clasifica el sustantivo: ¿se puede contar de a uno? Eso decide much/many, el plural y el artículo."},{"badge":"📶 Los datos","options":[{"text":"She didn't use much data during the trip.","correct":true,"es":"No usó muchos datos durante el viaje."},{"text":"She didn't use many data during the trip.","correct":false,"es":"No usó muchos datos.","errorWord":"many","correctWord":"much","errorType":"Many con incontable","explanation":"En inglés cotidiano “data” funciona como incontable: much data."},{"text":"She didn't use much datas during the trip.","correct":false,"es":"No usó muchos datas.","errorWord":"datas","correctWord":"data","errorType":"Incontable en plural","explanation":"“Data” no lleva -s."}],"clue":"data = incontable","clueExplain":"incontables (information, advice, money, water, time, data…) no llevan plural ni a/an y usan MUCH; los contables usan MANY y sí tienen plural.","correctReason":"“Much data”: el consumo de datos se mide como incontable.","hint":"Primero clasifica el sustantivo: ¿se puede contar de a uno? Eso decide much/many, el plural y el artículo."},{"badge":"✍️ La carta","options":[{"text":"Many neighbors signed the complaint letter.","correct":true,"es":"Muchos vecinos firmaron la carta de reclamo."},{"text":"Much neighbors signed the complaint letter.","correct":false,"es":"Mucho vecinos firmaron.","errorWord":"Much","correctWord":"Many","errorType":"Much con contable","explanation":"“Neighbors” es contable plural: many."},{"text":"Many neighbor signed the complaint letter.","correct":false,"es":"Muchos vecino firmaron.","errorWord":"neighbor","correctWord":"neighbors","errorType":"Singular tras many","explanation":"“Many” pide plural: neighbors."}],"clue":"many + plural","clueExplain":"incontables (information, advice, money, water, time, data…) no llevan plural ni a/an y usan MUCH; los contables usan MANY y sí tienen plural.","correctReason":"“Many neighbors”: many con su plural.","hint":"Primero clasifica el sustantivo: ¿se puede contar de a uno? Eso decide much/many, el plural y el artículo."},{"badge":"🗂 La decisión","options":[{"text":"We need a lot of information before deciding.","correct":true,"es":"Necesitamos mucha información antes de decidir."},{"text":"We need a lot of informations before deciding.","correct":false,"es":"Necesitamos muchas informaciones.","errorWord":"informations","correctWord":"information","errorType":"Incontable en plural","explanation":"“Information” nunca lleva -s."},{"text":"How many money did they charge you?","correct":false,"es":"¿Cuánto dinero te cobraron?","errorWord":"many","correctWord":"much","errorType":"Many con incontable","explanation":"“Money” es incontable: how much money."}],"clue":"clasifica el sustantivo","clueExplain":"dos incontables famosos (information, money) puestos a prueba en oraciones distintas.","correctReason":"“A lot of information”: incontable bien tratado.","hint":"Ninguna -s ni many debería tocar a estos dos sustantivos."},{"badge":"🔩 Las tuberías","options":[{"text":"The team didn't fix many pipes before the weekend.","correct":true,"es":"El equipo no arregló muchas tuberías antes del fin de semana."},{"text":"The team didn't fix much pipes before the weekend.","correct":false,"es":"No arregló mucho tuberías.","errorWord":"much","correctWord":"many","errorType":"Much con contable","explanation":"“Pipes” es contable plural: many pipes."},{"text":"The team didn't fix many pipe before the weekend.","correct":false,"es":"No arregló muchas tubería.","errorWord":"pipe","correctWord":"pipes","errorType":"Singular tras many","explanation":"“Many” pide plural: pipes."}],"clue":"many + plural","clueExplain":"incontables (information, advice, money, water, time, data…) no llevan plural ni a/an y usan MUCH; los contables usan MANY y sí tienen plural.","correctReason":"“Many pipes”: contable plural con many.","hint":"Primero clasifica el sustantivo: ¿se puede contar de a uno? Eso decide much/many, el plural y el artículo."},{"badge":"🏢 La oficina","options":[{"text":"The office doesn't have much equipment.","correct":true,"es":"La oficina no tiene mucho equipamiento."},{"text":"The office doesn't have many equipment.","correct":false,"es":"No tiene muchos equipamientos.","errorWord":"many","correctWord":"much","errorType":"Many con incontable","explanation":"“Equipment” es incontable: much equipment."},{"text":"The office doesn't have much equipments.","correct":false,"es":"No tiene muchos equipamientos.","errorWord":"equipments","correctWord":"equipment","errorType":"Incontable en plural","explanation":"“Equipment” no tiene plural."}],"clue":"equipment = incontable","clueExplain":"incontables (information, advice, money, water, time, data…) no llevan plural ni a/an y usan MUCH; los contables usan MANY y sí tienen plural.","correctReason":"“Much equipment”: incontable sin plural.","hint":"Primero clasifica el sustantivo: ¿se puede contar de a uno? Eso decide much/many, el plural y el artículo."}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('(^|[^A-Za-z0-9_])('+escReg(o.errorWord)+')(?=$|[^A-Za-z0-9_])'),'$1<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=85?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=85?'¡Muy bien! Aprobaste esta práctica. 💪'
            :'Aún no llegas al 85%. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
</body>
</html>
